# 배포 실효 가드(story #2174) 선언 목록 — infra/check_serving_reality.py 가 읽는다.
#
# ## 이 파일의 성격 — "정상"이 아니라 "알고 있다"의 선언이다
#
# 여기 등재하는 것은 그 상태가 옳다는 뜻이 아니라, **사람이 보고 판단했고 언제까지
# 두기로 했는지**를 남기는 것이다. 가드가 노이즈가 되면 아무도 안 보게 되므로 의도적
# 고정(롤백·카나리)까지 실패로 만들지 않되(story AC3), 그 대가로 아래를 강제한다:
#
# ```
# reason        필수 — 사유 없는 선언은 다음 사람이 판단할 수 없다
# declared_by   필수 — 누가 판단했는지
# until         필수 — **만료일. 지나면 가드가 FAIL 한다.**
# ```
#
# ⭐`until` 이 필수인 이유가 이 저장소의 오늘자 교훈이다. 이 가드가 감시하는 결함군
# (#2128·#2160·#2161·#2174·#2182)의 공통 뿌리는 **"끝났다는 통지가 사라지면 시스템이
# 그 상태를 영영 놓지 못한다"** 이다. 허용목록도 똑같다 — 한 번 등재하면 아무도 다시
# 안 본다. 그래서 선언 자체가 스스로 만료된다. 가드가 감시하는 원칙을 가드 자신이 지킨다.
#
# ⚠️등재돼 있는데 라이브가 이미 정상이면 그것도 FAIL 이다 — 사실보다 오래 사는 선언은
# 다음에 생길 진짜 건을 "아, 그거 등재된 거야"로 가려버린다.
#
# ⭐이 규칙은 만들자마자 실제로 값을 했다(2026-07-25, 개발 중 실증):
#   `sprintable-internal-api-dev` 를 "story #2184 로 추적 중"으로 등재했는데, 30분 뒤 그
#   상태를 고치자 **선언이 즉시 낡았고 가드가 라이브에서 그걸 잡아냈다.** 지웠다. 선언을
#   지우는 것까지가 고치는 일의 일부라는 것을 가드가 강제한다.

