# 고정돼 있었으나(story #2174 표본 A) 지금은 자동최신으로 돌아와 있는 것을 실측 확認했다.
# ⚠️누가 언제 풀었는지는 못 가른다 — 공용 자격증명이라 감사로그로도 안 갈린다.
#   그 사실 자체가 이 가드가 필요한 이유다(상태가 바뀐 것조차 아무도 선언하지 않았다).

