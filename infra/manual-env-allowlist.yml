# 증명됨). ⛔이 exempt는 "영원히 안 본다"가 아니다 — 이 5개 중 하나라도 build-frontend에
# --build-arg로 추가되는 날, 이 판정 자체를 재검토해야 한다(그 순간부터 값이 실제로
