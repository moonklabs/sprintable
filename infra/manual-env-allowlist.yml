# SSE_MULTIPLEX_ENABLED/EE_ENABLED/TOSS_CLIENT_KEY 6종)에 이 5개가 전혀 없음을 확認했다 —
# Next.js는 NEXT_PUBLIC_*을 빌드타임에 클라 번들로 인라이닝하므로, Cloud Run 런타임 env에
# 값이 있고 없고와 무관하게 이 5개는 지금 파이프라인에서 클라 코드 관점에 구조적으로 영구
