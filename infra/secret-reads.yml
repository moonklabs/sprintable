# story 4798 (AC12) — every file that reads a secret's VALUE (see infra/check_secret_reads.py for what counts). `runs_as` is the kind of identity that runs the read; `reason` says what it reads it for.
# Adding a line here is a review step: the identity that runs the read must be allowed to read exactly that secret and no other (one grant per secret, never a project-wide role).
readers:
  - file: .github/workflows/cloud-build.yml
    runs_as: the CI deploy identity
    reason: the dev deploy job reads one public client key to pass it to the build
  - file: infra/apply_cloud_scheduler.py
    runs_as: the build's own account (the dev build step), or the person running it by hand
    reason: reads the cron secret the backend service references, to put it into the scheduler jobs' authorization header
  - file: backend/scripts/deploy_realtime_gce.sh
    runs_as: the realtime gateway VM's own account
    reason: the startup script written by this deploy fetches the gateway's secrets once at boot
  - file: infra/pgbouncer/deploy_prod.sh
    runs_as: the connection pooler VM's own account
    reason: the pooler's startup script fetches its database connection string at boot
  - file: backend/app/services/github_app.py
    runs_as: the backend's runtime account
    reason: reads the GitHub App private key through the client library when its secret name is configured (not configured today)
