# D-S2/D-S7: Cloud Build — Frontend + Backend 멀티 이미지 빌드
# GCP 프로젝트: sprintable-494803 | 리전: asia-northeast3
#
# 트리거: main→prod, develop→dev (GitHub Actions cloud-build.yml)
# 이미지 태그: $COMMIT_SHA + $ENV (latest-dev / latest-prod)
# 캐시: Artifact Registry 레이어 캐시

substitutions:
  _AR_REGION: asia-northeast3
  _AR_REPO: sprintable
  _DEPLOY_ENV: dev
  _FASTAPI_URL: https://sprintable-backend-dev-787818285179.asia-northeast3.run.app
  # story #2701 — dev-safe 기본값(빈 문자열 = 이 env var 자체를 안 싣는다, 아래 deploy-mcp
  # 참조). GHA cloud-build.yml이 prod에서만 실값으로 override.
  _MCP_ALLOWED_HOSTS: ''
  _BACKEND_MIN_INSTANCES: '1'
  # ⚠️ default '1'(아래) = _DEPLOY_ENV:dev default 와 정합한 **dev-safe fallback**(수동 `gcloud builds submit`
  #    override 없을 때 무리한 maxScale 재현 차단). GHA cloud-build.yml 이 per-env override(prod=5·dev=8, #2074 응급).
  #    rollout-safe 산식(ee7794eb·dev TooManyConnections 인시던트): **2 × maxScale × (pool+overflow + raw) +
  #    headroom ≤ max_conn**. per-instance = pool(3/1=4) + pg_pubsub raw(1) = 5.
  #    ⚠️ story #2040(2026-07-20) PO gcloud 실측 갱신 — max_connections이 dev/prod 둘 다 **200**이다
  #    (dev는 100→200 그날 사고대응으로 상향). 이 주석이 한동안 100 가정으로 낡아 있었다(codex #2074
  #    조사가 재적발) — SSOT는 `docs/db-connection-budget.md`, 값 바뀌면 그 문서와 여기를 같이 갱신할 것.
  #    prod: maxScale 5 → 2×5×5+20=70 ≤ 200(여유 65%). dev: maxScale 8 → 2×8×5=80 ≤ 200(여유 60%).
  #    (PgBouncer 풀러: Cloud Run raw TCP 미지원으로 중앙 불가·관리형 풀링 Enterprise Plus 전용 → #1779
  #    폐기 이력 있음. 트래픽↑ 時 아키텍처 재검토(#2074) 필요.)
  _BACKEND_MAX_INSTANCES: '1'
  _DB_POOL_SIZE: '3'
  _DB_MAX_OVERFLOW: '1'
  # ⚠️ story #2442(2026-08-03 P0) — dev-safe fallback(위와 동일 컨벤션, #2040에서 이미 검증된
  #    dev 예산 그대로). prod override는 GHA cloud-build.yml에서 온다(_BACKEND_MAX_INSTANCES와
  #    동일 배선 패턴). prod가 겪은 실제 P0(08:44Z, QueuePool 고갈·/api/v2/health 전면 타임아웃):
  #    Cloud SQL sprintable-prod(max_connections 200)는 RUNNABLE·건강했으나, PgBouncer가 prod에
  #    없거나 무력해(db_pgbouncer=False가 코드+배포 양쪽 기본값 — 위 주석의 "PgBouncer 풀러 불가"
  #    참고) 인스턴스당 3+1=4로 tiny한 앱 풀이 Cloud SQL에 직결돼 실 동시성을 못 버텼다. PO가
  #    gcloud로 20/10(rev 00257-wdz)까지 올려 즉시 회복 확認(health 8/8 200) — 그 손 값을 SSOT로
  #    durable화한다("손 값은 다음 배포가 덮는다" 교훈 재적용).
  #    안전식(AC4, 롤아웃 배수 없이): maxScale(5)×(pool+overflow)+raw(1) = 5×30+1 = 151 ≤ 200
  #    (25% 여유). ⚠️잔여 리스크(문서화, 미해소) — `docs/db-connection-budget.md`의 롤아웃-인식
  #    산식(2×N×per_instance, N=동시생존 리비전수)으로 보면 2×5×31=310>200. main 배포 빈도가
  #    develop보다 훨씬 낮아 롤아웃 중첩 창이 짧다는 판단으로 이 잔여 리스크를 감수한다(PO 확認
  #    필요 — 재검토 트리거: num_backends가 150에 근접하거나 main 연속배포가 잦아질 때).
  # story #2445 Phase1(2026-08-03, 페드루 인프라) — dev VM PgBouncer(10.178.0.63:6432,
  # transaction-mode) 라이브 검증 완료. dev-safe 기본값 'false'(현 동작 유지 — PgBouncer
  # 미경유 시 database.py의 db_pgbouncer 코드 기본값과 동일). prod override는 없음(prod는
  # #2442에서 이미 앱 풀 20/10으로 대응 — PgBouncer 도입은 이 스토리 스코프 밖, 별건).
  # true 전환은 GHA cloud-build.yml dev 분기에서만(DATABASE_URL/DATABASE_URL_DIRECT 시크릿
  # 재바인딩과 반드시 같은 배포에 동반 — 시크릿만 바뀌고 이 값이 false면 statement_cache
  # 미비활성으로 PgBouncer 아래서 prepared statement reuse 깨짐, #1314류 재발).
  _BACKEND_DB_PGBOUNCER: 'false'
  _GA4_MEASUREMENT_ID: ""  # dev 기본값 빈 문자열 — prod 트리거에서 G-RYHFE7XM3X 주입
  # story #2078(E-ARCH 0단계) — SSE 멀티플렉서 롤백 플래그. dev-safe 기본값 'false'(수동
  # `gcloud builds submit` override 없을 때 안전). GHA가 dev 브랜치에서만 'true' 주입 —
  # prod는 develop→main 일괄승격에 검증 안 된 플래그를 얹지 않는다(오르테가군 판정,
  # 2026-07-21 — 문제 생기면 48커밋 중 원인 격리 불가라 별도 판단으로 미룸).
  _SSE_MULTIPLEX_ENABLED: "false"
  # story #2005(Phase B P1-c, E-A2A-PROTO 리라이어빌리티): Cloud Run 요청 타임아웃이
  # `deploy-backend` 스텝에 `--timeout` 플래그로 명시된 적이 한 번도 없어(grep 확認) 인프라
  # 기본값에 암묵 의존 중이었다(A2A `/rpc` 특히 `SendStreamingMessage` SSE가 사실상 무기한
  # 실행되는 배경). PO가 라이브 `gcloud`로 실측한 현재 유효값(2026-07-17, 이 세션은 gcloud
  # 접근 없이 그 실측을 신뢰): backend-prod=300s · backend-dev=3600s · mcp-prod=300s
  # (concurrency=80). 아래 기본값(3600)은 `_DEPLOY_ENV: dev` 기본값과 정합한 dev-safe
  # fallback(위 `_BACKEND_MIN_INSTANCES` 주석과 동일 컨벤션) — dev 측정값을 그대로 명시해
  # "인프라 기본값 암묵 의존"에서 "이 파일에 명시된 의도값"으로 전환한다. prod override(300)는
  # `.github/workflows/cloud-build.yml`의 `steps.env`(브랜치별 backend_timeout 산출 후
  # `--substitutions`로 주입, `_BACKEND_MAX_INSTANCES`와 동일 배선)에서 온다 — 이 저장소의
  # "트리거"는 별도 GCP Cloud Build Trigger 리소스가 아니라 그 GHA 워크플로우 자체(파일 상단
  # 주석 "트리거: main→prod, develop→dev (GitHub Actions cloud-build.yml)" 참조)라 prod override
  # 도 이 레포 안에서 완결된다(PO/infra-lane이 GCP 콘솔에서 별도로 설정할 트리거-레벨
  # override는 존재하지 않음 — 확認 후 아래 GHA 워크플로우도 함께 배선함).
  _BACKEND_TIMEOUT: '3600'

  # E-ARCH 1단계(story #2078·PR #2358 PG_LISTEN_ENABLED 배선): SSE/LISTEN 전용
  # `sprintable-realtime-${_DEPLOY_ENV}` 서비스 — REST(`sprintable-backend-*`)와 같은 이미지,
  # PG_LISTEN_ENABLED만 다르다(realtime=true·api는 FE 전환 후 PO가 별도로 false 배선 예정,
  # 이 파일은 아직 손대지 않는다 — 순서 뒤바뀌면 FE 전환 전에 api LISTEN이 꺼져 실시간이 죽는다).
  # 아래 기본값은 PO가 2026-07-21 dev에 손으로 생성·검증한 실측값을 그대로 옮긴 것
  # (`gcloud run services describe sprintable-realtime-dev` 대조 완료) — "손 값은 다음
  # 배포가 덮는다" 규율대로 이 파일에 명시해 durable화한다. 장수 SSE 연결이 콜드스타트에
  # 끊기지 않도록 minScale 2(backend는 3) · timeout 3600(요청 타임아웃 상한).
  _REALTIME_MIN_INSTANCES: '2'
  _REALTIME_MAX_INSTANCES: '8'
  _REALTIME_TIMEOUT: '3600'
  # ⛔기본값을 dev URL 에서 빈 문자열로 내린다(오르테가군 PO, 2026-07-23 prod 승격 preflight
  # 에서 적발). 이 값은 `deploy-frontend` 의 `--update-env-vars=REALTIME_URL=${_REALTIME_URL}`
  # 로 흘러 FE 의 `/api/event-stream` 프록시 목적지가 된다. 그런데 GHA 워크플로우의 prod 분기는
  # `realtime_url` output 을 아예 내보내지 않아 `_REALTIME_URL=` (빈 값)이 전달된다 —
  # **"빈 값으로 전달"이 "기본값으로 폴백"이 되는 순간 prod 프론트가 dev realtime 을 가리킨다.**
  # 그 동작에 의존해 안전을 주장할 근거가 이 저장소에 없었다(빈 값 override 를 실측한 전례 0건:
  # `_GA4_MEASUREMENT_ID` 는 기본값도 빈 문자열이라 대조가 안 되고, 나머지는 전부 비어있지 않은
  # 값을 넘긴다). ⇒ 폴백 자체를 안전한 쪽으로 뒤집는다 — 빈 값이면 FE 가 FASTAPI_URL 로 폴백하는
  # 것이 이미 설계된 동작이고(deploy-frontend 주석 "이 값을 비우면 즉시 원복"), 그것이 현행 prod
  # 동작과 정확히 같다. dev 는 워크플로우가 항상 명시값을 넘기므로 무영향(라이브 대조 확認:
  # sprintable-frontend-dev REALTIME_URL=…realtime-dev…run.app).
  # ⚠️이 한 줄은 develop 에도 같이 들어가야 한다 — 승격 브랜치에만 남으면 main/develop 이
  # 또 갈라진다(오늘 0163 에서 겪은 그 부채와 같은 종류). 별 PR 로 동반 반영할 것.
  _REALTIME_URL: ""

  # story c4c72eb1 후속(2026-07-22, GCE 조사 중 발견): `deploy-frontend` 스텝에 `--timeout`
  # 플래그가 한 번도 없었다(story #2005가 backend에서 고친 것과 동형 결함, frontend는
  # 그 처리를 안 받았음) — 인프라 기본값이 아니라 `deploy_frontend.sh`의 옛 `--timeout=60`
  # (일반 페이지 요청 기준값, `/api/event-stream` SSE 프록시 라우트 생긴 뒤 재검토 안 됨)이
  # `gcloud run deploy`의 "플래그 생략 시 기존 값 preserve" 동작으로 암묵 지속되고 있었다.
  # 라이브 실측(2026-07-22, dev/prod 둘 다 60) 그대로 여기 명시해 durable화 — **값을 올리는
  # 것이 아니라 지금 값을 IaC에 고정하는 것**(오르테가군 판정: frontend concurrency=80·
  # maxScale=3(상한 240·짧은 페이지 요청용 sizing) vs realtime concurrency=80·maxScale=8
  # (상한 640·SSE용 sizing) — SSE를 frontend에 오래 붙들면 그 작은 상한을 페이지 요청과
  # 다투게 만드는 새 병목이라, 값 인상은 브라우저→realtime 직결 설계(B) 이후로 미룸).
  # ⚠️ 현행값 고정(2026-07-22) — 이 값이 옳다는 뜻이 아니다. 브라우저 SSE가 `/api/
  # event-stream`(=이 컨테이너)을 타고 있어서 이 60초가 67.5초 주기 절단의 원인이다
  # (story #2101). SSE가 realtime에 직결하도록 정리되면 이 값은 원래 목적(짧은 페이지
  # 요청) 기준으로 재검토할 것 — "왜 60이지? 짧은데?" 하고 무심코 올리면 240 슬롯을
  # 페이지 요청과 SSE가 다투게 만드는 방향이라 근거 없이 만지지 말 것.
  _FRONTEND_TIMEOUT: '60'

  # story #2077(E-ARCH 0단계, 2026-07-24): `deploy-frontend` 스텝에 min/max-instances 플래그
  # 자체가 한 번도 없었다(backend·realtime은 둘 다 배선돼 있었는데 frontend만 빠짐 — story
  # #2005/backend와 동형 결함이 또 frontend에서 재발). "gcloud run deploy는 미지정 설정을
  # preserve"라 다음 배포가 즉시 덮진 않지만, 리뷰·재현이 불가능하고(minScale=3이 왜 3인지
  # 코드에 없음) 서비스 재생성/전체교체 경로를 타면 조용히 기본값(minScale 0)으로 복귀한다.
  # ⭐이 minScale 상향은 #2074(선생님 실기기 "채팅 첫 진입 5~8초") 응급조치다 — 근본은
  # "no available instance" abort(인스턴스 부족→콜드스타트 대기→요청 폐기). backend는 #2415로
  # SSOT에 박혀 닫혔으나 frontend는 아직 코드 밖에 떠 있었다. 아래 dev-safe 기본값은 라이브
  # 실측 그대로(2026-07-24, `gcloud run services describe sprintable-frontend-dev` 대조:
  # latestReady==latestCreated·traffic 100%인 서빙 리비전 자체를 확認, template spec만 본 것
  # 아님 — 오늘 prod FE 22시간 무실효 사고의 3축 교훈 적용). GHA가 prod에서 override(3/10).
  _FRONTEND_MIN_INSTANCES: '1'
  _FRONTEND_MAX_INSTANCES: '3'
  # concurrency=80은 Cloud Run 플랫폼 기본값과 라이브 실측(dev describe 확認)이 이미 일치 —
  # SSOT에 값을 안 박아도 드리프트 위험이 없다(플랫폼 기본값 자체가 곧 이 값). 굳이 플래그로
  # 고정하지 않는다(불필요한 명시로 "왜 80이지" 오해를 만들 필요 없음) — 판단 근거만 여기 기록.
  # startup-cpu-boost=true — `gcloud run deploy --help`: "Enabled by default when unspecified
  # on new services"(신규 서비스 생성 시엔 기본 on이라 minScale=0류처럼 조용히 꺼지는 위험은
  # 아니다). 그래도 "기존 서비스 update 시 미지정=현재값 preserve"와 "신규 생성 시 기본값"이
  # 서로 다른 경로라 애매함이 남는다 — 아래 deploy-frontend에 `--cpu-boost`로 명시해 두 경로
  # 모두 동일 결과가 되게 고정한다(dev/prod 공통값이라 별도 substitution 불필요).

  # E-ARCH 1단계 durable화 마지막 조각(story #2078, 2026-07-21 PO 손 플립 확認 후): api
  # (sprintable-backend-*)의 PG_LISTEN_ENABLED. ⚠️ 기본값 'true' — prod는 아직
  # sprintable-realtime-prod가 없다(deploy-realtime 스텝이 prod에서 스킵 중, PO 검증 전).
  # prod api를 false로 먼저 못박으면 prod 승격 시점에 LISTEN 하는 서비스가 하나도 없어
  # 실시간이 완전히 죽는 landmine이 된다 — 그래서 dev만 GHA에서 명시 override(false)하고
  # prod는 이 fallback(true)을 그대로 상속해 오늘 이전과 동일 동작을 유지한다. prod가
  # sprintable-realtime-prod 배선을 마치는 승격 시점에 GHA prod 분기에도 false를 명시할 것.
  _BACKEND_PG_LISTEN_ENABLED: 'true'

  # ⛔E-ARCH S2 정리(story #2078, 2026-07-21) — **전제가 틀렸음이 #2123에서 드러남(아래 정정
  # 참조)**: 당시 "api는 SSE를 서빙하지 않는다"고 판단해 Redis 구독(consume)을 껐다. 그런데
  # `agent_onboarding_config.py::resolve_backend_direct_url()`이 에이전트에게 `/agent/stream`
  # 접속 host로 **FASTAPI_URL(=backend-dev 자신)**을 명시 배포한다(CF-fronted 도메인 금지·
  # backend-direct 강제, SSE 버퍼링 회피 목적) — REALTIME_URL로 옮겨간 적이 없다. 즉 **에이전트
  # SSE 연결은 지금도 backend-dev가 서빙 중**(라이브 실측 2026-07-23: agent/stream 요청
  # backend-dev 95건 vs realtime-dev 2건, 24h 표본). dual_publish(발행)는 그대로 필요.
  # 기본값 'true'로 정정(과거 'false' fallback 폐기) — deploy-backend에서만 쓰이고
  # deploy-realtime은 항상 true를 직접 명시(아래, 변수 아님).
  _BACKEND_REDIS_CONSUME_ENABLED: 'true'

  # story #2123 S0-b 후속(2026-07-23, 오르테가군 PR #2416 리뷰 적발): consume만으로는
  # 부족하다 — `resolve_backplane()`이 `event_broker_redis_dispatch_enabled`도 함께 봐서
  # off면 구독은 해도 실 dispatch(=publish_event/_push_to_agent 호출)를 안 한다(순수 shadow
  # observe). 위와 같은 이유(에이전트 연결이 backend-dev에 있음)로 dispatch도 필요.
  # ⚠️중복배달 검토: dispatch는 각 서비스 **자기 프로세스의 로컬 큐/구독자**에만 push한다
  # (`_agent_connections`/`_subscribers`는 프로세스-로컬 dict, 크로스서비스 공유 없음) — 에이전트는
  # backend-dev에만 연결되고 브라우저는 realtime-dev(프론트 REALTIME_URL 프록시)에만 연결되므로,
  # 두 서비스가 동시에 dispatch=true여도 서로 다른 로컬 큐를 보는 것이라 같은 클라이언트에 2회
  # 배달되는 경로가 없다(전제: 에이전트/브라우저 연결이 겹치지 않음 — 위 라이브 카운트로 확認).
  # 기본값 'false'(dev-safe fallback) — GHA가 dev만 명시 override(true), prod는 Redis 요소
  # 자체가 없어 무의미(false 유지).
  _BACKEND_REDIS_DISPATCH_ENABLED: 'false'

  # story #2135(E-ARCH 근본, 2026-07-23 #2123 실측 적발): 이 값이 실려가는 실제 env var 키가
  # 여태 `REDIS_CONSUME_ENABLED`였다 — Settings 필드는 `event_broker_redis_consume_enabled`
  # (config.py, env_prefix 없음)라 pydantic-settings가 이 키를 매칭 못 하고 `extra="ignore"`가
  # 조용히 삼켜, 위 _BACKEND_REDIS_CONSUME_ENABLED 의도가 api에 **한 번도 적용된 적이 없었다**
  # (필드는 항상 코드 기본값 True로 남았음 — uv run 재현 + 라이브 로그 확認 완료. 결과적으로
  # "의도 false"였던 구간에도 필드는 이미 True였다는 뜻 — 아래 값 정정과 별개로 이 키 이름
  # 버그 자체는 그대로 고친다). 아래 두 곳(deploy-backend/deploy-realtime)의 env var **키
  # 이름**을 `EVENT_BROKER_REDIS_CONSUME_ENABLED`로 정정하고, **구 키(`REDIS_CONSUME_ENABLED`)
  # 는 `--remove-env-vars`로 명시 제거**한다(`--update-env-vars`는 additive라 안 지우면 두 키가
  # 라이브에 공존 — "설정돼 있네"로 오독하게 만드는 바로 그 함정, 오르테가군 PR #2416 리뷰 적발).

  # story #2123 S0-b(2026-07-23, 오르테가군 판정): wake_agent()의 크로스인스턴스 배달은
  # #2122가 병합됐어도 **발행측 스위치(FANOUT_WAKE_REDIS_ENABLED)가 꺼져 있어 무효**였다
  # (agent_gateway.py:224 — 이 플래그 off면 event_broker 완전 우회, 직접 pg_notify만 호출).
  # wake_agent 호출부(stories.py/gates.py/agents.py/agent_dispatch.py/a2a.py)는 전부 REST
  # 라우터라 REST 트래픽이 실제로 향하는 api(backend-dev)에서만 이 스위치가 의미 있다 —
  # realtime-dev/GCE는 REST를 안 받아 wake_agent()를 호출하지 않으므로 배선 불필요(#2123
  # doc §판정 종결 참조). 기본값 'false'(수동 `gcloud builds submit` dev-safe fallback,
  # prod로 잘못 흘러가도 무해) — GHA가 dev만 명시 override(true).
  _BACKEND_FANOUT_WAKE_REDIS_ENABLED: 'false'

  # story #2139/#2143 follow-up (2026-07-23, Ortega's call) -- "turn on the backplane", 3 flags.
  # Different in nature (recorded here per his instruction): PRESENCE_ONLINE has a DB fallback
  # already (not broken today -- turning it on is a freshness improvement, not a bugfix).
  # PRESENCE (chat_presence "working") is a process-local dict -- genuinely differs per GCE
  # node today (real defect). SSE_LEASE is a per-instance counter -- the global concurrent-
  # connection cap doesn't actually hold across nodes today (real defect). Default 'false'
  # (dev-safe fallback) -- GHA overrides dev only (true). Prod needs the realtime GCE 3-node
  # side turned on together (separate staged step, not this commit) -- same staging principle
  # already used for #2120/#2121/#2122.
  _BACKEND_PRESENCE_REDIS_ENABLED: 'false'
  _BACKEND_PRESENCE_ONLINE_REDIS_ENABLED: 'false'
  _BACKEND_SSE_LEASE_REDIS_ENABLED: 'false'

  # story #2158(2026-07-24) 후속(#2077에서 동반 배선) — 재생 버퍼 자체는 머지됐으나(PR #2468)
  # 이 스위치를 켤 배선이 없어 사용자 경로 재측정을 못 하고 있었다. #2158의 취지 자체가
  # "손 gcloud로 켜지 않는다"라 반드시 이 SSOT를 거친다. dev-safe 기본값 'false'(무회귀) —
  # GHA가 dev만 명시 override(true). prod는 손대지 않는다(#2158 flag 자체가 아직 라이브
  # 사용자 경로 검증 전이라 prod에 얹을 단계가 아님 — #2120/#2121/#2122와 동일 단계적 승격 원칙).
  _BACKEND_SSE_TRANSIENT_REPLAY_ENABLED: 'false'

  # ⛔story cd10e123 계열 긴급수정(2026-07-21, codex 리서치 검증 중 적발): REDIS_URL·
  # EVENT_BROKER_REDIS_DUAL_PUBLISH_ENABLED가 여태 여기 어디에도 없는 순수 수동 Cloud Run env
  # 였다 — PG_LISTEN_ENABLED는 durable화됐는데(위) 이 둘은 안 돼서, 서비스가 `--set-env-vars`로
  # 재배포/재생성되면 dispatch 관련 플래그가 조용히 기본값(false/None)으로 되돌아가고 LISTEN은
  # 이미 꺼져있어 **두 전송경로 동시 무효화(실시간 전면정지)** 조건이 성립한다. 기본값은
  # dev-safe fallback(REDIS 미설정 상태와 동등 — config.py의 "fail-safe if not configured"
  # 로직이 그대로 우아하게 no-op) — GHA가 dev/prod 실측값으로 override.
  _REDIS_URL: ''
  _BACKEND_REDIS_DUAL_PUBLISH_ENABLED: 'false'

steps:
  # ─── Frontend (Next.js standalone) ────────────────────────────────────────
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -f
      - apps/web/Dockerfile
      - -t
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${COMMIT_SHA}
      - -t
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:latest-${_DEPLOY_ENV}
      - --build-arg
      - NEXT_PUBLIC_FASTAPI_URL=${_FASTAPI_URL}
      - --build-arg
      - NEXT_PUBLIC_OAUTH_ENABLED=true
      - --build-arg
      - NEXT_PUBLIC_GA4_MEASUREMENT_ID=${_GA4_MEASUREMENT_ID}
      - --build-arg
      - NEXT_PUBLIC_SSE_MULTIPLEX_ENABLED=${_SSE_MULTIPLEX_ENABLED}
      - .
    env:
      - DOCKER_BUILDKIT=1

  # ─── Backend (FastAPI) ─────────────────────────────────────────────────────
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${COMMIT_SHA}
      - -t
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest-${_DEPLOY_ENV}
      - --cache-from
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:latest-${_DEPLOY_ENV}
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - ./backend
    env:
      - DOCKER_BUILDKIT=1

  # ─── Push images ──────────────────────────────────────────────────────────
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend
    waitFor: [build-frontend]

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend
    waitFor: [build-backend]

  # ─── Migrate DB (story dbda0baf, E-RECRUIT S13) ────────────────────────────
  # 근본원인(2026-07-05 dev 인시던트): migrate 잡이 파이프라인과 완전히 분리돼 있어 ⓐ
  # provision_migrate_job.sh 를 COMMIT_SHA 없이 수동 실행하면 마지막 `latest-${ENV}` 태그에
  # 조용히 고정되고(mutable·드리프트) ⓑ 잡 자체가 인라인 `head`(단수)로 수동 override 돼
  # migrate.sh(정본 `heads` 복수)를 안 타는 상태였다. 매 배포마다 잡을 SHA-pinned 이미지 +
  # canonical command(`/app/scripts/migrate.sh`)로 강제 재배포해 드리프트가 다시 쌓일 수 없게 한다.
  - id: update-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        GCP_PROJECT="${PROJECT_ID}" GCP_REGION="${_AR_REGION}" AR_REPO="${_AR_REPO}" COMMIT_SHA="${COMMIT_SHA}" \
          bash backend/scripts/provision_migrate_job.sh ${_DEPLOY_ENV}
    waitFor: [push-backend]

  # `gcloud run jobs execute --wait`는 잡 실패 시 비-0 exit → 이 스텝이 실패 → Cloud Build가
  # 빌드 전체를 실패 처리하고 뒤따르는 deploy-backend(waitFor 의존)는 아예 실행되지 않는다
  # (migrate 실패 시 배포 자동 abort — "잡 성공≠앱DB 배포" 상태가 재발할 수 없음). 실패는
  # Cloud Build 로그 + GHA 워크플로우 실패(빨간 X·커밋 상태)로 가시화된다.
  - id: run-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - sprintable-migrate-${_DEPLOY_ENV}
      - --region=${_AR_REGION}
      - --wait
    waitFor: [update-migrate-job]

  # ─── Deploy to Cloud Run ───────────────────────────────────────────────────
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sprintable-frontend-${_DEPLOY_ENV}
      - --image=${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/frontend:${COMMIT_SHA}
      - --region=${_AR_REGION}
      - --timeout=${_FRONTEND_TIMEOUT}
      # story #2077 — min/max-instances가 이 스텝에 한 번도 배선된 적이 없었다(backend·realtime은
      # 있었는데 frontend만 빠짐). 현행 라이브 값 그대로 IaC에 고정(값 인상 아님) — 근거는 위
      # substitutions 섹션의 _FRONTEND_MIN/MAX_INSTANCES 주석 참조.
      - --min-instances=${_FRONTEND_MIN_INSTANCES}
      - --max-instances=${_FRONTEND_MAX_INSTANCES}
      # startup-cpu-boost=true는 라이브 실측(dev describe 확認) — 근거는 위 substitutions
      # 섹션 주석 참조(minScale만큼 위험하진 않지만 명시로 애매함을 없앤다).
      - --cpu-boost
      # E-ARCH 1단계(story #2078) — /api/event-stream 프록시 라우트가 REALTIME_URL을 읽어
      # SSE/LISTEN 전용 realtime-gateway로 향한다(REALTIME_URL 없으면 기존 FASTAPI_URL로
      # 폴백 — 이 값을 비우면 코드 변경·재배포 없이 즉시 원복). --update-env-vars(additive).
      - --update-env-vars=REALTIME_URL=${_REALTIME_URL}
      - --quiet
    waitFor: [push-frontend]

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # story #2005: 요청 타임아웃 명시화(_BACKEND_TIMEOUT) — 이전엔 이 플래그 자체가 없어
        # Cloud Run 인프라 기본값에 암묵 의존했다.
        # ⭐frontend 가 NEXT_PUBLIC_FASTAPI_URL 로 backend 를 직접 호출(public 필수). --allow-
        # unauthenticated 없으면 gcloud run deploy 가 기존 IAM 을 preserve(non-deterministic)
        # → 신규/리셋 시 allUsers invoker 유실로 403(2026-06-21 prod promotion 사건).
        # OB-1: 에이전트 onboarding generator 가 읽는 backend-direct URL 을 런타임 env 로 주입.
        # ⚠️ 반드시 --update-env-vars(additive·기존 backend env[DATABASE_URL 등] 보존).
        # --set-env-vars 금지(전체 wipe). DB_POOL_SIZE/DB_MAX_OVERFLOW: story #2442(P0)부터
        # env별 substitution(_DB_POOL_SIZE/_DB_MAX_OVERFLOW, GHA per-env override, 위
        # _BACKEND_MAX_INSTANCES와 동일 배선 패턴) — dev는 #2040 검증값(3/1) 그대로, prod는
        # P0 완화값(20/10) durable화. 근거·안전식은 위 substitutions 섹션 주석 참고.
        # rollout 산식: 2×maxScale×(pool+overflow+pg_pubsub raw 1) ≤ DB max_conn — 값 바꿀 때
        # cloud-build.yml maxScale·db_pool_size/db_max_overflow output과 짝으로 검토.
        # E-ARCH 1단계(story #2078): PG_LISTEN_ENABLED durable화(dev=false·prod=true, GHA per-env).
        # ⛔E-ARCH S2 정리(story #2078) 정정(#2123): EVENT_BROKER_REDIS_CONSUME_ENABLED/_DISPATCH_
        # ENABLED durable화 — "api는 SSE 미서빙" 전제가 틀렸음이 드러나 값을 true로 정정(에이전트
        # SSE가 agent_onboarding_config.py 설계상 backend-dev를 직접 서빙). 키 이름도 story #2135
        # 에서 정정(구 `REDIS_CONSUME_ENABLED`는 Settings 필드와 안 맞아 무시되던 키) — 구 키는
        # --remove-env-vars로 명시 제거(안 지우면 두 키 공존, additive 함정).
        # story #2123 S0-b: FANOUT_WAKE_REDIS_ENABLED(dev만 true, prod는 손대지 않음).
        ENV_VARS="FASTAPI_URL=${_FASTAPI_URL},DB_POOL_SIZE=${_DB_POOL_SIZE},DB_MAX_OVERFLOW=${_DB_MAX_OVERFLOW},DB_PGBOUNCER=${_BACKEND_DB_PGBOUNCER},PG_LISTEN_ENABLED=${_BACKEND_PG_LISTEN_ENABLED},EVENT_BROKER_REDIS_CONSUME_ENABLED=${_BACKEND_REDIS_CONSUME_ENABLED},EVENT_BROKER_REDIS_DISPATCH_ENABLED=${_BACKEND_REDIS_DISPATCH_ENABLED},EVENT_BROKER_REDIS_DUAL_PUBLISH_ENABLED=${_BACKEND_REDIS_DUAL_PUBLISH_ENABLED},FANOUT_WAKE_REDIS_ENABLED=${_BACKEND_FANOUT_WAKE_REDIS_ENABLED},PRESENCE_REDIS_ENABLED=${_BACKEND_PRESENCE_REDIS_ENABLED},PRESENCE_ONLINE_REDIS_ENABLED=${_BACKEND_PRESENCE_ONLINE_REDIS_ENABLED},SSE_LEASE_REDIS_ENABLED=${_BACKEND_SSE_LEASE_REDIS_ENABLED},SSE_TRANSIENT_REPLAY_ENABLED=${_BACKEND_SSE_TRANSIENT_REPLAY_ENABLED}"
        # ⛔story #2141(2026-07-23, prod Redis Memorystore 전환): REDIS_URL을 여기서 이 스텝이
        # 예전엔 dev/prod 공용으로 plain env 넘겼다 — prod는 Secret Manager 바인딩(REDIS_URL_PROD,
        # AUTH 필요)으로 전환하는데, 같은 배포에 plain REDIS_URL 키까지 넘기면 Cloud Run이
        # "env와 secret이 동명 키"로 배포 자체를 거부한다(값 유무 무관 — 키 존재 자체가 충돌).
        # dev는 AUTH 없는 plain Memorystore라 시크릿 바인딩 자체가 없으므로 기존처럼 plain으로 넘긴다.
        # prod는 여기서 REDIS_URL을 절대 안 넘김 — 시크릿 바인딩(별도 1회 gcloud, PO lane)이
        # --set-secrets 없는 이 스텝에 preserve된다(DATABASE_URL_PROD 등 기존 15개와 동일 컨벤션).
        # ⛔story #2423 배포 실패 핫픽스(2026-07-23, 오르테가군 진단, 2차) — Cloud Build는 bash
        # 스텝 안이라도 args 문자열 전체(주석 포함 — bash에겐 주석이지만 Cloud Build 파서는
        # 주석/코드를 구분하지 않고 그냥 문자열로 훑는다)를 자기 substitution 파서로 먼저
        # 훑는다. 셸 변수 ENV_VARS는 유효한 built-in/사용자 substitution이 아니라서, 달러중괄호
        # 표기로 참조하면(이 문장처럼 예시로 적어도 마찬가지) build submit 자체가
        # INVALID_ARGUMENT로 거부된다(부분 배포 없이 안전하게 막힘 — 1차 사고와 동일 에러,
        # 이번엔 그 사고를 설명하던 주석 문장 자체가 같은 표기를 그대로 써서 재현했다). 이후
        # 이 파일 어디서도 ENV_VARS를 달러중괄호로 예시조차 적지 않는다 — 셸 변수 실참조는
        # 아래처럼 달러 두 개로 이스케이프한 표기만 쓴다(진짜 substitution인 DEPLOY_ENV 등은
        # 달러 한 개 표기 그대로 유지 — 그건 Cloud Build가 실제로 채워야 하는 값이라 안전하다).
        if [ "${_DEPLOY_ENV}" != "prod" ]; then
          ENV_VARS="$${ENV_VARS},REDIS_URL=${_REDIS_URL}"
        fi
        # story #2445 Phase1(2026-08-03) — dev만 DATABASE_URL/DATABASE_URL_DIRECT를 PgBouncer
        # 경유 시크릿으로 재바인딩(--update-secrets=additive, 기존 다른 시크릿 preserve — REDIS_URL_
        # PROD 등과 동일 컨벤션). prod는 이 플래그 자체를 안 넘겨 현재 DATABASE_URL_PROD 바인딩
        # 무변경. 시크릿 자체(DATABASE_URL_DEV_PGBOUNCER/DATABASE_URL_DIRECT_DEV)는 PO가 생성.
        SECRETS_FLAG=""
        if [ "${_DEPLOY_ENV}" == "dev" ]; then
          SECRETS_FLAG="--update-secrets=DATABASE_URL=DATABASE_URL_DEV_PGBOUNCER:latest,DATABASE_URL_DIRECT=DATABASE_URL_DIRECT_DEV:latest"
        elif [ "${_DEPLOY_ENV}" == "prod" ]; then
          # story #2445 Phase1(2026-08-04) — prod cutover: DATABASE_URL→PgBouncer VIP(DATABASE_URL_PROD_PGBOUNCER,
          # =10.178.0.111:6432), DATABASE_URL_DIRECT→직결(DATABASE_URL_PROD). _BACKEND_DB_PGBOUNCER=true와 짝.
          # 시크릿은 PO 생성·backend-prod SA(cloudrun-runtime-prod)에 secretAccessor 부여됨.
          # + DATABASE_URL_READ(#2451 §6 읽기 라우팅, rev 00266 라이브 flip): read replica DSN(PgBouncer
          #   sprintable_read 풀 경유). 지금까지 라이브 «수동 바인딩»이라 배포 SSOT 어디에도 선언이 없어
          #   env-drift-guard 축①이 매일 빨강이었다(additive --update-secrets 라 값은 보존됐으나 미선언=fragile:
          #   --set-secrets 리팩터·서비스 재생성 時 조용히 소실→reads가 primary 로 새 병목 악화). 여기 편입해 durable화.
          SECRETS_FLAG="--update-secrets=DATABASE_URL=DATABASE_URL_PROD_PGBOUNCER:latest,DATABASE_URL_DIRECT=DATABASE_URL_PROD:latest,DATABASE_URL_READ=DATABASE_URL_READ:latest"
        fi
        gcloud run deploy sprintable-backend-${_DEPLOY_ENV} \
          --image=${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${COMMIT_SHA} \
          --region=${_AR_REGION} \
          --min-instances=${_BACKEND_MIN_INSTANCES} \
          --max-instances=${_BACKEND_MAX_INSTANCES} \
          --timeout=${_BACKEND_TIMEOUT} \
          --allow-unauthenticated \
          --update-env-vars="$${ENV_VARS}" \
          $${SECRETS_FLAG} \
          --remove-env-vars=REDIS_CONSUME_ENABLED \
          --quiet
    # story dbda0baf: push-backend → run-migrate-job(위) 로 변경 — 신규 코드가 마이그 안 된
    # 스키마를 상대로 뜨는 걸 막는다(migrate 실패 시 이 스텝 자체가 안 돎).
    waitFor: [run-migrate-job]

  # E-ARCH 1단계(story #2078): sprintable-realtime-${_DEPLOY_ENV} — SSE/LISTEN 전용 서비스,
  # deploy-backend와 동일 이미지·동일 시크릿 상속(--set-secrets 없는 gcloud run deploy
  # 컨벤션 그대로 — 기존 바인딩 preserve). ⚠️ prod는 PO 검증 전이라 게이트: _DEPLOY_ENV가
  # dev가 아니면 스킵(서비스 미존재 상태에서 이 스텝이 자동 생성해버리는 것 방지 — 프로덕션
  # 승격 시점에 이 가드를 열고 _REALTIME_* 값을 prod로 배선).
  - id: deploy-realtime
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_DEPLOY_ENV}" != "dev" ]; then
          echo "skip deploy-realtime: prod gate pending (E-ARCH 1단계 dev 검증 후 오픈)"
          exit 0
        fi
        # ⛔fail-fast (오르테가군 PO 2026-07-23): `_REALTIME_URL` 기본값을 dev URL 에서 빈
        # 문자열로 내렸다(위 substitutions 주석 — prod 프론트가 dev realtime 을 가리킬 여지 제거).
        # frontend 쪽은 빈 값이 곧 "FASTAPI_URL 로 폴백"이라 안전하지만, **여기서는 빈 값이
        # 안전하지 않다** — 아래 `FASTAPI_URL=${_REALTIME_URL}` 가 빈 문자열로 나가면
        # realtime-dev 의 self URL 이 지워진다. 조용히 깨지는 대신 여기서 멈춘다.
        # 자동 경로(GHA dev 분기)는 항상 명시값을 넘기므로 이 가드에 걸릴 일이 없다 —
        # 걸린다면 substitution 없이 수동 `gcloud builds submit` 한 경우이고, 그건 정말로
        # 멈춰야 하는 상황이다.
        if [ -z "${_REALTIME_URL}" ]; then
          echo "FAIL: _REALTIME_URL 이 비어 있다. deploy-realtime 은 이 값을 realtime 서비스의"
          echo "      FASTAPI_URL 로 쓰므로 빈 값으로 진행하면 self URL 이 지워진다."
          echo "      --substitutions 에 _REALTIME_URL=<realtime 서비스 URL> 을 명시할 것."
          exit 1
        fi
        # ⚠️story #2078 긴급수정(2026-07-21): PG_LISTEN_ENABLED가 여기 true로 하드코딩돼
        # 있었다 — PO가 라이브에서 손으로 false로 전환(LISTEN 제거·Redis 단독 dispatch 확認
        # 완료)했는데, 이 스텝이 명시적으로 true를 다시 밀어넣어 **다음 배포마다 LISTEN이
        # 부활**하는 시한폭탄이었다("손 값은 배포가 덮는다" 규율의 역방향 재발 — 이번엔 배포가
        # 고침을 지우는 쪽). realtime은 이제 LISTEN이 구조적으로 불필요(Redis가 authoritative
        # dispatch) — false로 durable 고정. EVENT_BROKER_REDIS_CONSUME_ENABLED=true도 명시.
        # ⚠️#2123 정정(2026-07-23): "api는 구독 불필요"라 여기 적었었으나 틀렸다 — 에이전트
        # SSE가 backend-dev를 직접 서빙해(agent_onboarding_config.py 설계) api도 이제
        # consume+dispatch=true다(위 deploy-backend 스텝 참조). 브라우저(여기, realtime-dev)와
        # 에이전트(backend-dev)가 서로 다른 프로세스-로컬 큐만 보므로 중복배달은 없다.
        # ⚠️story #2135(2026-07-23): 이 키 이름이 여태 `REDIS_CONSUME_ENABLED`였다 —
        # Settings 필드(`event_broker_redis_consume_enabled`)와 안 맞아 pydantic이 조용히
        # 무시했다(여기서는 필드 기본값이 우연히 True라 결과만 의도와 같았음). 실제 필드가
        # 기대하는 키로 정정 — 구 키는 아래 --remove-env-vars로 명시 제거.
        # ⛔story cd10e123 긴급수정(2026-07-21, codex 리서치 검증 중 적발): REDIS_URL·
        # EVENT_BROKER_REDIS_DUAL_PUBLISH_ENABLED·EVENT_BROKER_REDIS_DISPATCH_ENABLED 셋 다
        # 여태 여기 없는 순수 수동 Cloud Run env였다 — realtime은 이미 LISTEN이 꺼져있고
        # Redis가 유일한 dispatch 경로라, 이 서비스가 재배포/재생성될 때 이 셋이 기본값
        # (false/None)으로 되돌아가면 두 전송경로 동시 무효화(실시간 전면정지)가 된다.
        # 이 스텝은 이미 dev 전용 가드(위) 안이라 true를 직접 명시해도 안전(PG_LISTEN_ENABLED=
        # false와 동일 컨벤션) — REDIS_URL만 변수(연결문자열은 환경별로 다르므로).
        #
        # story #2178(2026-07-24, 까심 #2158 회귀검증에서 적발 → PO가 전수로 넓힘): deploy-backend
        # 는 12키를 넘기는데 이 스텝은 8키뿐이라 backend·realtime 두 서비스가 다른 플래그 세트로
        # 돌고 있었다 — 그 차이 자체가 어디에도 선언된 적이 없어 "켰다"고 믿는 사고가 반복됐다
        # (#2158 SSE_TRANSIENT_REPLAY_ENABLED가 정확히 그 사고: record()는 backend-dev에서 돌아
        # 정상이었는데, 실제 브라우저 SSE를 서빙하는 건 이 realtime-dev라 replay()가 이 서비스
        # 에서 한 번도 안 돌고 있었다). 5종 전수 판정(코드 경로 실증, 값보다 "왜 다른지" 선언이
        # 본체):
        #   ⭐SSE_TRANSIENT_REPLAY_ENABLED  진짜 누락 — replay 대상 연결이 실제로 여기(realtime-
        #     dev의 agent_event_stream)에 있다. 즉시 배선(아래).
        #   ⭐SSE_LEASE_REDIS_ENABLED       진짜 누락 — events.py의 sse_lease.acquire/refresh/
        #     release가 바로 이 파일의 agent_event_stream 안에서 직접 호출된다(연결 시점·30초
        #     하트비트마다·해제 시). realtime-dev가 다인스턴스(_REALTIME_MIN/MAX_INSTANCES=2~8)
        #     라 이게 꺼져 있으면 #2121이 고치려던 전역 429/503 캡이 인스턴스별로 쪼개져 그 결함이
        #     이 서비스에서 그대로 재현된다. 즉시 배선(아래).
        #   PRESENCE_REDIS_ENABLED         의도적 off(무해) — chat_presence는 이 파일(events.py)
        #     어디에도 import/호출이 없다. 쓰기·읽기 전부 conversations.py/team_presence.py(REST
        #     라우트)에만 있어 backend-dev에서만 실행된다.
        #   PRESENCE_ONLINE_REDIS_ENABLED  의도적 off(무해) — 30초 SSE-틱 hot-path 기록은
        #     agent_gateway.py의 /agent/stream(에이전트 전용, backend-dev가 직접 서빙)에만 있다.
        #     이 파일의 agent_event_stream(브라우저 전용)엔 presence_online 참조가 전혀 없다.
        #   FANOUT_WAKE_REDIS_ENABLED      의도적 off(무해) — wake_agent()는 REST 뮤테이션
        #     라우트에서만 호출되고, 대상 큐(_agent_connections)도 에이전트 키인데 에이전트는
        #     backend-dev에만 붙는다 — realtime-dev엔 그 큐 자체가 존재한 적이 없다.
        # 위 두 건(누락)만 배선하고 나머지 셋은 의도적으로 그대로 둔다 — 한 덩어리로 "다 켜자"
        # 하지 않는다(PO 지시).
        # ⚠️이 판정이 딛고 선 전제(오르테가군 PR 리뷰 지적, 2026-07-24) — 위 세 건의 "의도적
        # off" 판정은 **"realtime-dev에는 브라우저만 붙는다"**는 현재 라우팅 전제 위에 서 있다.
        # 이 서비스는 backend와 **같은 풀 이미지**를 돌리므로 `/agent/stream`(agent_gateway.py)
        # 라우트 자체는 살아 있다 — 지금은 에이전트가 항상 backend-dev로 붙도록 배선돼 있어(
        # agent_onboarding_config.py::resolve_backend_direct_url) 무해할 뿐이다. **그 라우팅이
        # 바뀌어 에이전트가 realtime-dev에도 붙게 되면 이 판정 전체를 재검토할 것** — 오늘 이
        # 사달(#2178)의 근본원인이 정확히 "전제가 어디에도 안 적혀 있었던 것"이라, 판정 근거뿐
        # 아니라 판정이 무너지는 조건까지 여기 남긴다.
        # story #2442(P0) — 이 스텝은 위에서 이미 dev 아니면 skip 하므로 prod 값(20/10)은
        # 여기 닿지 않는다(_DEPLOY_ENV=prod면 함수 진입 전에 exit 0). 그래도 하드코딩
        # DB_POOL_SIZE=3,DB_MAX_OVERFLOW=1을 그대로 뒀었다(PO forensic 적발 — 3곳 하드코딩 중
        # 하나) — SSOT 원칙상 "우연히 같은 값"과 "명시로 같은 값"은 다르다. deploy-backend와
        # 동일한 substitution으로 교체(dev 기본값 3/1 그대로 — 값 변경 아님, 배선만 정정).
        gcloud run deploy sprintable-realtime-${_DEPLOY_ENV} \
          --image=${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${COMMIT_SHA} \
          --region=${_AR_REGION} \
          --min-instances=${_REALTIME_MIN_INSTANCES} \
          --max-instances=${_REALTIME_MAX_INSTANCES} \
          --timeout=${_REALTIME_TIMEOUT} \
          --allow-unauthenticated \
          --update-env-vars=FASTAPI_URL=${_REALTIME_URL},DB_POOL_SIZE=${_DB_POOL_SIZE},DB_MAX_OVERFLOW=${_DB_MAX_OVERFLOW},PG_LISTEN_ENABLED=false,EVENT_BROKER_REDIS_CONSUME_ENABLED=true,REDIS_URL=${_REDIS_URL},EVENT_BROKER_REDIS_DUAL_PUBLISH_ENABLED=true,EVENT_BROKER_REDIS_DISPATCH_ENABLED=true,SSE_TRANSIENT_REPLAY_ENABLED=true,SSE_LEASE_REDIS_ENABLED=true \
          --remove-env-vars=REDIS_CONSUME_ENABLED \
          --quiet
    waitFor: [run-migrate-job]

  # story #2426(2026-08-02) — MCP Cloud Run 서비스를 배포 대상에 넣는다.
  # ⛔발견 경위: `sprintable-mcp-dev` 가 2026-07-29 코드(4일 전), `sprintable-mcp-prod` 가
  # 2026-07-28 코드(main HEAD 대비 449 커밋 前)로 돌고 있었다. 넷이 **같은 backend 이미지**를
  # 쓰도록 만들어진 짝인데, 이 파일이 backend·frontend·realtime 셋만 배포하고 mcp 둘은
  # 목록 밖이었다. `.github` 전체에 `sprintable-mcp-dev` 문자열 0건 — 아무 자동화도 없었다.
  # (`publish-mcp.yml` 은 PyPI 패키지 공개용이고 Cloud Run 과 무관하다. 「MCP 배포」라는 말이
  #  두 가지를 가리켜, 처음엔 그쪽을 원인으로 짚었다가 이미지 태그를 열어 보고 갈렸다.)
  # ⇒ 그래서 오늘 고친 MCP 인자 검증(#2412)이 **정작 그 도구를 쓰는 서버에는 안 닿아 있었다.**
  #
  # ⚠️story #2701(2026-08-17) 후속 — 위 #2426이 「env는 파이프라인 밖(손 설정)」이라 선언했던
  # 그 잔여를 여기서 닫는다. SSOT 위치 = 이 스텝(플레인 값)+아래 AGENT_API_KEY 시크릿
  # (MCP_AGENT_API_KEY_DEV/MCP_AGENT_API_KEY_PROD, Secret Manager) — backend/realtime 스텝과
  # 동일 관례(--update-env-vars additive·--update-secrets, --set-env-vars/--env-vars-file
  # 전체교체 금지 그대로 승계). `services update`→`run deploy`로 바꾸지 않는다(이미지 갱신
  # 방식 자체는 위 #2426 판단 그대로 유효 — env만 추가 배선).
  #
  # AC1 census(2026-08-17, gcloud describe 실측, 값은 기록 안 함— 이름만):
  #   dev  = MCP_TRANSPORT · SPRINTABLE_API_URL · AGENT_API_KEY(시크릿화 대상)
  #   prod = 위 셋 + MCP_ALLOWED_HOSTS(dev엔 없음 — CORS/host allowlist가 아직 dev엔
  #          불필요하다는 뜻으로 실측된 그대로 두고 조용히 안 맞춘다, 위 GHA 주석 참조)
  #
  # ⚠️realtime 과 달리 **prod 게이트를 두지 않는다** — `sprintable-mcp-prod` 는 이미 존재하고
  # 실제로 요청을 받고 있다(2026-08-02 실측). backend-prod 가 이 파이프라인으로 갱신되는데
  # mcp-prod 만 안 따라가는 것이 바로 #2426이 없애려던 «불일치»다.
  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # story #2701: MCP_TRANSPORT·SPRINTABLE_API_URL은 dev/prod 공통 배선(SPRINTABLE_API_URL은
        # 이 파일 다른 스텝의 _FASTAPI_URL과 값 동일 — 새 substitution 안 만들고 재사용).
        # MCP_ALLOWED_HOSTS는 dev에서 빈 문자열(_MCP_ALLOWED_HOSTS 기본값)이면 그 키 자체를
        # 안 싣는다 — 명시로 빈 값을 실으면 "값 없음"과 "빈 문자열"이 앱 입장에서 다른 뜻일 수
        # 있어(예: allowlist 빈 배열=전부 거부 vs 미설정=검증 스킵) 오늘 실측 그대로(dev엔 이
        # 키가 없다)를 보존한다.
        #
        # ⛔fix(디디 교차QA, 2026-08-17) — prod 실값(mcp.sprintable.ai 등 호스트 둘을 콤마로
        # 이은 문자열)이 이 파이프라인을 두 겹으로 지난다: ①GHA→cloudbuild `--substitutions=`
        # 조립(그 자체가 comma-분리 ArgDict) ②아래 `--update-env-vars=`(마찬가지로 comma-분리
        # ArgDict). 값 안의 콤마가 둘 중 어느 층에서든 "다음 key=value의 시작"으로 오인되면
        # CLI 파싱이 죽는다(dev는 이 값이 비어 있어 검증 경로에서 안 드러났던 함정). ①은 GHA
        # output을 `|` 구분자로 나르는 것으로 이미 해소(위 cloud-build.yml 주석 참조·
        # ${_MCP_ALLOWED_HOSTS}는 여기 도달할 때 이미 `|`-구분 상태). ②는 gcloud의 커스텀
        # ArgDict 구분자 이스케이프(`gcloud topic escaping`) — 아래서 `^;^` 접두로 이 플래그의
        # 구분자를 `,`에서 `;`로 바꿔, 값 안의 콤마가 안전한 리터럴이 되게 한다(모든 하위
        # key=value를 `;`로 나열).
        ENV_VARS="MCP_TRANSPORT=http;SPRINTABLE_API_URL=${_FASTAPI_URL}"
        if [ -n "${_MCP_ALLOWED_HOSTS}" ]; then
          MCP_ALLOWED_HOSTS_COMMA=$(printf '%s' "${_MCP_ALLOWED_HOSTS}" | tr '|' ',')
          ENV_VARS="$${ENV_VARS};MCP_ALLOWED_HOSTS=$${MCP_ALLOWED_HOSTS_COMMA}"
        fi
        # AGENT_API_KEY — story #2701(PO 판정, 2026-08-17): plain substitution 금지(cloudbuild.yaml은
        # git 파일 — API 키 평문 커밋 사고 방지). dev/prod 각자 라이브 값을 그대로 Secret Manager로
        # 1회 이관(MCP_AGENT_API_KEY_DEV/_PROD, 키 회전 아님·사본 이동)해 backend deploy-backend
        # 스텝의 DATABASE_URL_* secretKeyRef 관례를 그대로 재사용한다.
        #
        # ⛔hotfix(P0, 2026-08-17) — 첫 실배포(d9f852e7)가 이 스텝에서 죽었다:
        # `ERROR: Cannot update environment variable [AGENT_API_KEY] to the given type because
        # it has already been set with a different type` — AGENT_API_KEY가 이미 **plain env**로
        # 서빙 중인 상태에서 같은 이름을 `--update-secrets`로 시크릿 타입 전환하려 하면 gcloud가
        # 거부한다(타입 충돌, additive 확장이 아니라 같은 키의 종류를 바꾸는 것이라 별개 취급).
        # `--remove-env-vars`로 plain 쪽을 먼저 걷어내고 `--update-secrets`로 시크릿을 얹는 걸
        # **같은 gcloud 호출**에 조합 — 이러면 새 revision 하나로 원자 전환되고(순단 없음), plain
        # 값이 잔존하는 창도 없다. 이후 배포부터는 AGENT_API_KEY가 이미 시크릿이라 remove가
        # no-op(이미 없는 env var 제거 시도 — gcloud는 이를 에러로 안 침, idempotent).
        if [ "${_DEPLOY_ENV}" == "prod" ]; then
          AGENT_KEY_SECRET="MCP_AGENT_API_KEY_PROD"
        else
          AGENT_KEY_SECRET="MCP_AGENT_API_KEY_DEV"
        fi
        gcloud run services update sprintable-mcp-${_DEPLOY_ENV} \
          --image=${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${COMMIT_SHA} \
          --region=${_AR_REGION} \
          --update-env-vars="^;^$${ENV_VARS}" \
          --remove-env-vars=AGENT_API_KEY \
          --update-secrets="AGENT_API_KEY=$${AGENT_KEY_SECRET}:latest" \
          --quiet
        # 검산: 「배포 success」가 아니라 «서빙 이미지가 backend 와 같은 태그인가»로 잰다.
        served=$(gcloud run services describe sprintable-mcp-${_DEPLOY_ENV} \
          --region=${_AR_REGION} --format='value(spec.template.spec.containers[0].image)')
        expected="${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/backend:${COMMIT_SHA}"
        if [ "$served" != "$expected" ]; then
          echo "FAIL: mcp-${_DEPLOY_ENV} 서빙 이미지가 기대와 다르다"
          echo "  서빙: $served"
          echo "  기대: $expected"
          exit 1
        fi
        # story #2701 AC3 양성대조 일부: env 이름 목록이 배포 전후 동일한지(값은 안 찍음).
        names=$(gcloud run services describe sprintable-mcp-${_DEPLOY_ENV} \
          --region=${_AR_REGION} --format='value(spec.template.spec.containers[0].env[].name)')
        echo "OK: sprintable-mcp-${_DEPLOY_ENV} = backend:${COMMIT_SHA}"
        echo "OK: sprintable-mcp-${_DEPLOY_ENV} env names = $names"
    waitFor: [run-migrate-job]

  # story #2185(2026-07-27) — GCE MIG(realtime-gateway) 자동배포. deploy-realtime(위, Cloud
  # Run 폴백)과 별개 타깃이다. ⛔dev 전용 하드게이트 — prod GCE 는 실사용 중(48h 정상응답
  # 353건)이라 승인 없는 자동 재배포가 되면 안 된다. prod 를 붙이는 시점엔 사람이 이 가드를
  # 코드로 직접 고칠 것(위 deploy-realtime 의 _DEPLOY_ENV 가드와 동일 컨벤션 — env/substitution
  # 으로 여는 방식은 쓰지 않는다). 스크립트 자체가 이미 무중단 rolling-update(--max-unavailable=0
  # --max-surge=1)로 설계돼 있다(story #2114 S5 실증).
  - id: deploy-realtime-gce
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_DEPLOY_ENV}" != "dev" ]; then
          echo "skip deploy-realtime-gce: dev 전용 하드게이트(story #2185) — prod GCE는 사람이 직접 배포한다"
          exit 0
        fi
        GCP_PROJECT="${PROJECT_ID}" GCP_REGION="${_AR_REGION}" COMMIT_SHA="${COMMIT_SHA}" \
          bash backend/scripts/deploy_realtime_gce.sh dev
    waitFor: [run-migrate-job]

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
