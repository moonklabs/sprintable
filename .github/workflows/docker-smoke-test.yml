name: Docker Smoke Test

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - docker-compose.prod.yml
      - apps/web/**
      - packages/**
      - ee/**
      - .github/workflows/docker-smoke-test.yml

# story #2912(2899 그라운딩 갈래B 처방) — 같은 PR에 새 커밋이 들어오면 구head 런이 여전히
# 러너를 붙든 채(오늘 실사례 #3302: 구head shard 20분+ in_progress) 신head 런과 캐파를
# 다툰다. cancel-in-progress로 구head 런을 즉시 접어 캐파를 신head에 양보한다.
concurrency:
  group: docker-smoke-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build EE image (amd64 only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: sprintable-ee:smoke
          # story #3947(페드루 PO CHANGES, 카디르 재현) — NEXT_PUBLIC_APP_URL 없이 이
          # 이미지를 실제로 실행해 create-organization-dialog.tsx/onboarding-form.tsx가
          # 렌더되면 apps/web/src/lib/public-app-host.ts의 런타임 프로덕션 가드(smoke 컨테이너도
          # NODE_ENV=production)가 던진다 — smoke는 SPRINTABLE_DEPLOY_BUILD를 안 심으니
          # next.config.ts의 빌드 가드는 안 걸리지만, 이 런타임 가드는 값 존재 자체로만
          # 판단하므로 placeholder라도 채워야 한다.
          build-args: |
            LICENSE_CONSENT=agreed
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
            NEXT_PUBLIC_APP_URL=http://localhost:3108
          cache-from: type=gha
          cache-to: type=gha,mode=max
