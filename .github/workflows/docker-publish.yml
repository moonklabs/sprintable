name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/moonklabs/sprintable
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # story #3947(페드루 PO CHANGES) — 이 이미지를 실제로 실행하면(자가호스트 사용자
          # 배포) create-organization-dialog.tsx/onboarding-form.tsx 렌더 시 public-app-host.ts의
          # 런타임 프로덕션 가드가 NEXT_PUBLIC_APP_URL 부재로 던진다. SPRINTABLE_DEPLOY_BUILD를
          # 안 심으니 next.config.ts의 빌드 가드는 안 걸리지만, 이 값은 채워야 한다(자가호스트
          # 사용자는 자기 도메인으로 재빌드하거나 이 기본값을 감수 — 이 워크플로의 기존
          # NEXT_PUBLIC_SUPABASE_* 미배선과 동형, 이 카드 스코프 밖).
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3108
          cache-from: type=gha
          cache-to: type=gha,mode=max
