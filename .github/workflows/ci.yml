  # story bda4beac: alembic-fresh-db(위)는 checkout된 브랜치(develop/PR)의 파일셋 기준이라
  # main이 develop과 다른 파일셋(ee_pricing 0146/0147 부재)일 때의 그래프 단절을 원천적으로
  # 못 잡는다(실제로 못 잡아서 prod 승격이 롤백된 그 사고). PR base가 main일 때만 도는 이
  # 프리플라이트가 "이 PR이 머지되면 main이 실제로 갖게 될 파일셋"으로 fresh-DB upgrade heads
  # 를 실증한다 — develop→main 승격 PR은 그 시점에 이미 main-후보 파일셋으로 체크아웃되므로
  # (선별 제외가 그 PR 자체의 diff), PR HEAD 그대로 체크아웃하면 된다.
  main-alembic-preflight:
    name: Main Alembic preflight (fresh DB, main file set)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_main_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_main_preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # ee_pricing(0146/0147)이 main 승격分에 섞여 들어왔다면 여기서 즉시 실패 — main은
      # 항상 단일 core head(0148 직계)여야 한다.
      #
      # story 21ade1fa: 0162(ee_pricing 0147 + core 0161 merge node)도 같은 이유로 제외
      # 대상 — 하지만 0146/0147과 달리 main 히스토리에 "삭제됐던 적"이 없는 신규 파일이라
      # `git merge develop`가 conflict 없이 조용히 add해버린다(dry-run 실측 확인, 2026-07-07).
      # 즉 0146/0147은 git이 알아서 걸러주지만 0162는 사람이 명시적으로 git rm 해야 하고,
      # 잊었을 때 이 assert가 없으면 실패가 알렘빅의 불친절한 KeyError로만 드러난다.
      - name: Assert main migration file set (no ee_pricing/merge-node, core 0148 present)
        working-directory: backend
        run: |
          set -e
          test -f alembic/versions/0148_org_subscriptions_org_id_unique.py
          # ⭐2026-08-01(promo #2783·PO): ee_pricing(0146/0147) + merge node 0162 «금지»를 걷었다.
          # 걷은 이유 — 이 assert 는 「main 은 ee_pricing 을 «영원히» 안 가진다」를 단언했는데,
          # 그것이 참일 수 없다. prod 실측(2026-08-01, 읽기전용 잡): pricing_versions 테이블이
          # 없는데 ee/routers/billing.py 는 그것을 읽는다. 즉 「안 올린다」가 유지 가능한 상태가
          # 아니었고, 그 사이 두 체인이 0163 에서 «같은 이름·다른 부모»로 갈렸다(#2397).
          # ⇒ 승격을 막던 것이 이 assert 였고, 막힌 채로는 그 갈림이 영영 안 닫힌다.
          # ⛔대신 이 잡의 나머지가 여전히 지킨다: 0148(core) 존재 · single head · fresh-DB upgrade.
          #   0162 는 merge node 라 head 를 늘리지 않는다 — single head assert 로 그것이 계속 재진다.
          echo "OK: main file set has 0148(core); ee_pricing/merge-node 금지는 promo #2783 에서 해제"

      - name: Build revision graph (single head expected)
        working-directory: backend
        run: |
          set -e
          heads=$(uv run alembic heads 2>/dev/null | grep -oE '^[0-9a-z_]+')
          n=$(echo "$heads" | grep -c .)
          echo "heads=$heads (count=$n)"
          test "$n" = "1"  # 0162 는 merge node 라 ee_pricing 이 들어와도 head 는 하나여야 한다

      - name: Fresh-DB upgrade heads (main file set)
        working-directory: backend
        run: uv run alembic upgrade heads

  # story #2293(2026-07-28) — destructive_schema 94개 파일 순차 격리 루프(파일마다 fresh
  # throwaway DB 생성/드롭)가 25분 천장에 붙었다(PR #2576 conclusion=cancelled, 77/94까지
  # 전부 pass하고 시간만 모자라 잘림 — 빨간 것은 0건). 개별 테스트는 안 느리다 — 파일마다
  # 붙는 dropdb/createdb/CREATE EXTENSION/create_all() 오버헤드가 누적된 것이 벽시계
  # 대부분이었다. `backend/scripts/shard_destructive_tests.py`가 그 오버헤드를 4-way로
  # 병렬화한다(`test_shard_destructive_tests.py::test_partition_is_lossless_for_any_input`이
  # 무손실을 고정 — 파일이 조용히 안 도는 샤드 경계 실패를 막는다).
  #
  # story #3383(2026-09-03) — 파일 수가 94→200으로 늘며(+113%, 재측정 기준 (a) 자동 위반)
  # create_all() 반복 자체가 다시 벽시계를 지배했다. "Build destructive-schema template DB"
  # 스텝이 스키마를 샤드당 한 번만 만들어 템플릿으로 굳히고, 이후 매 파일은 그 템플릿을
  # `createdb -T`로 복제(파일시스템 레벨, 초 단위)한다 — 자세한 이유는 그 스텝의 주석·
  # `scripts/build_destructive_schema_template.py` docstring. **가중치 재측정 규칙**(AC2)
  # — `infra/destructive-schema-shard-weights.json`은 실시간 측정이 아니다:
  #   (a) discover 파일 수가 스냅샷 대비 +20% 이상 늘면(`shard_destructive_tests.py`의
  #       `check_staleness()`가 매 실행 stderr에 경고를 찍는다 — CI를 막지는 않는다),
  #   (b) 어느 샤드의 CI 벽시계가 다른 샤드 대비 1.5배 이상 벌어지면,
  #   (c) 25분 천장 대비 여유가 다시 좁아지면(p95 15분 초과 — story #2285 AC4 기준 계승)
  #   — 셋 중 하나라도 해당하면 재측정한다. 방법: 이 job의 "Run pytest" 스텝이 각 파일
  #   실행 직전/직후 `date +%s`로 잰 elapsed를 로그에 남긴다(위 루프의 `_elapsed` 변수) —
  #   그 값을 파일별로 모아 weights.json의 `files` 배열과 `total_files`/`total_sec`/
  #   `measured_at`을 갱신한다(사람 손으로, 또는 로그 파싱 스크립트로 — 지금은 수동).
  #
  # ⛔이 job은 develop 필수 상태 체크가 아니다(파울로군 실측, 2026-07-28: 필수 체크는
  # "Backend pytest"·"Lint, Type Check, Test, Build"·"Alembic upgrade head (fresh DB)" 셋
  # 뿐). 그래서 `backend-test`(아래, 필수)가 `needs:`로 이 job에 의존하고, 이 job의 샤드가
  # 하나라도 실패하면 `backend-test`가 그 사실을 스스로 감지해 명시적으로 fail한다(GitHub의
  # 기본 skip 전파에 기대지 않는다 — "유일한 실행처가 조용히 안 돌면 아무도 모른다"는
  # 지적에 대한 답).
  backend-test-destructive:
    name: Backend destructive-schema (shard)
    needs: [detect-changed-scope]
    # alembic-fresh-db와 동일 이유 — always() 없으면 detect-changed-scope 실패 시 이 잡이
    # (backend-test의 필수 판정 근거) cascade로 스킵된다.
    if: always()
    runs-on: ubuntu-latest
    # story #3383 AC3/AC4(2026-09-03 실측, PR CI run 33750476433, 템플릿 DB 적용 후):
    # 4샤드 9m31s·10m8s·9m21s·8m58s — 최대 10m8s·편차 1m10s(AC3 기준 12분/3분 이내 통과).
    #
    # story #3393(2026-09-03, 페드루 PO 착수 결정) — 4샤드는 develop 본류에서만 이 숫자를
    # 낸다. #3742 shard 3(run 33760329991)·#3749 shard 0(run 33765617468)가 같은 날
    # 20분대 timeout cancel(실패 파일 0건 — 순수 시간 부족)됐고, 그 두 run의 파일별 실측을
    # weights.json 가중치와 대조하니 러너 배율 median 4.45x·mean 4.94x·p90 8.41x·max
    # 12.18x(n=58). 이 배율을 현재 weights.json에 곱해 4~8샤드로 LPT 재시뮬레이션한 결과:
    # 4샤드는 median 배율 하나만으로 예상 최대 20.8분(=실측 사고 두 건과 거의 일치, 우연한
    # 극단 표본이 아니라 "이 정도 느린 러너는 4샤드에서 이미 한도에 붙는 상태"라는 뜻).
    # 6샤드는 median에서만 살고(13.9분) p90(8.41x)에서 26.3분으로 다시 넘는다 — 8샤드는
    # p90에서도 19.7분으로 버틴다(median 10.4분·mean 11.6분 여유 큼). "가끔 느린 러너"까지
    # 방어하려면 median 아니라 p90을 기준으로 골라야 한다는 게 이 선택의 근거.
    # ⛔천장을 올리는 처방은 기각(story a47e553a의 원 원칙, #2293)했다 — mean/p90 배율
    # (23분/39분)까지 감안하면 천장을 얼마나 올려도 다음 느린 표본에서 다시 붙는다.
    # 가중치 재실측도 기각 — weights.json은 파일 간 *상대* 비중이라 러너 전체가 느려지는
    # *절대* 배율 문제엔 안 듣는다. 샤드 수 확대(설정값 변경만, 로직 무변화)가 유일하게
    # 싸고 근본적인 처방.
    #
    # timeout-minutes는 8샤드 첫 실측(정상 표본) 뒤 그 값의 2배 이내로 재조정한다(AC4
    # 계승 — 헐거운 천장 금지, #3383와 동일 원칙). 지금은 4샤드 때 값(20)을 그대로 이어
    # 두되, 8-way 분할이면 각 샤드 파일수/가중치총합이 거의 절반이라 정상 표본에서는
    # 4샤드의 절반(~5분대)에 가까울 것으로 예상 — 실측 뒤 이 주석과 함께 갱신한다.
    timeout-minutes: 20
    strategy:
      fail-fast: false  # 한 샤드 실패가 다른 샤드를 취소하면 "어디까지 진짜 돌았는지"가 흐려진다
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      PARITY_TEST_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # story #3392(CI 후속) — unweighted 파일 목록·평균 가중치·초과판정선을 /tmp/shard_meta.json
      # 으로도 내보낸다("Run pytest" 스텝이 파일 완주 즉시 대조한다). --print-summary가 이미
      # unweighted 목록을 stderr(=이 스텝 로그)에 찍으므로 AC1의 "로그 상단에 낸다(0건이면
      # 그 사실도)"는 별도 echo 없이 여기서 충족된다.
      # story #3393(페드루 PO 리뷰 정정, 2026-09-03 15:01Z) — matrix.shard 배열 길이와
      # --shard-count가 각자 리터럴이면 한쪽만 바뀌어도 조용히 안 맞을 수 있다("한 곳에서만
      # 파생"이 아니면 나는 사고 — 애초 별도 assert 스텝을 뒀으나 그 assert 자신의 리터럴도
      # 셋째 지점이 돼 대조가 불완전했다). matrix.shard가 유일한 원천이 되도록
      # `strategy.job-total`(matrix가 낳은 실제 job 수)을 --shard-count에 직접 흘려보낸다 —
      # matrix.shard 배열 길이를 바꾸면 --shard-count가 자동으로 같은 값을 받으므로 별도
      # assert가 불요하다.
      - name: Determine this shard's file list
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        working-directory: backend
        run: |
          uv run python scripts/shard_destructive_tests.py \
            --shard-index ${{ matrix.shard }} --shard-count ${{ strategy.job-total }} --print-summary \
            --meta-out /tmp/shard_meta.json \
            > /tmp/shard_files.txt
          echo "이 샤드(${{ matrix.shard }}) 파일 수: $(wc -l < /tmp/shard_files.txt)"

      # story #3383(AC1) — destructive_schema 파일이 94→200개로 늘며(2026-07-28→09-03)
      # 파일마다 자기 안에서 부르는 `Base.metadata.create_all()`(전체 스키마, 161개 테이블)
      # 반복이 벽시계를 지배하게 됐다(로컬 재현: 파일당 create_all이 setup 시간의 대부분).
      # 이 스키마를 이 샤드에서 딱 한 번만 만들어 템플릿으로 굳혀 두면, 이후 매 파일은
      # `createdb -T`(파일시스템 레벨 복제, 초 단위)로 이미 스키마 있는 DB를 받는다 — 파일
      # 자신의 create_all() 호출은 SQLAlchemy 기본 checkfirst=True라 그대로 안전하게 no-op이
      # 된다(테스트 파일은 한 줄도 안 고친다).
      - name: Build destructive-schema template DB (story #3383)
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        working-directory: backend
        run: |
          PGPASSWORD=sprintable dropdb -h localhost -U sprintable --if-exists sprintable_test_tpl
          PGPASSWORD=sprintable createdb -h localhost -U sprintable sprintable_test_tpl
          PGPASSWORD=sprintable psql -h localhost -U sprintable -d sprintable_test_tpl \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          DATABASE_URL=postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test_tpl \
          uv run python scripts/build_destructive_schema_template.py

      # story 8236bbc3: destructive_schema 마커 파일(Base.metadata.create_all/drop_all로 자체
      # 스키마 직접 관리)은 alembic-migrated 공유 DB에서 절대 실행하지 않는다 — 실측대로
      # drop_all()이 DB를 오염시켜 같은 세션 후속 테스트 전부를 연쇄 실패시킬 수 있다.
      # 파일마다 독립 throwaway DB(sprintable_test_iso)로 완전 격리한다(샤딩 전과 동일 원칙 —
      # 바뀐 것은 «몇 개를 도는가»이지 «어떻게 격리하는가»가 아니다). story #3383: 이제 그
      # throwaway DB를 맨바닥(createdb+CREATE EXTENSION)이 아니라 위에서 만든 템플릿에서
      # 복제한다(sprintable_test_tpl) — 격리 보장은 그대로(파일마다 독립 DB, 끝나면 drop).
      # story #3392(AC2) — PR #3742 run 33760329991에서 60초 가드의 ::error::가 로그에
      # 전혀 없었다: 이전 버전은 for 루프가 "전부" 끝난 뒤에야 slow_files를 출력했는데,
      # 그 루프 도중 shard 자체가 20분 timeout으로 cancel되면 루프 뒤 코드는 영원히
      # 실행되지 않는다 — 가드가 있어도 말할 기회 자체가 없었다. 이제 파일 완주 «즉시»
      # (같은 반복 안에서) ::error::를 낸다 — 그 직후 shard가 cancel되더라도 이 줄은 이미
      # 로그에 남는다. exit 1은 여전히 루프 뒤로 미룬다(#2293 철학 그대로 — 한 파일 때문에
      # 나머지가 "조용히 미실행"되면 안 된다, 실측 가능한 만큼은 계속 잰다).
      - name: Run pytest (destructive schema — isolated fresh DB per file, this shard)
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        working-directory: backend
        run: |
          set -uo pipefail
          # set -e를 여기선 안 쓴다 — 첫 실패 파일이 스크립트를 즉시 죽이면 이 샤드의 나머지
          # 파일은 조용히 미실행된 것과 동일한 결과가 된다(#2293이 막으려는 바로 그 실패 유형).
          mapfile -t files < /tmp/shard_files.txt
          echo "destructive files (shard ${{ matrix.shard }}): ${#files[@]}"

          # story #3392(AC1) — "Determine this shard's file list" 스텝이 써 둔 unweighted
          # 목록·초과판정선을 읽는다. meta 파일이 없거나 못 읽으면(방어적) 초과판정은
          # 건너뛴다(0건 취급) — 이 가드의 부재가 기존 실패/60초 가드까지 죽이면 안 된다.
          overage_threshold=999999
          overage_multiplier="?"
          unweighted_files=()
          if [ -f /tmp/shard_meta.json ]; then
            overage_threshold=$(jq -r '(.unweighted_overage_threshold_sec // 999999) | floor' /tmp/shard_meta.json 2>/dev/null || echo 999999)
            overage_multiplier=$(jq -r '.unweighted_overage_multiplier // "?"' /tmp/shard_meta.json 2>/dev/null || echo "?")
            mapfile -t unweighted_files < <(jq -r '.unweighted_files[]? // empty' /tmp/shard_meta.json 2>/dev/null)
          fi
          echo "unweighted 초과판정선: ${overage_threshold}s(story #3392) · unweighted 파일 ${#unweighted_files[@]}개"

          failed_files=()
          overage_files=()
          # story #3396 — 60초 절대 가드(story #3383 AC5)가 story #3393이 정식화한
          # "느린 러너 표본"(median 4.45x~max 12.18x)과 정면으로 부딪혔다: PR #3753 run
          # 33773872963 shard 0에서 test_3373_channel_connections.py가 168s(가중치
          # 20.1s=8.4x)로 이 가드에 걸려 fail 났는데, 같은 shard의 다른 24개 파일도 전부
          # median 5.91x로 튀어 있었다 — 그 파일 하나가 아니라 러너 전체가 느렸다는
          # 뜻이다. 판정선을 이제 그 run 자신의 elapsed/weight 중앙값 배율로 스케일한다
          # (shard_destructive_tests.py::slow_files_normalized, 표본 3개 미만이면 절대
          # 60초로 폴백) — 이 판정은 그 run의 전체 표본이 있어야 계산되므로(파일 단위
          # 즉시 판정이 원리적으로 불가능) 루프 안에서는 elapsed만 기록해 두고 루프가
          # 끝난 뒤 한 번에 판정한다. exit 1은 여전히 여기서만 나므로 #2293/#3392의
          # "실측 가능한 만큼은 계속 잰다" 철학은 무변화.
          elapsed_file=$(mktemp)
          for f in "${files[@]}"; do
            echo "::group::isolated $f"
            PGPASSWORD=sprintable dropdb -h localhost -U sprintable --if-exists sprintable_test_iso
            PGPASSWORD=sprintable createdb -h localhost -U sprintable -T sprintable_test_tpl sprintable_test_iso
            _t0=$(date +%s)
            ALEMBIC_DATABASE_URL=postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test_iso \
            PARITY_TEST_DATABASE_URL=postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test_iso \
            DATABASE_URL=postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test_iso \
            uv run pytest -q "$f" || failed_files+=("$f")
            _elapsed=$(( $(date +%s) - _t0 ))
            echo "elapsed: ${_elapsed}s"
            printf '%s\t%s\n' "$f" "$_elapsed" >> "$elapsed_file"
            # story #3392(AC1) — unweighted 파일이 평균의 배수(threshold)를 실측으로
            # 넘으면 경고가 아니라 실패다. weights.json에 없다는 이유로 "몰랐다"가 통하면
            # 다음 신규 파일도 같은 사고를 반복한다. (unweighted 파일은 story #3396의
            # 정규화 표본·판정 대상 모두에서 빠진다 — 이 가드가 계속 전담한다.)
            for uw in "${unweighted_files[@]+"${unweighted_files[@]}"}"; do
              if [ "$uw" = "$f" ] && [ "$_elapsed" -gt "$overage_threshold" ]; then
                overage_files+=("$f (${_elapsed}s > ${overage_threshold}s)")
                echo "::error::unweighted 파일이 평균의 ${overage_multiplier}배를 넘었다(story #3392 AC1): $f (${_elapsed}s > ${overage_threshold}s) — infra/destructive-schema-shard-weights.json에 이 값을 추가하라."
              fi
            done
            echo "::endgroup::"
          done
          if [ "${#failed_files[@]}" -gt 0 ]; then
            echo "FAILED files: ${failed_files[*]}"
            exit 1
          fi
          if [ "${#overage_files[@]}" -gt 0 ]; then
            echo "unweighted 초과 파일(story #3392 AC1, 위 ::error:: 참고): ${overage_files[*]}"
            exit 1
          fi
          uv run python scripts/shard_destructive_tests.py --check-elapsed "$elapsed_file"
          slow_exit=$?
          rm -f "$elapsed_file"
          if [ "$slow_exit" -ne 0 ]; then
            echo "러너 정규화 60초 가드 초과(story #3396, 위 ::error:: 참고)"
            exit 1
          fi
          echo "OK: all ${#files[@]} isolated destructive-schema files passed (shard ${{ matrix.shard }})"

      - name: Skip reason (backend-irrelevant PR)
        if: needs.detect-changed-scope.outputs.backend_relevant == 'false'
        run: |
          echo "story #2555 — 변경 파일 전부가 백엔드-무관 allowlist 안이라 이 샤드의 destructive-schema 실행을 건너뛰었다."

  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    needs: [backend-test-destructive, detect-changed-scope]
    if: always()
    # story #1982(2026-07-17): postgres service + real-PG env 배선. 이 갭은 story #1472
    # (2026-06-21)에서 이미 발견됐고, story 8236bbc3(#1619, 2026-07-03)이 "backend-test job
    # 무변경(회귀0 최대보수)"으로 의도적으로 유보했던 트레이드오프다 — 그 결과 `_REAL_DB_SKIP`
    # 마커 테스트(예: test_1974_gate_assigned_to_me.py의 realdb 3건)가 이 job에서 조용히 skip
    # 되어 CI green이 realPG 왕복 거동을 실제로 보증하지 못했다. non-destructive real-DB
    # 커버리지는 이 job이 직접 돈다(공유 alembic-migrated 스키마 위 — 격리 불요).
    #
    # ⭐story #2293(2026-07-28): destructive_schema 94개는 더는 이 job이 직접 돌지 않는다
    # (AC1 — alembic-fresh-db와 byte-identical 중복이었다·아래 backend-test-destructive로
    # 이관). 이 job은 develop 필수 상태 체크(이름 "Backend pytest")라 **이름을 바꾸지
    # 않았다** — `needs: [backend-test-destructive]` + `if: always()` + 아래 첫 스텝의 명시적
    # exit 1로, 94개 중 하나라도 실패/샤드가 안 돌면 이 필수 체크 자체가 빨개지게 만든다
    # (GitHub의 기본 `needs`-실패-시-skip에만 기대면 "필수 체크가 skipped로 조용히 안
    # 걸리는" 위험이 있다 — 파울로군 지적).
    #
    # story #2285 AC4(2026-08-17 실측, develop 최근 10런): 이 job 본체(non-destructive
    # pytest, story #2293 이관 후) 7~8분 → 천장 25분 대비 여유 17~18분. 재검 기준: p95가
    # 15분을 넘으면 값을 다시 본다.
    timeout-minutes: 25

    services:
      postgres:
        # pgvector image: the baseline schema declares `CREATE EXTENSION vector` (embeddings),
        # which the stock postgres:16 image lacks. Cloud SQL (dev/prod) has pgvector available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      PARITY_TEST_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Require all destructive-schema shards to have succeeded
        if: needs.backend-test-destructive.result != 'success'
        run: |
          echo "backend-test-destructive result=${{ needs.backend-test-destructive.result }} — destructive-schema 94개의 유일한 실행처가 실패했거나 안 돎"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # non-destructive real-PG 테스트(84개 파일, destructive_schema 마커 제외)는 alembic-migrated
      # 스키마(view·nullable·seed 포함 baseline)에 의존한다 — fresh DB를 먼저 heads까지 올린다
      # (그렇지 않으면 테이블 부재로 realdb 테스트가 실패한다).
      - name: alembic upgrade heads (fresh DB → baseline)
        working-directory: backend
        run: uv run alembic upgrade heads

      - name: Run pytest (non-destructive, real-PG auto-discovered via marker)
        working-directory: backend
        run: |
          set -o pipefail
          uv run pytest -q -m "not destructive_schema" --durations=20 2>&1 | tee /tmp/pytest_output.log

      # story #2285 AC5: 넘쳤을 때(취소) 무엇이 시간을 먹었는지 최소한이라도 보이게 —
      # --durations=20이 정상 완주 시엔 정확한 breakdown을 준다. ⛔한계를 그대로 적는다: job이
      # 25분 천장에 «중간에» 취소되면 이 스텝(과 --durations 출력 자체)도 같이 죽는다 — GitHub
      # Actions는 타임아웃-취소 시 이후 스텝을 실행할 방법을 안 준다(`if: always()`도 못 막음).
      # 그래서 이건 "정상 완주했지만 느려지는 중"을 조기에 보이게 하는 것까지가 이 스텝의
      # 몫 — 그 이상(취소 순간의 실시간 heartbeat 등)은 짓지 않는다(AC6).
      - name: Slowest tests summary (story #2285 AC5)
        if: always()
        run: |
          {
            echo "## Backend pytest — slowest 20 (여유: 천장 25분, 08-17 실측 본체 7~8분)"
            echo '```'
            awk '/slowest 20 durations/,0' /tmp/pytest_output.log 2>/dev/null || echo "(durations 출력 없음 — 타임아웃-취소로 이 스텝 자체가 못 돌았을 가능성)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # story #3273(CI사각, 2026-09-01 카디르 QA 발견) — support-gateway/ 디렉토리엔 pytest
  # 스위트(86건 시점 발견, 이 잡 도입 시점 87건)가 있었지만 GHA 어느 워크플로에도 실행 잡이
  # 없었다 — backend-test와 달리 그동안 이 서비스를 건드린 PR도 "required CI green"이 스위트
  # 0건 실행으로 통과했고, 검증은 QA의 codex exec 수동 실행에만 의존했다(«CI green≠관문 전부»
  # 클래스). support-gateway는 story #3259(지원v1·1경계)의 "0 fleet 자격" 설계로 자기
  # 디렉토리 밖 어떤 코드도 import하지 않는다(app/config.py 상단 주석) — 그래서 이 서비스
  # 테스트는 backend-test처럼 실PG 서비스가 필요 없다(tests/conftest.py가 sqlite+aiosqlite
  # 인메모리로 매 테스트를 격리) — 로컬 실측(2026-09-01) 87 passed, 0.94초.
  #
  # ⚠️아직 develop 필수 상태 체크가 아니다(페드루 PO 지시, 2026-09-01) — 신설 잡을 곧장
  # required에 태우면 이 잡 자체의 미지 플레이크가 전 머지를 막는 자리가 된다("게이트에
  # 머지 뒤에만 아는 것 금지"의 사촌 원칙). develop에서 몇 사이클 돌아 플레이크 0을 확認한
  # 뒤에만 PO가 branch protection에 수동으로 등재한다(`gh api --method PUT
  # repos/moonklabs/sprintable/branches/develop/protection/required_status_checks/contexts`
  # 로 "Support Gateway pytest" 추가 — 관리자 권한 필요, 이 PR이 하는 일 아님).
  gateway-test:
    name: Support Gateway pytest
    needs: [detect-changed-scope]
    # backend-test·alembic-fresh-db와 동형 이유(위 주석 반복 안 함) — 잡 자체는 항상 돌고
    # 스텝만 조건부 스킵해 "미실행=스킵"이 "통과"로 잡히는 모호함을 피한다.
    if: always()
    runs-on: ubuntu-latest
    # 실측(2026-09-01, 로컬 87 passed 0.94초) — postgres 서비스 불요·CI 콜드 uv sync 포함해도
    # 수 분 이내로 예상. backend-test(7~8분, 실PG)·backend-test-destructive(#3269 실측
    # 17~23분+)에 비하면 러너 비용은 무시할 수준 — 그래도 첫 CI 실주행 미지수 여유로 10분.
    timeout-minutes: 10

    # story #3285(지원v1·후속, 2026-09-01) — gateway 스위트는 SQLite 인메모리(conftest.py)라
    # 실 Postgres 마이그레이션 제약(CHECK/FK) 드리프트를 구조적으로 못 잡는 클래스였다(실증:
    # #3672가 role을 코드로만 넓혀 dev PG서 500). backend와 같은 pgvector 서비스 패턴을
    # 재사용 — 비용은 미미(gateway 마이그레이션 3~4개뿐, 수 초).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_gateway_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GATEWAY_REALDB_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5433/sprintable_gateway_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        if: needs.detect-changed-scope.outputs.gateway_relevant != 'false'
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Run pytest (support-gateway — sqlite in-memory + realdb 드리프트 게이트)
        if: needs.detect-changed-scope.outputs.gateway_relevant != 'false'
        working-directory: support-gateway
        run: |
          set -o pipefail
          uv run pytest -q --durations=20 2>&1 | tee /tmp/gateway_pytest_output.log

      - name: Slowest tests summary
        if: always()
        run: |
          {
            echo "## Support Gateway pytest — slowest 20"
            echo '```'
            awk '/slowest 20 durations/,0' /tmp/gateway_pytest_output.log 2>/dev/null || echo "(durations 출력 없음 — skip됐거나 타임아웃)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # story #2929 — base가 develop/main이 아닌 스택 PR(feat/* 위 feat/*)에는 이 job이 전혀
  # 안 돈다(트리거 `branches: [main, develop]`, 위). 그 갭은 `stack-pr-frontend-preview.yml`
  # (별도 파일, `branches-ignore: [main, develop]`)이 required 체크 이름을 건드리지 않고
  # 메운다 — 이 job과 완전 분리라 required 체크 의미론엔 영향 없음. 새 verify:* 스텝을
  # 여기 추가하면 그 파일에도 반영할 것(리뷰에서 확인).
  ci:
    name: Lint, Type Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      # story #1957(P2-S1) breakpoint SSOT 회귀가드: md:(768) 신규 사용은 useIsMobile()의
      # 1024 기준과 어긋나는 route 내 md·lg 혼재를 재도입한다. 기존 사용은 grandfather
      # allowlist로 통과, 새 파일/allowlist 밖 파일에서만 실패.
      - name: "Verify no new md: breakpoint (story #1957 regression guard)"
        run: pnpm --filter web verify:no-new-md-breakpoint

      # story #2057(유나 규격) 회귀가드: 포커스 링에 알파를 붙이면 대비가 깎인다(40% 알파
      # 실측 최악 1.7:1대 — AA 3.0 미달). focus:/focus-visible: 접두 ring-*/N 100건을 전부
      # 알파 제거로 고쳤고, 재도입되면 이 스텝이 실패한다.
      - name: "Verify no alpha on focus ring (story #2057 regression guard)"
        run: pnpm --filter web verify:no-alpha-focus-ring

      # story #2611(유나 확定) 회귀가드: text-muted-foreground/{alpha}는 모든 알파 레벨에서
      # AA 미달이다(solid만 통과). 텍스트+아이콘 89곳을 solid로 이관했고, 재도입되면 이 스텝이
      # 실패한다. 예외(큰 순수 장식)는 `// muted-alpha-ok: <이유>` 주석으로만 통과한다.
      - name: "Verify no text-muted-foreground alpha (story #2611 regression guard)"
        run: pnpm --filter web verify:no-muted-foreground-alpha

      # story #2061 회귀가드: 손수 구현된 `fixed inset-0` 모달(role="dialog"/aria-modal/
      # 포커스트랩 없음)이 새로 들어오면 이 스텝이 실패한다. 공용 <Dialog>/<Sheet> 또는
      # useFocusTrap으로 배선된 것은 통과한다.
      - name: "Verify no hand-rolled modal without accessibility (story #2061 regression guard)"
        run: pnpm --filter web verify:no-handrolled-modal

      # story #1933 회귀가드: request.url을 new URL()의 base로 쓰면 Cloud Run 내부 주소가
      # 새어 나간다(플랫폼 성질). auth/native·internal-dogfood 3곳을 resolveAppUrl(null)로
      # 고쳤고, 재도입되면 이 스텝이 실패한다.
      - name: "Verify no request.url used as URL base (story #1933 regression guard)"
        run: pnpm --filter web verify:no-request-url-as-base

      # story #2062 회귀가드: 패딩도 focus-inset(유나 규격)도 없는 overflow-*-auto|scroll
      # 스크롤 컨테이너가 새로 들어오면 이 스텝이 실패한다(#2057 포커스 링 클리핑 재발 방지).
      - name: "Verify focus-inset coverage on scroll containers (story #2062 regression guard)"
        run: pnpm --filter web verify:focus-inset-coverage

      # story #2367 회귀가드: 같은 파일이 렌더하는 두 문구가(한쪽이 {n}류 보간으로 수와
      # 함께 서는 경우) 부분문자열로 겹치면 실패한다(#2352·#2365 — 「막힘 28↔0」·「승인 대기
      # 30↔없음」과 같은 화면 자기모순 재발 방지). ⛔같은 화면이라도 다른 파일이 원인인
      # 경우(#2352·#2365 원 사고 자체)는 이 v1 스코프 밖 — 스크립트 헤더 주석 참조.
      - name: "Verify no i18n phrase substring collision (story #2367 regression guard)"
        run: pnpm --filter web verify:no-i18n-phrase-collision

      # story #2395 회귀가드: en.json/ko.json 안 같은 부모 객체에 키가 두 번 나오면(JSON
      # 표준상 마지막 값이 조용히 이기고 에러도 경고도 없음) CI가 잡는다. AC1 실측 4건(전부
      # `goals` 네임스페이스)을 이 PR에서 이미 제거해 baseline은 0 — 새로 생기는 것만 막는다.
      - name: "Verify no duplicate sibling i18n keys (story #2395 regression guard)"
        run: pnpm --filter web verify:no-duplicate-i18n-keys

      # story #2420 AC3 회귀가드: globals.css의 `--<family>-tint` 배경 위에서 --foreground가
      # AA(4.5)를 넘는지 «정의 시점»에 계산한다(oklch→sRGB 변환은 Yuna의 실 Chromium canvas
      # 캡처값과 대조 검증된 순수함수 — 브라우저 불요, 빠르고 결정적). 새 계열(예: --info-tint)이
      # globals.css에 추가되면 이 스텝이 코드 수정 없이 자동으로 그 계열도 검사한다 — #2419가
      # 겪은 "이름이 늘 때마다 사용처 스윕을 다시 도는" 병을 정의 축에서 원천 차단한다.
      - name: "Verify tint background × foreground contrast (story #2420 regression guard)"
        run: pnpm --filter web verify:tint-foreground-contrast

      # story #2480(유나 규격) 회귀가드: `--muted-foreground`는 bg-muted·background·card
      # 위에서 전부 쓰인다(테이블 헤더·플레이스홀더·칩·보조텍스트 도처). 라이트 bg-muted 위
      # 실측 4.39:1로 AA 미달이 발견돼(#2866 가디언 리뷰 중) 토큰을 L 0.552→0.52로 조정했다.
      # 이 스텝이 재도입(값이 다시 4.39 쪽으로 밀림)을 정의 시점에 잡는다.
      - name: "Verify muted-foreground contrast (story #2480 regression guard)"
        run: pnpm --filter web verify:muted-foreground-contrast

      # story #2484 advisory 넛지(⛔blocker 아님·PO 確定) — FE가 error.code를 안 갈라
      # 서버 raw message/json.detail을 그대로 노출하는 병이 #2441·#2470·create-org로
      # 3번 반복됐다. 이 스텝은 그 병의 단순형(주변에 .code 분기가 없는 경우)만 잡아
      # 로그로 알린다. baseline(raw-error-message-baseline.json) 밖의 새 자리가 있어도
      # 이 스텝 자체는 항상 성공한다(스크립트가 always exit 0) — 리뷰어가 로그를 보고
      # 판단하는 넛지이지 머지 게이트가 아니다.
      - name: "Verify no new raw error.message exposure (story #2484 advisory nudge)"
        run: pnpm --filter web verify:no-raw-error-message

      # story #2420 AC7 회귀가드: AC3(위)는 globals.css 정의만 본다 — 사용처(컴포넌트 파일)는
      # 전혀 안 읽는다. 실제로 사용처 하나(goals-client.tsx:615)를 계열색으로 되돌려도 AC3·
      # type-check·lint·해당 vitest 전부 그대로 초록이었다(실측, 디디). 이 스텝은 같은
      # 문자열/템플릿 리터럴 안에 `bg-<X>-tint|알파`와 `text-<X>`(같은 계열)가 함께 있는 자리를
      # 센다 — 지금 있는 90건(baseline, scripts/tint-color-text-baseline.json)은 실패시키지
      # 않고, 그 밖의 «새» 자리만 잡는다. 기존 90건을 개별 수리하는 것은 이 스텝의 일이 아니다
      # (#2093 lint_query_sentinel_direct_calls.py와 같은 baseline 계약).
      - name: "Verify no new tint-background × family-color-text usage (story #2420 AC7 regression guard)"
        run: pnpm --filter web verify:no-new-tint-color-text

      # story #2590 (A) 정적 프리필터: 자매 가드 verify:no-new-tint-color-text는 «한 리터럴 안»의
      # bg-X+text-X만 본다. 이 가드는 AST로 «조상 요소가 pale-tint 배경, 자식 요소가 계열색 글자»인
      # 교차-요소 조합을 잡는다(#2960 hitl-card·#2940 cluster류). baseline(develop 기준 시드) 밖의
      # 새 자리만 실패. 정적이라 못 재는 자리(조건부 조상·컴포넌트 경계·불투명 재설정)는 (B) axe가
      # 실 픽셀로 최종 판정한다 — docs/contrast-guard.md AC4 참조.
      - name: "Verify no new cross-element tint × family-color-text (story #2590 A regression guard)"
        run: pnpm --filter web verify:cross-element-tint-text

      # story #2420 AC4/AC6/AC7 — 「닫힌 계열」(subtle 알파를 0으로 만든 계열)의 순수 bg-<X>/<n<50>
      # 재유입 가드. 자매 가드 verify:no-new-tint-color-text는 알파를 «같은 계열 글자와 함께»일 때만
      # 잡아 순수 bg-<X>/<n>(text 없이)은 놓친다 — 이 스텝이 그 갭을 메운다(PO 지적, 2026-09-01).
      # CLOSED_FAMILIES=[destructive](이 PR에서 0이 됨). 팬아웃 각 PR이 자기 계열을 0으로 만들 때
      # 그 PR에서 CLOSED에 추가한다(계약 ③: 死를 계수 가능하게 — 0이 된 시점이 유일하게 옳은 자리).
      - name: "Verify no closed-family subtle alpha bg re-entry (story #2420 AC4/AC6 — destructive)"
        run: pnpm --filter web verify:no-subtle-alpha-bg


      # story #2371 회귀가드: `scripts/check-i18n-keys.js`(code→messages missing-key 축)를
      # 처음으로 CI에 건다 — 이전엔 CI/husky/package.json 어디에도 안 걸려 있었고 손으로
      # 돌리면 344 issues·exit 1이 나왔는데(2026-07-31 실측) 344건 전부 도구 결함(워드바운더리
      # ㉠·네임스페이스 점 미지원+matchAll 미사용 ㉡·2단 이상 중첩 미지원 ㉢, 여기 더해 훅
      # 변수명 t 하드코딩 ㉣·주석 안 예시코드 오인 ㉤ 둘을 새로 찾아 고쳤다)이라 걸어도 상시
      # 빨간불이었다. 위 결함을 전부 고친 뒤 재측정한 missing 축은 0건(자가 재현) — 이제
      # 걸어도 실사용 회귀만 잡는다. messages→코드 dead-key 축(AC3)은 이 스텝을 실패시키지
      # 않는다(스크립트 자체가 non-zero exit을 missing 축에만 건다) — 후보 목록일 뿐 삭제
      # 판단은 사람이 소비처를 하나씩 봐야 하는 별건(AC6)이라 CI 게이트로 강제하지 않는다.
      - name: "Verify i18n translation keys (story #2371 regression guard)"
        run: pnpm verify:i18n-keys

      # story #2376 회귀가드: 사이드바(app-sidebar.tsx)·⌘K 팔레트(command-palette.tsx)·모바일
      # 더보기(more/page.tsx) 등이 조합(resourceLink/resourceHref)·리터럴(href=/href:) 어느
      # 축으로 걸든, [ws]/[proj]/<resource> 라우트 실존과 어긋나면(양방향) 실패한다 — #2373
      # 승격 당시 flow 진입점은 들어왔는데 라우트가 빠졌고(404), board는 반대로 라우트만
      # 남고 진입점이 0이었던(도달 불가, 더 조용한 쪽) 재발 방지. 첫 스캔이 잡은 기존 채무
      # 2건(mockups 도달 불가·memos 죽은 알림 링크)은 GRANDFATHER_BASELINE으로 얼려 신규만 막는다.
      - name: "Verify no orphan resource routes (story #2376 regression guard)"
        run: pnpm --filter web verify:no-orphan-resource-routes
      # story #2393 회귀가드: route-resolve.ts의 RESERVED_FIRST_SEGMENTS(런타임 미들웨어가
      # 워크스페이스 slug 후보 여부를 직접 판정하는 값)가 실제 app/ 구조와 어긋나면 실패한다.
      # 레거시 리소스명 축(MIGRATED_RESOURCES 등)은 파생이라 어긋날 수 없고, 라이브 top-level
      # 라우트+메타데이터 파일 라우트 축은 edge 런타임 위험(node:fs 미지원) 때문에 의도적으로
      # 손 스냅샷으로 남겨 이 가드가 대신 지킨다 — 첫 실측(2026-08-01)에서 이미 6곳(gates·
      # more·apple-icon.png·manifest.webmanifest·flow·goals) 어긋나 있던 것을 이 스토리가 고쳤다.
      - name: "Verify RESERVED_FIRST_SEGMENTS sync (story #2393 regression guard)"
        run: pnpm --filter web verify:reserved-first-segments-sync

      # story #1971 회귀가드: RENAMED_RESOURCES(옛 이름→신 이름)의 값이 MIGRATED_RESOURCES
      # (bare 딥링크를 [ws]/[proj]로 채워 넣는 표)의 키에도 있는지 대조한다 — proxy.ts의
      # redirectLegacyResourcePath는 정확히 그 판정(resourceName in MIGRATED_RESOURCES)으로
      # bare 콜드 딥링크의 ws/proj를 채운다. #2016(epics→goals) 실사고와 동형 재발 방지.
      - name: "Verify MIGRATED_RESOURCES sync (story #1971 regression guard)"
        run: pnpm --filter web verify:migrated-resources-sync

      # story #2691 회귀가드: raw fetch('/api/*')가 401을 재시도 없이 삼키는 결함 클래스
      # (#2689 근본 원인)의 재발을 막는다 — #2689(8곳)+#2691(카디르 QA 전수감사 기반 130곳)이
      # fetchWithAuth로 전환한 뒤, 그 전환이 유지되도록 신규 raw fetch만 막는다(기존 잔존
      # 282건은 GRANDFATHER_BASELINE로 얼림, mutation/handler/pre-auth류 — 개별 triage는 별도).
      - name: "Verify no new raw fetch('/api/*') (story #2691 regression guard)"
        run: pnpm --filter web verify:no-new-raw-fetch-api

      - name: Test
        # set -o pipefail so vitest's non-zero exit propagates through `| tail` instead
        # of being masked by tail's 0 — without it the unit-test gate was a no-op
        # (story 2d5c8662). GitHub's default bash runner does not enable pipefail.
        run: |
          set -o pipefail
          pnpm vitest run 2>&1 | tail -80

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          LICENSE_CONSENT: agreed

      # story d3dd358b 회귀가드: shared 패키지 stale dist 소비로 zod 스키마 신규 필드가
      # silent strip되는 클래스(2026-06-10 발견, transpilePackages #1373으로 해소 확인)의
      # 재발을 clean-checkout 빌드 산출물(.next/standalone) 검사로 자동 차단.
      - name: Verify build schema integrity (story d3dd358b regression guard)
        run: pnpm --filter web verify:build-schema-integrity

  contrast-guard-e2e:
    name: "Contrast guard (axe runtime · story #2590 B)"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # story #2590 (B): (A) 정적 프리필터(ci 잡)가 원리적으로 못 재는 교차-요소·교차-계열·알파·
    # 상태(hover) 대비를 실제 렌더된 픽셀에서 axe-core color-contrast로 전수한다(최종 authority).
    # 인증 로그인(owner@sprintable.dev)이 필요해 backend-test처럼 pgvector postgres + alembic을
    # 세우고, 그 위에 FastAPI(uvicorn)와 Next(dev)를 띄운 뒤 chromium을 돌린다. docs/contrast-guard.md 참조.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      # FastAPI(security._get_secret)와 Next proxy(getJwtSecretBytes)가 «같은» JWT_SECRET을 봐야
      # 로그인 쿠키(sp_at) 검증이 통과한다 — 다르면 login 200 뒤 /inbox 이동에서 실패한다.
      JWT_SECRET: ci-e2e-contrast-guard-secret-at-least-32-chars
      # CI(비-Cloud-Run·비-pytest)에서 앱이 배포환경으로 오인돼 secret 부재로 fail-closed 되는 것을
      # 막는다(backend/.env.example is_really_local 게이트).
      SPRINTABLE_LOCAL_DEV: '1'
      NEXT_PUBLIC_FASTAPI_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3108
      APP_BASE_URL: http://localhost:3108
      PORT: '3108'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: alembic upgrade heads (baseline schema)
        working-directory: backend
        run: uv run alembic upgrade heads

      # e2e 로그인 계정(owner@sprintable.dev/password123)은 리포 어디에서도 시드되지 않고,
      # register API는 password 정책(대/소/숫자/특수 중 ≥3종)상 이 비밀번호를 거부한다. 그래서
      # CI가 앱 자체 해셔(argon2)로 users 행을 직접 넣는다(login 핸들러는 정책을 안 걸고 해시만 검증).
      - name: Seed e2e owner user
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app.core.database import async_session_factory
          from app.core.security import hash_password
          from app.models.user import User

          async def main() -> None:
              async with async_session_factory() as session:
                  existing = await session.scalar(
                      select(User).where(User.email == "owner@sprintable.dev")
                  )
                  if existing:
                      print("e2e owner already present")
                      return
                  session.add(User(
                      email="owner@sprintable.dev",
                      hashed_password=hash_password("password123"),
                      is_active=True,
                      email_verified=True,
                  ))
                  await session.commit()
                  print("e2e owner created")

          asyncio.run(main())
          PY

      - name: Start FastAPI backend
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v2/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"; cat /tmp/backend.log; exit 1

      # 시드된 owner는 org가 없어 (authenticated) layout이 /onboarding으로 리다이렉트한다
      # (layout.tsx: me 404 또는 me.org_id 부재 → redirect). 그래서 global-setup의
      # waitForURL(/inbox/)가 타임아웃한다. 테이블 직접 시드(스키마 추측) 대신 앱 자체
      # 온보딩 로직을 그대로 태운다 — POST /api/v2/organizations가 org + org_member(owner) +
      # human member 앵커를 만든다. 그러면 다음 로그인(global-setup)의 토큰 app_metadata에
      # org_id가 실려 /me가 200+org_id를 주고 /inbox가 렌더된다(me.py는 프로젝트 없으면
      # proj_id=org_id로 폴백하므로 프로젝트는 불요).
      - name: Onboard e2e owner (create org via app API)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/v2/auth/token \
            -H 'content-type: application/json' \
            -d '{"email":"owner@sprintable.dev","password":"password123"}' | jq -r '.data.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "owner login failed"; exit 1; fi
          CODE=$(curl -s -o /tmp/org.json -w '%{http_code}' -X POST http://localhost:8000/api/v2/organizations \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"E2E CI","slug":"e2e-ci"}')
          echo "create-org HTTP $CODE"; cat /tmp/org.json || true; echo
          if [ "$CODE" != "201" ] && [ "$CODE" != "409" ]; then echo "org create failed"; exit 1; fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # playwright.config webServer가 `pnpm dev`로 Next(:3108)를 띄우고 e2e/global-setup이
      # owner 로그인 → playwright/.auth/owner.json storageState를 만든 뒤 contrast-guard.spec을 돈다.
      - name: Run contrast-guard e2e (axe color-contrast)
        run: pnpm --filter web e2e:contrast

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
