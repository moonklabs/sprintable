name: CI

on:
  pull_request:
    # story #2912(2899 그라운딩 갈래D 처방) — 기본값([opened, synchronize, reopened])엔
    # edited가 없어, base branch만 바뀌고 새 커밋이 없는 재타겟(synchronize 미발화)에서
    # 이 required 워크플로 자체가 재트리거되지 않았다(#3317 실사고). edited를 명시 추가해
    # base 재타겟도 새 런을 튼다 — required 3잡(alembic-fresh-db·backend-test·ci)엔
    # changes.base skip-필터를 걸지 않는다(그 잡들의 기존 `if: always()`가 스킵-캐스케이드
    # 방지용이라, skip 조건을 더하면 그 방지를 무력화한다 — [[ci-stuck-c-d-remedy-design-20260822]]
    # landmine 참고). title/body 편집에도 전체 재실행되지만 PR#3324의 concurrency그룹이
    # 연속 편집 시 구run을 자동취소해 낭비를 완화한다.
    types: [opened, synchronize, reopened, edited]
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # story #2555 — 선생님 플래그(2026-08-10): docs/FE-only PR도 백엔드 무거운 잡(alembic·
  # destructive-schema 4샤드·pytest)이 전량 돌아 ~30분. 실측(승격 PR #2952: README·docs·
  # apps/web·packages/cli·packages/fakechat만 변경, backend/ 미접촉)이 이 잡의 근거 픽스처다.
  #
  # ⛔job 레벨 `if:`로 백엔드 잡 자체를 스킵하지 «않는다» — qa-review-gate.yml/
  # design-review-gate.yml이 이미 정립한 이유와 동형: required 체크가 "미실행=스킵"으로
  # 잡히면 그 판정이 통과인지 미확인인지 GitHub 쪽에서 모호해질 수 있다("스킵=통과"로 세어질
  # 위험, 이 리포의 기존 결론). 대신 이 잡은 항상 돌고 «출력만» 준다 — 소비하는 3개 잡
  # (alembic-fresh-db·backend-test-destructive·backend-test, 전부 develop 필수 체크)이
  # «잡 안의 스텝»을 이 출력으로 조건부 스킵한다 — 잡 자체는 항상 실행→항상 success/failure를
  # 정상 보고(그냥 빠르게 끝날 뿐), required 체크 의미론이 전혀 안 흔들린다.
  detect-changed-scope:
    name: Detect changed-file scope (backend relevance)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend_relevant: ${{ steps.scope.outputs.backend_relevant }}
      gateway_relevant: ${{ steps.scope.outputs.gateway_relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine backend relevance from changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # push 이벤트(브랜치 직접 push — develop/main에 머지될 때 등)는 PR base/head가
          # 없다 — 비교 대상을 모르면 fail-closed(백엔드 전량 실행). 스코프 판별은 PR
          # 컨텍스트에서만 돈다(design-review-gate.yml의 AC8과 같은 fail-closed 원칙).
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            echo "backend_relevant=true" >> "$GITHUB_OUTPUT"
            echo "gateway_relevant=true" >> "$GITHUB_OUTPUT"
            echo "PR 컨텍스트 아님(push 이벤트 등) — fail-closed로 백엔드·gateway 전량 실행."
            exit 0
          fi
          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "changed files:"
          echo "${CHANGED}"
          # 이 allowlist에 «전부» 속하는 diff만 백엔드-무관으로 본다 — 모르는 경로가 하나라도
          # 있으면 fail-closed(백엔드 전량 실행). packages/{db,shared,core-storage,storage-api}
          # 포함 packages/* 전부 TS-only(package.json+tsconfig뿐, .py 파일 0개 확認,
          # 2026-08-16) — backend Python 런타임과 언어 경계로 격리돼 있다. backend/·ee/·
          # infra/·supabase/·connectors/·scripts/(루트)·.github/는 이 allowlist 밖(모르면
          # 포함 안 함 — 특히 .github/는 이 워크플로 자신의 안전을 위해 항상 백엔드-관련으로 본다).
          NON_SAFE="$(printf '%s\n' "${CHANGED}" \
            | grep -Ev '^docs/|\.md$|^apps/web/|^packages/' || true)"
          if [ -z "${NON_SAFE}" ] && [ -n "${CHANGED}" ]; then
            echo "backend_relevant=false" >> "$GITHUB_OUTPUT"
            echo "전 변경 파일이 백엔드-무관 allowlist(docs/·*.md·apps/web/·packages/) 안 — 백엔드 무거운 잡 skip 대상."
          else
            echo "backend_relevant=true" >> "$GITHUB_OUTPUT"
            echo "allowlist 밖 변경 있음(또는 변경 0건) — fail-closed로 백엔드 전량 실행."
            if [ -n "${NON_SAFE}" ]; then
              echo "allowlist 밖 파일:"
              echo "${NON_SAFE}"
            fi
          fi

          # story #3273(CI사각) — support-gateway는 backend와 반대 방향 필터가 안전하다.
          # backend는 packages/ 등 넓은 코드베이스에 걸쳐 있어 "안전 확定" allowlist(스킵 대상)를
          # 좁게 잡는 게 맞지만, support-gateway는 그 자체가 "0 fleet 자격"(app/config.py 상단
          # 주석) — 자기 디렉토리 밖 어떤 코드도 import하지 않는 게 설계 불변식이다. 그래서
          # 여기는 "관련 확定" allowlist(실행 대상)를 좁게 잡는 쪽이 더 안전하다 — 이 워크플로
          # 파일 자체가 바뀔 때도 돈다(자기 안전).
          GATEWAY_CHANGED="$(printf '%s\n' "${CHANGED}" \
            | grep -E '^support-gateway/|^\.github/workflows/ci\.yml$' || true)"
          if [ -n "${GATEWAY_CHANGED}" ] || [ -z "${CHANGED}" ]; then
            echo "gateway_relevant=true" >> "$GITHUB_OUTPUT"
            echo "support-gateway/ 변경 있음(또는 변경 0건) — gateway pytest 실행."
          else
            echo "gateway_relevant=false" >> "$GITHUB_OUTPUT"
            echo "support-gateway/ 밖 변경만 있음 — gateway pytest skip 대상."
          fi

  alembic-fresh-db:
    name: Alembic upgrade head (fresh DB)
    needs: [detect-changed-scope]
    # ⛔`if: always()` 필수 — 없으면 detect-changed-scope가 실패했을 때 GitHub 기본 동작으로
    # 이 잡 자체가(required 체크!) «스킵»된다(의존 잡 실패 시 자동 스킵 cascade). 그러면 잡
    # 안 스텝의 fail-closed(`!= 'false'`, 아래)가 전혀 무의미해진다 — 잡 자체가 안 돈다.
    # always()로 무조건 돌게 하고, 안에서 출력이 비어 있으면(=위 job 실패) 스텝 조건이
    # fail-closed로 정상 실행된다.
    if: always()
    runs-on: ubuntu-latest
    # story 8236bbc3(2026-07-03): 217초 실측(전체 스위트 3391개 대다수, 비파괴 real-DB 84개
    # 파일 포함) + 파괴적 54개 파일 격리 순회 오버헤드 버퍼. 규모상 샤딩 불요(설계 §1-D).
    # ⚠️story #2081 응급 상향(2026-07-21): 그 217초 추정치가 스위트 성장(파일 수 계속 증가)
    # 으로 낡았다 — 오늘만 6회+(#2339·2345·2352·2353·2364·#2372) 20m 캡에 걸려 재실행 의존.
    # #2372(미르코군, FE only — ko/en.json+goals tsx, 마이그레이션 파일 0개)까지 20m13s에
    # 걸려 "재시도로 넘김"이 마이그레이션 무관 PR에도 세금이 되는 게 실측됐다 — 응급으로
    # 25분 상향(근본 스위트 분할은 #2081 AC2/AC3 후속).
    #
    # ⭐story #2293(2026-07-28) — 왜 이 job이 pytest를 안 도는지(AC1):
    # 이 job은 한때 `backend-test`(아래)와 **byte-identical한 pytest 3스텝**(alembic upgrade
    # heads + non-destructive real-DB pytest + destructive-schema 94개 파일 격리순회)을
    # 중복으로 돌리고 있었다 — story #1982/8236bbc3(2026-07-17)가 backend-test의 realDB
    # 커버리지 갭을 닫으며 이 job의 2단계 구조를 "재사용"했는데, 그 뒤 이 job 쪽 pytest
    # 스텝을 접는 후속 정리가 없었다. 직접 대조(까심군, 2026-07-28) 결과 커맨드 문자열까지
    # 동일 — "create_all vs migration" 같은 스키마 구성 방식의 분기는 애초에 없었다(둘 다
    # `alembic upgrade heads`). PR #2576이 이 job에서 destructive 94개 중 77개까지 pass하고
    # 25분 천장에 cancelled된 사고(#2293)를 계기로, 아래 4스텝(마이그레이션 경로 자체의
    # 무결성 검증 — baseline parity·dual-head 수렴·existing-DB no-op)만 남기고 pytest 실행은
    # **`backend-test`가 유일한 실행처**가 되도록 걷어냈다. destructive-schema 94개는 이제
    # backend-test 쪽에서 샤딩(`backend-test-destructive`, 4-way)으로 처리한다.
    # ⛔이 job 이름(`Alembic upgrade head (fresh DB)`)은 develop 필수 상태 체크 문자열이라
    # **바꾸지 않았다** — 바꿨으면 branch protection이 이름 매칭 실패로 조용히 안 걸렸을
    # 것(파울로군 실측·경고, 2026-07-28).
    timeout-minutes: 25

    services:
      postgres:
        # pgvector image: the baseline schema declares `CREATE EXTENSION vector` (embeddings),
        # which the stock postgres:16 image lacks. Cloud SQL (dev/prod) has pgvector available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # story 8236bbc3: job 레벨로 승격(기존 스텝마다 중복 선언되던 5개 env var 통합) — 이 job의
    # 모든 pytest 호출(비파괴/파괴 공통)이 동일 자격증명을 쓴다.
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      PARITY_TEST_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # Empty DB → alembic/env.py provisions from the baseline snapshot (schema + global seed)
      # and stamps revision 0096. This is the exact path a freshly-wiped prod takes.
      # story bda4beac: 0148(core) 재부모 후 이 checkout(develop, ee_pricing 포함)은 dual-head
      # (core 0155+ · ee_pricing 0147) — `head`(단수)는 이제 모호해 `heads`(복수)로 전환.
      - name: alembic upgrade heads (fresh DB → baseline)
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        working-directory: backend
        run: uv run alembic upgrade heads

      - name: Verify tables created
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        run: |
          PGPASSWORD=sprintable psql -h localhost -U sprintable -d sprintable_test -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';" \
            | grep -E "^\s+[0-9]+"

      - name: Verify baseline parity (view + nullable + seed)
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        run: |
          set -e
          P() { PGPASSWORD=sprintable psql -h localhost -U sprintable -d sprintable_test -tA -c "$1"; }
          test "$(P "SELECT table_type FROM information_schema.tables WHERE table_name='team_members'")" = "VIEW"
          test "$(P "SELECT is_nullable FROM information_schema.columns WHERE table_name='project_access' AND column_name='org_member_id'")" = "YES"
          test "$(P "SELECT count(*) FROM workflow_templates")" -ge 1
          test "$(P "SELECT count(*) FROM plan_features")" -ge 1
          # post-baseline incremental migration applied on a fresh DB (forward-compat): 0097 column
          test "$(P "SELECT count(*) FROM information_schema.columns WHERE table_name='org_invites' AND column_name='project_ids'")" = "1"
          # baseline REVISION invariant — the snapshot was captured at 0096; changing this without
          # regenerating baseline/schema.sql would mis-stamp fresh DBs. Lock it.
          test "$(cat backend/alembic/baseline/REVISION)" = "0096"
          # E-STORAGE-SSOT S2 (0139): asset registry 3 테이블 + asset_links source_type CHECK 적용 확인.
          test "$(P "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('assets','asset_folders','asset_links')")" = "3"
          test "$(P "SELECT count(*) FROM pg_constraint WHERE conname='ck_asset_links_source_type'")" = "1"
          echo "baseline parity OK: team_members=VIEW, org_member_id nullable, seed present, 0097 applied, asset registry present, REVISION=0096"

      # story bda4beac: dual-head(core+ee_pricing) checkout에서 "current == 단일 head" 비교는
      # 항상 실패한다(current가 2행이라 head=1건과 부분일치 안 됨) — 두 head 집합이 정확히
      # 일치하는지(comm -3, 차집합 0행) 비교로 교체. 단일-head 컨텍스트(main)에서도 그대로
      # 성립(양쪽 다 1행이면 차집합도 0행).
      - name: Verify fresh DB reached heads (baseline + incremental)
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        working-directory: backend
        run: |
          set -e
          cur=$(uv run alembic current 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          heads=$(uv run alembic heads 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          echo "current=$cur"
          echo "heads=$heads"
          test -n "$cur"  # fresh DB is not stuck at baseline(0096) — reached at least one head
          diff <(echo "$cur") <(echo "$heads")  # current head set == full head set(전 head 도달)

      # existing-DB path: a DB already at heads must be a pure no-op — no migration re-runs.
      # (The fresh-DB run above already advanced this DB to heads via baseline + incremental.)
      - name: Existing-DB no-op (re-run upgrade heads)
        if: needs.detect-changed-scope.outputs.backend_relevant != 'false'
        working-directory: backend
        run: |
          set -e
          out=$(uv run alembic upgrade heads 2>&1); echo "$out"
          if echo "$out" | grep -q "Running upgrade"; then
            echo "FAIL: migrations re-ran on a DB already at heads (existing-DB path not a no-op)"; exit 1
          fi
          echo "OK: existing-DB upgrade heads is a no-op"

      - name: Skip reason (backend-irrelevant PR)
        if: needs.detect-changed-scope.outputs.backend_relevant == 'false'
        run: |
          echo "story #2555 — 변경 파일 전부가 백엔드-무관 allowlist(docs/·*.md·apps/web/·packages/) 안이라 이 잡의 마이그레이션 검증 스텝을 건너뛰었다."

  # story #2330(CI·승격안전, 2026-07-30) — alembic-fresh-db(위)는 "빈 DB에서 baseline-stamp
  # 후 나머지 리비전 전부를 «한 번의» command.upgrade() 호출(=한 트랜잭션 블록)"으로 올린다.
  # 그런데 실배포(dev/prod)는 언제나 "이미 어떤 리비전에 있는 DB에 «새 리비전 하나»를 얹는"
  # 별개의 job 실행이다 — 0217(story #2267)의 `autocommit_block()`이 정확히 이 차이로 갈렸다
  # (빈 DB에서 한 번에 쭉 올릴 때는 통과, 0216까지 올려진 DB에 0217만 단독 적용할 때만
  # `AssertionError(self._transaction is not None)`로 죽었다 — 민 로컬 재현, 2026-07-30).
  # ⭐이 job은 alembic-fresh-db를 «대체»하지 않는다 — 둘은 다른 것을 잰다(fresh-db는 "전체
  # 히스토리를 처음부터 재생할 수 있는가", 이 job은 "이미 마이그레이션된 기존 DB에 최신
  # 리비전 «한 단»이 그대로 얹히는가" — prod 승격이 실제로 밟는 경로는 후자).
  #
  # ⛔이 job이 못 잡는 것(반드시 읽어야 하는 한계 — story #2330 AC4. 스크립트 docstring에도
  # 같은 내용이 있다):
  #   · 여러 리비전이 «한 배치»로 함께 올라갈 때만 나는 상호작용 — 이 job은 항상 "head(들)
  #     직전까지 + head(들)만 단독" 두 단계만 재현한다(마지막 한 단만 단독으로 떼어 시험).
  #   · 실제 prod 데이터 크기/분포에서만 나는 문제(락 경합·인덱스 빌드 시간) — CI DB는 비어 있다.
  #   · downgrade(롤백) 경로 — upgrade만 잰다.
  # 「이제 다 잡는다」로 읽으면 그것이 다음 사고다.
  alembic-single-step-promotion:
    name: Alembic upgrade head (existing DB, single-step)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # story #2330 AC2(양성 대조는 이 잡 자체가 아니라 이 스토리를 구현한 PR 설명에 실측
      # 기록 — 옛 0217(autocommit_block 쓰던 버전)로 이 스크립트를 로컬 재현하면 실제로
      # RED, 지금 이 잡은 그 버그가 고쳐진 develop 상태를 잰다).
      - name: alembic upgrade — existing DB, single-step (parent → head alone, 별개 호출 2회)
        working-directory: backend
        run: uv run python scripts/ci_alembic_single_step_promotion_check.py

      - name: Verify reached heads
        working-directory: backend
        run: |
          set -e
          cur=$(uv run alembic current 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          heads=$(uv run alembic heads 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          echo "current=$cur"
          echo "heads=$heads"
          test -n "$cur"
          diff <(echo "$cur") <(echo "$heads")

  # story #2401(결함·CI) — #2397(PR #2777·#2781)이 develop 기준 같은 `0221`을 각자 새
  # 리비전으로 만들었는데도 위 #2330 게이트를 둘 다 통과했다: 그 게이트는 자기 브랜치의
  # alembic.ini만 보고, 형제 PR을 전혀 참조하지 않기 때문이다(dual-head는 머지 «후»에야
  # 드러났다). 이 잡은 그 시야를 메운다 — 자세한 검사 축·시간 축 한계 선언은
  # `ci_alembic_sibling_pr_collision_check.py` docstring 참고.
  alembic-sibling-pr-collision-check:
    name: Alembic sibling-PR revision collision (guard, story #2401)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # story #2401 hotfix(2026-08-17, 미르코 재현·확定): checkout(fetch-depth: 0)이 이미
      # develop 전체 히스토리를 받은 뒤, 여기서 `--depth=1`로 다시 fetch하면(그 사이 develop
      # tip이 움직였을 때) 그 얕은 fetch가 새 shallow 경계를 심어버린다 — 이후
      # `git diff origin/develop...HEAD`가 merge base를 못 찾고 exit 128로 죽는다(PR #3140
      # 실 CI에서 재현, 바쁜 밤처럼 develop이 자주 움직일 때만 터지는 타이밍 의존 버그).
      # checkout이 이미 전체 히스토리를 갖고 있으므로 이 fetch는 "최신 tip 반영"만이
      # 목적 — depth 제한 없이 다시 받는다(얕은 경계를 새로 심지 않음).
      - name: Fetch base branch (current tip, not PR-open-time)
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"
      - name: Check alembic revision collisions against base + sibling open PRs
        working-directory: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci_alembic_sibling_pr_collision_check.py

  # story #2330 AC6 — env.py(PR#2661)의 "autocommit_block()은 이 프로젝트에서 원리적으로
  # 못 쓴다" 주석은 «읽어야» 서는 것이었다(주석만으로는 다음 사람이 또 쓸 수 있다). grep
  # 가드로 승격한다 — 마이그레이션 파일에 그 호출이 들어오면 CI가 빨개진다.
  # story #2476(결제②-A1후속 재그라운딩, 2026-09-01) — legacy `subscriptions`·
  # `subscription_checkout_sessions` 테이블은 OSS(이 레포)에서 참조 0건이지만 死 테이블은
  # 아니다(docs/pk-triage-orm-unmodeled.md, story a74bdc84 — 별도 SaaS 제품이 같은 물리
  # DB를 라이브로 쓰는 중). OSS 정본은 org_subscriptions뿐 — 이 lint는 「참조 0」을 계수
  # 가능하게 유지한다(새 코드가 legacy 테이블을 다시 끌어오면 즉시 빨강).
  legacy-subscriptions-reuse-lint:
    name: legacy subscriptions reuse lint (guard, story #2476)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan backend/app for legacy subscriptions table reuse
        working-directory: backend
        run: python3 scripts/lint_legacy_subscriptions_reuse.py

  # story #2255(69d7380e, 2026-07-28~09-02) — app/models/*.py에 __tablename__ 보유 모델이
  # 새로 생겼는데 app/models/__init__.py에 import 안 되면 create_all()이 그 테이블을 조용히
  # 안 만든다(#2201이 처음 적발한 결함 클래스, 11개 중 10개가 이 스토리로 뒤늦게 등재됨 —
  # 등재 도중 이 가드로 5개가 «독립적으로 또» 새 있던 것도 같이 적발돼 함께 정리됨). 정적
  # AST 스캔뿐(런타임 import 0회) — 정상 경로 오버헤드 없음. story #2662의 실패-시점 진단
  # 가드와 보완 관계(겹치지 않음, 각 스크립트 docstring 참고).
  model-registration-completeness-lint:
    name: model registration completeness lint (guard, story #2255)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan app/models for unregistered __tablename__ models
        working-directory: backend
        run: python3 scripts/lint_model_registration_completeness.py

  alembic-no-autocommit-block:
    name: Alembic migrations — no autocommit_block() (guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: grep for autocommit_block() calls in migration files
        run: |
          # 실제 호출(`op.get_context().autocommit_block()`)만 잡는다 — docstring 산문에서
          # backtick으로 `autocommit_block()`을 «설명」하는 것(이 파일들에도 있다, 0217의
          # 사고 경위 서술)까지 걸리면 develop이 영구 RED가 된다. 실호출은 항상 앞에
          # `.`(메서드 호출 점)이 오고, 산문 인용은 backtick이 오므로 `\.` 앵커로 가른다.
          if grep -rnE '\.autocommit_block\s*\(' backend/alembic/versions/; then
            echo "FAIL: autocommit_block()은 이 프로젝트 alembic/env.py 설정(transaction_per_migration=False)에서" \
                 "원리적으로 못 쓴다(story #2330 — 0217 dev 배포 사고). CREATE INDEX CONCURRENTLY가 필요하면" \
                 "마이그레이션에 넣지 말고 배포 후 별도 수동 psql 세션으로 돌리는(env.py 주석 참조)."
            exit 1
          fi
          echo "OK: no autocommit_block() calls in migration files"

  # story #2335([클래스 봉인]) — Query(default=None) 센티널이 «직접호출 테스트»를 통해 새는
  # 클래스를 막는다. 같은 병이 #2191(테스트 주석에만 남고 코드가드 안 고침)→#2659(CI 21건
  # 실패)로 두 번 났고, 오늘(2026-07-30) 전수 스윕에서 12건 전부 크래시(조용히 틀리는 것 0건)
  # 임을 확認 — 그래서 41건 개별 수리는 안 하고(AC6, 크래시는 CI가 이미 잡는다) "이 클래스가
  # 세 번째 나지 않게" 막는 lint만 짓는다. 순수 AST 정적분석 — DB/의존성 불요, python3 stdlib뿐.
  #
  # grandfather 베이스라인(scripts/query_sentinel_baseline.txt): lint 도입 시점 develop에
  # 이미 있던 위반은 실패시키지 않는다(41건 개별 수리는 이 판이 아니라는 AC6 판정 그대로) —
  # 베이스라인에 없는 **새** 위반만 여기서 빨개진다.
  query-sentinel-direct-call-lint:
    name: Query(None) sentinel direct-call lint (guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for Query(...) params missing at router direct-call sites
        working-directory: backend
        run: python3 scripts/lint_query_sentinel_direct_calls.py
      # ⭐PO 판정(2026-07-30): grandfather 베이스라인은 "지금 있는 걸 봐준다"이지 "앞으로도
      # 여기 한 줄 더 넣고 넘어가도 된다"가 아니다 — 그러면 이 가드를 우회하는 «합법적인 문»이
      # 된다. 베이스라인 파일은 «줄기만» 허용한다: base 브랜치(보통 develop) 대비 새로 추가된
      # 줄이 있으면 실패시킨다(제거는 자유 — 사이트를 고쳐서 줄어드는 것은 언제나 환영).
      - name: "Verify baseline can only shrink (story #2335 — no new grandfather entries)"
        working-directory: backend
        run: |
          set -e
          # PO 질문(2026-07-30): "PR은 develop 대비인데, develop 자신에 푸시될 때는 무엇과
          # 견주는가?" — pull_request 이벤트는 PR의 base 브랜치(보통 develop)와, push
          # 이벤트(예: develop에 직접 머지)는 그 push 직전 커밋(github.event.before)과
          # 비교한다. 둘 다 없으면(예: 새 브랜치 최초 push) 비교 대상이 없어 검사를 스킵한다
          # — 그 경로에서는 이 가드가 안 돈다(한계로 남김, "이제 다 잡는다"로 안 읽히게).
          # ⛔실측(2026-07-30, CI 로그로 발견): `git fetch origin <branch> --depth=1`은
          # `FETCH_HEAD`만 채운다 — `refs/remotes/origin/<branch>`(즉 `origin/develop`
          # 이라는 이름)는 «만들지 않는다». 그래서 이 스텝이 처음 실렸을 때 PR_BASE_REF가
          # 정확히 "develop"으로 치환됐는데도 `git show origin/develop:...`가 그런 ref가
          # 없어 조용히 실패 → else(스킵) 분기로 떨어졌다(정확히 이 가드가 막으려던 그 모양
          # — "실행되는데 바깥을 안 만나는" 것. 뮤테이션 없이 실전에서 스스로 걸린 사례).
          # 고침: fetch 직후의 `FETCH_HEAD`를 그 자리에서 바로 쓴다(별도 remote-tracking
          # ref 이름에 의존하지 않는다).
          PR_BASE_REF="${{ github.event.pull_request.base.ref }}"
          PUSH_BEFORE_SHA="${{ github.event.before }}"
          COMPARE_REF=""
          COMPARE_LABEL=""
          if [ -n "$PR_BASE_REF" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="PR base:$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin "$PUSH_BEFORE_SHA" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="push-before:$PUSH_BEFORE_SHA"
          fi
          if [ -n "$COMPARE_REF" ] && git show "$COMPARE_REF:backend/scripts/query_sentinel_baseline.txt" > /tmp/base_baseline.txt 2>/dev/null; then
            grep -vE '^#|^$' /tmp/base_baseline.txt | sort -u > /tmp/base_sorted.txt
            grep -vE '^#|^$' scripts/query_sentinel_baseline.txt | sort -u > /tmp/head_sorted.txt
            new_lines=$(comm -13 /tmp/base_sorted.txt /tmp/head_sorted.txt || true)
            base_count=$(wc -l < /tmp/base_sorted.txt | tr -d ' ')
            head_count=$(wc -l < /tmp/head_sorted.txt | tr -d ' ')
            echo "baseline entries: base($COMPARE_LABEL)=$base_count head=$head_count"
            if [ -n "$new_lines" ]; then
              echo "FAIL: 베이스라인에 «새» 항목이 추가됐다 — 이 파일은 줄기만 허용한다(story #2335)." \
                   "새 위반은 여기 grandfather로 넣지 말고 실제로 고치는(파라미터를 명시로 넘기는) 것이 맞다:"
              echo "$new_lines"
              exit 1
            fi
            echo "OK: baseline은 늘지 않았다(줄었으면 환영 — 그만큼 사이트가 고쳐진 것)"
          elif [ -z "$COMPARE_REF" ]; then
            # PO 지적(2026-07-30): 한계를 문서에만 적으면 "그 파일 여는 사람"만 안다(#2191이
            # 그렇게 세 번째 재발했다) — 이 스킵도 CI stdout에 즉시·눈에 띄게 찍어야 그 자리로
            # 들어온 사람이 바로 안다. grep하기 쉬운 고정 문구로 남긴다.
            echo "baseline growth check skipped: no comparison base (PR context 아님 + push-before 미상 — 예: 새 브랜치 최초 push)"
          else
            # ⭐COMPARE_REF는 있었으나(PR base 또는 push-before를 정상 식별) git show가
            # 실패한 경우 — 가장 흔한 정당한 사유는 "그 비교시점(base 브랜치)에는 이 베이스
            # 라인 파일 자체가 아직 없었다"(예: 이 lint를 «처음» 들여오는 PR 자신). 이것도
            # 앞의 것과 별개 이유이므로 다른 문구로 남긴다 — 다음 사람이 "PR context가 없어서
            # 스킵됐나?"와 헷갈리지 않게.
            echo "baseline growth check skipped: no comparison base ($COMPARE_LABEL에 query_sentinel_baseline.txt 없음 — 이 PR이 그 파일을 «처음 도입»하는 중이면 정상이다, story #2335 자신이 그 경우다. 다음 PR부터는 develop에 파일이 있어 실제 비교가 돈다)"
          fi

  project-access-403-lint:
    name: has_project_access 403 lint (guard, story #2342)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for has_project_access denial raising 403 (should be 404)
