            fi
            echo "OK: baseline은 늘지 않았다(줄었으면 환영 — 그만큼 사이트가 헬퍼로 옮겨진 것)"
          elif [ -z "$COMPARE_REF" ]; then
            echo "baseline growth check skipped: no comparison base (PR context 아님 + push-before 미상 — 예: 새 브랜치 최초 push)"
          else
            echo "baseline growth check skipped: no comparison base ($COMPARE_LABEL에 dependency_override_get_read_db_baseline.txt 없음 — 이 PR이 그 파일을 «처음 도입»하는 중이면 정상이다, story #2451 자신이 그 경우다. 다음 PR부터는 develop에 파일이 있어 실제 비교가 돈다)"
          fi

