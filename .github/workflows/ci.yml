name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alembic-fresh-db:
    name: Alembic upgrade head (fresh DB)
    runs-on: ubuntu-latest
    # story 8236bbc3(2026-07-03): 217초 실측(전체 스위트 3391개 대다수, 비파괴 real-DB 84개
    # 파일 포함) + 파괴적 54개 파일 격리 순회 오버헤드 버퍼. 규모상 샤딩 불요(설계 §1-D).
    # ⚠️story #2081 응급 상향(2026-07-21): 그 217초 추정치가 스위트 성장(파일 수 계속 증가)
    # 으로 낡았다 — 오늘만 6회+(#2339·2345·2352·2353·2364·#2372) 20m 캡에 걸려 재실행 의존.
    # #2372(미르코군, FE only — ko/en.json+goals tsx, 마이그레이션 파일 0개)까지 20m13s에
    # 걸려 "재시도로 넘김"이 마이그레이션 무관 PR에도 세금이 되는 게 실측됐다 — 응급으로
    # 25분 상향(근본 스위트 분할은 #2081 AC2/AC3 후속).
    #
    # ⭐story #2293(2026-07-28) — 왜 이 job이 pytest를 안 도는지(AC1):
    # 이 job은 한때 `backend-test`(아래)와 **byte-identical한 pytest 3스텝**(alembic upgrade
    # heads + non-destructive real-DB pytest + destructive-schema 94개 파일 격리순회)을
    # 중복으로 돌리고 있었다 — story #1982/8236bbc3(2026-07-17)가 backend-test의 realDB
    # 커버리지 갭을 닫으며 이 job의 2단계 구조를 "재사용"했는데, 그 뒤 이 job 쪽 pytest
    # 스텝을 접는 후속 정리가 없었다. 직접 대조(까심군, 2026-07-28) 결과 커맨드 문자열까지
    # 동일 — "create_all vs migration" 같은 스키마 구성 방식의 분기는 애초에 없었다(둘 다
    # `alembic upgrade heads`). PR #2576이 이 job에서 destructive 94개 중 77개까지 pass하고
    # 25분 천장에 cancelled된 사고(#2293)를 계기로, 아래 4스텝(마이그레이션 경로 자체의
    # 무결성 검증 — baseline parity·dual-head 수렴·existing-DB no-op)만 남기고 pytest 실행은
    # **`backend-test`가 유일한 실행처**가 되도록 걷어냈다. destructive-schema 94개는 이제
    # backend-test 쪽에서 샤딩(`backend-test-destructive`, 4-way)으로 처리한다.
    # ⛔이 job 이름(`Alembic upgrade head (fresh DB)`)은 develop 필수 상태 체크 문자열이라
    # **바꾸지 않았다** — 바꿨으면 branch protection이 이름 매칭 실패로 조용히 안 걸렸을
    # 것(파울로군 실측·경고, 2026-07-28).
    timeout-minutes: 25

    services:
      postgres:
        # pgvector image: the baseline schema declares `CREATE EXTENSION vector` (embeddings),
        # which the stock postgres:16 image lacks. Cloud SQL (dev/prod) has pgvector available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # story 8236bbc3: job 레벨로 승격(기존 스텝마다 중복 선언되던 5개 env var 통합) — 이 job의
    # 모든 pytest 호출(비파괴/파괴 공통)이 동일 자격증명을 쓴다.
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      PARITY_TEST_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # Empty DB → alembic/env.py provisions from the baseline snapshot (schema + global seed)
      # and stamps revision 0096. This is the exact path a freshly-wiped prod takes.
      # story bda4beac: 0148(core) 재부모 후 이 checkout(develop, ee_pricing 포함)은 dual-head
      # (core 0155+ · ee_pricing 0147) — `head`(단수)는 이제 모호해 `heads`(복수)로 전환.
      - name: alembic upgrade heads (fresh DB → baseline)
        working-directory: backend
        run: uv run alembic upgrade heads

      - name: Verify tables created
        run: |
          PGPASSWORD=sprintable psql -h localhost -U sprintable -d sprintable_test -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';" \
            | grep -E "^\s+[0-9]+"

      - name: Verify baseline parity (view + nullable + seed)
        run: |
          set -e
          P() { PGPASSWORD=sprintable psql -h localhost -U sprintable -d sprintable_test -tA -c "$1"; }
          test "$(P "SELECT table_type FROM information_schema.tables WHERE table_name='team_members'")" = "VIEW"
          test "$(P "SELECT is_nullable FROM information_schema.columns WHERE table_name='project_access' AND column_name='org_member_id'")" = "YES"
          test "$(P "SELECT count(*) FROM workflow_templates")" -ge 1
          test "$(P "SELECT count(*) FROM plan_features")" -ge 1
          # post-baseline incremental migration applied on a fresh DB (forward-compat): 0097 column
          test "$(P "SELECT count(*) FROM information_schema.columns WHERE table_name='org_invites' AND column_name='project_ids'")" = "1"
          # baseline REVISION invariant — the snapshot was captured at 0096; changing this without
          # regenerating baseline/schema.sql would mis-stamp fresh DBs. Lock it.
          test "$(cat backend/alembic/baseline/REVISION)" = "0096"
          # E-STORAGE-SSOT S2 (0139): asset registry 3 테이블 + asset_links source_type CHECK 적용 확인.
          test "$(P "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('assets','asset_folders','asset_links')")" = "3"
          test "$(P "SELECT count(*) FROM pg_constraint WHERE conname='ck_asset_links_source_type'")" = "1"
          echo "baseline parity OK: team_members=VIEW, org_member_id nullable, seed present, 0097 applied, asset registry present, REVISION=0096"

      # story bda4beac: dual-head(core+ee_pricing) checkout에서 "current == 단일 head" 비교는
      # 항상 실패한다(current가 2행이라 head=1건과 부분일치 안 됨) — 두 head 집합이 정확히
      # 일치하는지(comm -3, 차집합 0행) 비교로 교체. 단일-head 컨텍스트(main)에서도 그대로
      # 성립(양쪽 다 1행이면 차집합도 0행).
      - name: Verify fresh DB reached heads (baseline + incremental)
        working-directory: backend
        run: |
          set -e
          cur=$(uv run alembic current 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          heads=$(uv run alembic heads 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          echo "current=$cur"
          echo "heads=$heads"
          test -n "$cur"  # fresh DB is not stuck at baseline(0096) — reached at least one head
          diff <(echo "$cur") <(echo "$heads")  # current head set == full head set(전 head 도달)

      # existing-DB path: a DB already at heads must be a pure no-op — no migration re-runs.
      # (The fresh-DB run above already advanced this DB to heads via baseline + incremental.)
      - name: Existing-DB no-op (re-run upgrade heads)
        working-directory: backend
        run: |
          set -e
          out=$(uv run alembic upgrade heads 2>&1); echo "$out"
          if echo "$out" | grep -q "Running upgrade"; then
            echo "FAIL: migrations re-ran on a DB already at heads (existing-DB path not a no-op)"; exit 1
          fi
          echo "OK: existing-DB upgrade heads is a no-op"

  # story #2330(CI·승격안전, 2026-07-30) — alembic-fresh-db(위)는 "빈 DB에서 baseline-stamp
  # 후 나머지 리비전 전부를 «한 번의» command.upgrade() 호출(=한 트랜잭션 블록)"으로 올린다.
  # 그런데 실배포(dev/prod)는 언제나 "이미 어떤 리비전에 있는 DB에 «새 리비전 하나»를 얹는"
  # 별개의 job 실행이다 — 0217(story #2267)의 `autocommit_block()`이 정확히 이 차이로 갈렸다
  # (빈 DB에서 한 번에 쭉 올릴 때는 통과, 0216까지 올려진 DB에 0217만 단독 적용할 때만
  # `AssertionError(self._transaction is not None)`로 죽었다 — 민 로컬 재현, 2026-07-30).
  # ⭐이 job은 alembic-fresh-db를 «대체»하지 않는다 — 둘은 다른 것을 잰다(fresh-db는 "전체
  # 히스토리를 처음부터 재생할 수 있는가", 이 job은 "이미 마이그레이션된 기존 DB에 최신
  # 리비전 «한 단»이 그대로 얹히는가" — prod 승격이 실제로 밟는 경로는 후자).
  #
  # ⛔이 job이 못 잡는 것(반드시 읽어야 하는 한계 — story #2330 AC4. 스크립트 docstring에도
  # 같은 내용이 있다):
  #   · 여러 리비전이 «한 배치»로 함께 올라갈 때만 나는 상호작용 — 이 job은 항상 "head(들)
  #     직전까지 + head(들)만 단독" 두 단계만 재현한다(마지막 한 단만 단독으로 떼어 시험).
  #   · 실제 prod 데이터 크기/분포에서만 나는 문제(락 경합·인덱스 빌드 시간) — CI DB는 비어 있다.
  #   · downgrade(롤백) 경로 — upgrade만 잰다.
  # 「이제 다 잡는다」로 읽으면 그것이 다음 사고다.
  alembic-single-step-promotion:
    name: Alembic upgrade head (existing DB, single-step)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # story #2330 AC2(양성 대조는 이 잡 자체가 아니라 이 스토리를 구현한 PR 설명에 실측
      # 기록 — 옛 0217(autocommit_block 쓰던 버전)로 이 스크립트를 로컬 재현하면 실제로
      # RED, 지금 이 잡은 그 버그가 고쳐진 develop 상태를 잰다).
      - name: alembic upgrade — existing DB, single-step (parent → head alone, 별개 호출 2회)
        working-directory: backend
        run: uv run python scripts/ci_alembic_single_step_promotion_check.py

      - name: Verify reached heads
        working-directory: backend
        run: |
          set -e
          cur=$(uv run alembic current 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          heads=$(uv run alembic heads 2>/dev/null | grep -oE '^[0-9a-z_]+' | sort)
          echo "current=$cur"
          echo "heads=$heads"
          test -n "$cur"
          diff <(echo "$cur") <(echo "$heads")

  # story #2330 AC6 — env.py(PR#2661)의 "autocommit_block()은 이 프로젝트에서 원리적으로
  # 못 쓴다" 주석은 «읽어야» 서는 것이었다(주석만으로는 다음 사람이 또 쓸 수 있다). grep
  # 가드로 승격한다 — 마이그레이션 파일에 그 호출이 들어오면 CI가 빨개진다.
  alembic-no-autocommit-block:
    name: Alembic migrations — no autocommit_block() (guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: grep for autocommit_block() calls in migration files
        run: |
          # 실제 호출(`op.get_context().autocommit_block()`)만 잡는다 — docstring 산문에서
          # backtick으로 `autocommit_block()`을 «설명」하는 것(이 파일들에도 있다, 0217의
          # 사고 경위 서술)까지 걸리면 develop이 영구 RED가 된다. 실호출은 항상 앞에
          # `.`(메서드 호출 점)이 오고, 산문 인용은 backtick이 오므로 `\.` 앵커로 가른다.
          if grep -rnE '\.autocommit_block\s*\(' backend/alembic/versions/; then
            echo "FAIL: autocommit_block()은 이 프로젝트 alembic/env.py 설정(transaction_per_migration=False)에서" \
                 "원리적으로 못 쓴다(story #2330 — 0217 dev 배포 사고). CREATE INDEX CONCURRENTLY가 필요하면" \
                 "마이그레이션에 넣지 말고 배포 후 별도 수동 psql 세션으로 돌리는(env.py 주석 참조)."
            exit 1
          fi
          echo "OK: no autocommit_block() calls in migration files"

  # story #2335([클래스 봉인]) — Query(default=None) 센티널이 «직접호출 테스트»를 통해 새는
  # 클래스를 막는다. 같은 병이 #2191(테스트 주석에만 남고 코드가드 안 고침)→#2659(CI 21건
  # 실패)로 두 번 났고, 오늘(2026-07-30) 전수 스윕에서 12건 전부 크래시(조용히 틀리는 것 0건)
  # 임을 확認 — 그래서 41건 개별 수리는 안 하고(AC6, 크래시는 CI가 이미 잡는다) "이 클래스가
  # 세 번째 나지 않게" 막는 lint만 짓는다. 순수 AST 정적분석 — DB/의존성 불요, python3 stdlib뿐.
  #
  # grandfather 베이스라인(scripts/query_sentinel_baseline.txt): lint 도입 시점 develop에
  # 이미 있던 위반은 실패시키지 않는다(41건 개별 수리는 이 판이 아니라는 AC6 판정 그대로) —
  # 베이스라인에 없는 **새** 위반만 여기서 빨개진다.
  query-sentinel-direct-call-lint:
    name: Query(None) sentinel direct-call lint (guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for Query(...) params missing at router direct-call sites
        working-directory: backend
        run: python3 scripts/lint_query_sentinel_direct_calls.py
      # ⭐PO 판정(2026-07-30): grandfather 베이스라인은 "지금 있는 걸 봐준다"이지 "앞으로도
      # 여기 한 줄 더 넣고 넘어가도 된다"가 아니다 — 그러면 이 가드를 우회하는 «합법적인 문»이
      # 된다. 베이스라인 파일은 «줄기만» 허용한다: base 브랜치(보통 develop) 대비 새로 추가된
      # 줄이 있으면 실패시킨다(제거는 자유 — 사이트를 고쳐서 줄어드는 것은 언제나 환영).
      - name: "Verify baseline can only shrink (story #2335 — no new grandfather entries)"
        working-directory: backend
        run: |
          set -e
          # PO 질문(2026-07-30): "PR은 develop 대비인데, develop 자신에 푸시될 때는 무엇과
          # 견주는가?" — pull_request 이벤트는 PR의 base 브랜치(보통 develop)와, push
          # 이벤트(예: develop에 직접 머지)는 그 push 직전 커밋(github.event.before)과
          # 비교한다. 둘 다 없으면(예: 새 브랜치 최초 push) 비교 대상이 없어 검사를 스킵한다
          # — 그 경로에서는 이 가드가 안 돈다(한계로 남김, "이제 다 잡는다"로 안 읽히게).
          # ⛔실측(2026-07-30, CI 로그로 발견): `git fetch origin <branch> --depth=1`은
          # `FETCH_HEAD`만 채운다 — `refs/remotes/origin/<branch>`(즉 `origin/develop`
          # 이라는 이름)는 «만들지 않는다». 그래서 이 스텝이 처음 실렸을 때 PR_BASE_REF가
          # 정확히 "develop"으로 치환됐는데도 `git show origin/develop:...`가 그런 ref가
          # 없어 조용히 실패 → else(스킵) 분기로 떨어졌다(정확히 이 가드가 막으려던 그 모양
          # — "실행되는데 바깥을 안 만나는" 것. 뮤테이션 없이 실전에서 스스로 걸린 사례).
          # 고침: fetch 직후의 `FETCH_HEAD`를 그 자리에서 바로 쓴다(별도 remote-tracking
          # ref 이름에 의존하지 않는다).
          PR_BASE_REF="${{ github.event.pull_request.base.ref }}"
          PUSH_BEFORE_SHA="${{ github.event.before }}"
          COMPARE_REF=""
          COMPARE_LABEL=""
          if [ -n "$PR_BASE_REF" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="PR base:$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin "$PUSH_BEFORE_SHA" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="push-before:$PUSH_BEFORE_SHA"
          fi
          if [ -n "$COMPARE_REF" ] && git show "$COMPARE_REF:backend/scripts/query_sentinel_baseline.txt" > /tmp/base_baseline.txt 2>/dev/null; then
            grep -vE '^#|^$' /tmp/base_baseline.txt | sort -u > /tmp/base_sorted.txt
            grep -vE '^#|^$' scripts/query_sentinel_baseline.txt | sort -u > /tmp/head_sorted.txt
            new_lines=$(comm -13 /tmp/base_sorted.txt /tmp/head_sorted.txt || true)
            base_count=$(wc -l < /tmp/base_sorted.txt | tr -d ' ')
            head_count=$(wc -l < /tmp/head_sorted.txt | tr -d ' ')
            echo "baseline entries: base($COMPARE_LABEL)=$base_count head=$head_count"
            if [ -n "$new_lines" ]; then
              echo "FAIL: 베이스라인에 «새» 항목이 추가됐다 — 이 파일은 줄기만 허용한다(story #2335)." \
                   "새 위반은 여기 grandfather로 넣지 말고 실제로 고치는(파라미터를 명시로 넘기는) 것이 맞다:"
              echo "$new_lines"
              exit 1
            fi
            echo "OK: baseline은 늘지 않았다(줄었으면 환영 — 그만큼 사이트가 고쳐진 것)"
          elif [ -z "$COMPARE_REF" ]; then
            # PO 지적(2026-07-30): 한계를 문서에만 적으면 "그 파일 여는 사람"만 안다(#2191이
            # 그렇게 세 번째 재발했다) — 이 스킵도 CI stdout에 즉시·눈에 띄게 찍어야 그 자리로
            # 들어온 사람이 바로 안다. grep하기 쉬운 고정 문구로 남긴다.
            echo "baseline growth check skipped: no comparison base (PR context 아님 + push-before 미상 — 예: 새 브랜치 최초 push)"
          else
            # ⭐COMPARE_REF는 있었으나(PR base 또는 push-before를 정상 식별) git show가
            # 실패한 경우 — 가장 흔한 정당한 사유는 "그 비교시점(base 브랜치)에는 이 베이스
            # 라인 파일 자체가 아직 없었다"(예: 이 lint를 «처음» 들여오는 PR 자신). 이것도
            # 앞의 것과 별개 이유이므로 다른 문구로 남긴다 — 다음 사람이 "PR context가 없어서
            # 스킵됐나?"와 헷갈리지 않게.
            echo "baseline growth check skipped: no comparison base ($COMPARE_LABEL에 query_sentinel_baseline.txt 없음 — 이 PR이 그 파일을 «처음 도입»하는 중이면 정상이다, story #2335 자신이 그 경우다. 다음 PR부터는 develop에 파일이 있어 실제 비교가 돈다)"
          fi

  project-access-403-lint:
    name: has_project_access 403 lint (guard, story #2342)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for has_project_access denial raising 403 (should be 404)
        working-directory: backend
        run: python3 scripts/lint_project_access_403.py
      # story #2335와 동일 계약 — 베이스라인은 «줄기만» 허용한다(2026-07-30 발견: #2342
      # 스코프 밖에 22곳이 더 있어 지금 당장 못 고친다 — 새로 늘리는 것만 막는다).
      - name: "Verify baseline can only shrink (story #2342 — no new grandfather entries)"
        working-directory: backend
        run: |
          set -e
          PR_BASE_REF="${{ github.event.pull_request.base.ref }}"
          PUSH_BEFORE_SHA="${{ github.event.before }}"
          COMPARE_REF=""
          COMPARE_LABEL=""
          if [ -n "$PR_BASE_REF" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="PR base:$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin "$PUSH_BEFORE_SHA" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="push-before:$PUSH_BEFORE_SHA"
          fi
          if [ -n "$COMPARE_REF" ] && git show "$COMPARE_REF:backend/scripts/project_access_403_baseline.txt" > /tmp/base_baseline.txt 2>/dev/null; then
            grep -vE '^#|^$' /tmp/base_baseline.txt | sort -u > /tmp/base_sorted.txt
            grep -vE '^#|^$' scripts/project_access_403_baseline.txt | sort -u > /tmp/head_sorted.txt
            new_lines=$(comm -13 /tmp/base_sorted.txt /tmp/head_sorted.txt || true)
            base_count=$(wc -l < /tmp/base_sorted.txt | tr -d ' ')
            head_count=$(wc -l < /tmp/head_sorted.txt | tr -d ' ')
            echo "baseline entries: base($COMPARE_LABEL)=$base_count head=$head_count"
            if [ -n "$new_lines" ]; then
              echo "FAIL: 베이스라인에 «새» 항목이 추가됐다 — 이 파일은 줄기만 허용한다(story #2342)." \
                   "새 위반은 여기 grandfather로 넣지 말고 실제로 고치는(403→404) 것이 맞다:"
              echo "$new_lines"
              exit 1
            fi
            echo "OK: baseline은 늘지 않았다(줄었으면 환영 — 그만큼 사이트가 고쳐진 것)"
          elif [ -z "$COMPARE_REF" ]; then
            echo "baseline growth check skipped: no comparison base (PR context 아님 + push-before 미상 — 예: 새 브랜치 최초 push)"
          else
            echo "baseline growth check skipped: no comparison base ($COMPARE_LABEL에 project_access_403_baseline.txt 없음 — 이 PR이 그 파일을 «처음 도입»하는 중이면 정상이다, story #2342 자신이 그 경우다. 다음 PR부터는 develop에 파일이 있어 실제 비교가 돈다)"
          fi

  dependency-override-get-read-db-lint:
    name: dependency_overrides get_read_db lint (guard, story #2451)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for raw dependency_overrides[get_db] (must use override_db_and_read)
        working-directory: backend
        run: python3 scripts/lint_dependency_override_get_read_db.py
      # story #2342/#2335와 동일 계약 — 베이스라인은 «줄기만» 허용한다(2026-08-04 도입 시점
      # tests/ 전역에 이미 253곳 — 대부분 read-route 무관이라 당장 안 고친다. 새로 늘리는
      # 것만 막는다. 카디르 QA 3차 재발: 이 게이트가 없으면 다음 슬라이스(Phase B 등)에서
      # 네 번째로 같은 클래스가 샌다).
      - name: "Verify baseline can only shrink (story #2451 — no new grandfather entries)"
        working-directory: backend
        run: |
          set -e
          PR_BASE_REF="${{ github.event.pull_request.base.ref }}"
          PUSH_BEFORE_SHA="${{ github.event.before }}"
          COMPARE_REF=""
          COMPARE_LABEL=""
          if [ -n "$PR_BASE_REF" ]; then
            git fetch origin "$PR_BASE_REF" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="PR base:$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin "$PUSH_BEFORE_SHA" --depth=1 2>&1 | tail -3 || true
            COMPARE_REF="FETCH_HEAD"
            COMPARE_LABEL="push-before:$PUSH_BEFORE_SHA"
          fi
          if [ -n "$COMPARE_REF" ] && git show "$COMPARE_REF:backend/scripts/dependency_override_get_read_db_baseline.txt" > /tmp/base_baseline.txt 2>/dev/null; then
            grep -vE '^#|^$' /tmp/base_baseline.txt | sort -u > /tmp/base_sorted.txt
            grep -vE '^#|^$' scripts/dependency_override_get_read_db_baseline.txt | sort -u > /tmp/head_sorted.txt
            new_lines=$(comm -13 /tmp/base_sorted.txt /tmp/head_sorted.txt || true)
            base_count=$(wc -l < /tmp/base_sorted.txt | tr -d ' ')
            head_count=$(wc -l < /tmp/head_sorted.txt | tr -d ' ')
            echo "baseline entries: base($COMPARE_LABEL)=$base_count head=$head_count"
            if [ -n "$new_lines" ]; then
              echo "FAIL: 베이스라인에 «새» 항목이 추가됐다 — 이 파일은 줄기만 허용한다(story #2451)." \
                   "새 raw override는 여기 grandfather로 넣지 말고 override_db_and_read로 고치는 것이 맞다:"
              echo "$new_lines"
              exit 1
            fi
            echo "OK: baseline은 늘지 않았다(줄었으면 환영 — 그만큼 사이트가 헬퍼로 옮겨진 것)"
          elif [ -z "$COMPARE_REF" ]; then
            echo "baseline growth check skipped: no comparison base (PR context 아님 + push-before 미상 — 예: 새 브랜치 최초 push)"
          else
            echo "baseline growth check skipped: no comparison base ($COMPARE_LABEL에 dependency_override_get_read_db_baseline.txt 없음 — 이 PR이 그 파일을 «처음 도입»하는 중이면 정상이다, story #2451 자신이 그 경우다. 다음 PR부터는 develop에 파일이 있어 실제 비교가 돈다)"
          fi

  candidate-source-ownership-lint:
    name: candidate_id source_id ownership lint (guard, story #2363)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan reference_semantic_candidates.py for candidate_id lookups missing source_id ownership check
        working-directory: backend
        run: python3 scripts/lint_candidate_source_ownership.py

  # story #2459 회귀(2026-08-05, PR #2851/#2461) — commit() 後 model_validate() 前 refresh
  # 누락 클래스를 원천봉쇄. 스크립트 docstring(scripts/lint_commit_before_validate.py) 참조 —
  # baseline 없음(도입 시점 위반 0건, app/routers·app/services·ee 전 스윕 후 확認).
  commit-before-validate-lint:
    name: commit-then-model_validate refresh lint (guard, story #2459)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan for model_validate() after commit() without intervening refresh
        working-directory: backend
        run: python3 scripts/lint_commit_before_validate.py

  # story bda4beac: alembic-fresh-db(위)는 checkout된 브랜치(develop/PR)의 파일셋 기준이라
  # main이 develop과 다른 파일셋(ee_pricing 0146/0147 부재)일 때의 그래프 단절을 원천적으로
  # 못 잡는다(실제로 못 잡아서 prod 승격이 롤백된 그 사고). PR base가 main일 때만 도는 이
  # 프리플라이트가 "이 PR이 머지되면 main이 실제로 갖게 될 파일셋"으로 fresh-DB upgrade heads
  # 를 실증한다 — develop→main 승격 PR은 그 시점에 이미 main-후보 파일셋으로 체크아웃되므로
  # (선별 제외가 그 PR 자체의 diff), PR HEAD 그대로 체크아웃하면 된다.
  main-alembic-preflight:
    name: Main Alembic preflight (fresh DB, main file set)
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_main_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_main_preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # ee_pricing(0146/0147)이 main 승격分에 섞여 들어왔다면 여기서 즉시 실패 — main은
      # 항상 단일 core head(0148 직계)여야 한다.
      #
      # story 21ade1fa: 0162(ee_pricing 0147 + core 0161 merge node)도 같은 이유로 제외
      # 대상 — 하지만 0146/0147과 달리 main 히스토리에 "삭제됐던 적"이 없는 신규 파일이라
      # `git merge develop`가 conflict 없이 조용히 add해버린다(dry-run 실측 확인, 2026-07-07).
      # 즉 0146/0147은 git이 알아서 걸러주지만 0162는 사람이 명시적으로 git rm 해야 하고,
      # 잊었을 때 이 assert가 없으면 실패가 알렘빅의 불친절한 KeyError로만 드러난다.
      - name: Assert main migration file set (no ee_pricing/merge-node, core 0148 present)
        working-directory: backend
        run: |
          set -e
          test -f alembic/versions/0148_org_subscriptions_org_id_unique.py
          # ⭐2026-08-01(promo #2783·PO): ee_pricing(0146/0147) + merge node 0162 «금지»를 걷었다.
          # 걷은 이유 — 이 assert 는 「main 은 ee_pricing 을 «영원히» 안 가진다」를 단언했는데,
          # 그것이 참일 수 없다. prod 실측(2026-08-01, 읽기전용 잡): pricing_versions 테이블이
          # 없는데 ee/routers/billing.py 는 그것을 읽는다. 즉 「안 올린다」가 유지 가능한 상태가
          # 아니었고, 그 사이 두 체인이 0163 에서 «같은 이름·다른 부모»로 갈렸다(#2397).
          # ⇒ 승격을 막던 것이 이 assert 였고, 막힌 채로는 그 갈림이 영영 안 닫힌다.
          # ⛔대신 이 잡의 나머지가 여전히 지킨다: 0148(core) 존재 · single head · fresh-DB upgrade.
          #   0162 는 merge node 라 head 를 늘리지 않는다 — single head assert 로 그것이 계속 재진다.
          echo "OK: main file set has 0148(core); ee_pricing/merge-node 금지는 promo #2783 에서 해제"

      - name: Build revision graph (single head expected)
        working-directory: backend
        run: |
          set -e
          heads=$(uv run alembic heads 2>/dev/null | grep -oE '^[0-9a-z_]+')
          n=$(echo "$heads" | grep -c .)
          echo "heads=$heads (count=$n)"
          test "$n" = "1"  # 0162 는 merge node 라 ee_pricing 이 들어와도 head 는 하나여야 한다

      - name: Fresh-DB upgrade heads (main file set)
        working-directory: backend
        run: uv run alembic upgrade heads

  # story #2293(2026-07-28) — destructive_schema 94개 파일 순차 격리 루프(파일마다 fresh
  # throwaway DB 생성/드롭)가 25분 천장에 붙었다(PR #2576 conclusion=cancelled, 77/94까지
  # 전부 pass하고 시간만 모자라 잘림 — 빨간 것은 0건). 개별 테스트는 안 느리다(2026-07-28
  # 실측 최대 16.24초, `infra/destructive-schema-shard-weights.json`) — 파일마다 붙는
  # dropdb/createdb/CREATE EXTENSION 오버헤드가 94번 누적된 것이 벽시계 대부분이었다.
  # `backend/scripts/shard_destructive_tests.py`가 그 오버헤드를 4-way로 병렬화한다
  # (`test_shard_destructive_tests.py::test_partition_is_lossless_for_any_input`이 무손실을
  # 고정 — 파일이 조용히 안 도는 샤드 경계 실패를 막는다).
  #
  # ⛔이 job은 develop 필수 상태 체크가 아니다(파울로군 실측, 2026-07-28: 필수 체크는
  # "Backend pytest"·"Lint, Type Check, Test, Build"·"Alembic upgrade head (fresh DB)" 셋
  # 뿐). 그래서 `backend-test`(아래, 필수)가 `needs:`로 이 job에 의존하고, 이 job의 샤드가
  # 하나라도 실패하면 `backend-test`가 그 사실을 스스로 감지해 명시적으로 fail한다(GitHub의
  # 기본 skip 전파에 기대지 않는다 — "유일한 실행처가 조용히 안 돌면 아무도 모른다"는
  # 지적에 대한 답).
  backend-test-destructive:
    name: Backend destructive-schema (shard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false  # 한 샤드 실패가 다른 샤드를 취소하면 "어디까지 진짜 돌았는지"가 흐려진다
      matrix:
        shard: [0, 1, 2, 3]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      PARITY_TEST_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Determine this shard's file list
        working-directory: backend
        run: |
          uv run python scripts/shard_destructive_tests.py \
            --shard-index ${{ matrix.shard }} --shard-count 4 --print-summary \
            > /tmp/shard_files.txt
          echo "이 샤드(${{ matrix.shard }}) 파일 수: $(wc -l < /tmp/shard_files.txt)"

      # story 8236bbc3: destructive_schema 마커 파일(Base.metadata.create_all/drop_all로 자체
      # 스키마 직접 관리)은 alembic-migrated 공유 DB에서 절대 실행하지 않는다 — 실측대로
      # drop_all()이 DB를 오염시켜 같은 세션 후속 테스트 전부를 연쇄 실패시킬 수 있다.
      # 파일마다 독립 throwaway DB(sprintable_test_iso)로 완전 격리한다(샤딩 전과 동일 원칙 —
      # 바뀐 것은 «몇 개를 도는가»이지 «어떻게 격리하는가»가 아니다).
      - name: Run pytest (destructive schema — isolated fresh DB per file, this shard)
        working-directory: backend
        run: |
          set -uo pipefail
          # set -e를 여기선 안 쓴다 — 첫 실패 파일이 스크립트를 즉시 죽이면 이 샤드의 나머지
          # 파일은 조용히 미실행된 것과 동일한 결과가 된다(#2293이 막으려는 바로 그 실패 유형).
          mapfile -t files < /tmp/shard_files.txt
          echo "destructive files (shard ${{ matrix.shard }}): ${#files[@]}"
          failed_files=()
          for f in "${files[@]}"; do
            echo "::group::isolated $f"
            PGPASSWORD=sprintable dropdb -h localhost -U sprintable --if-exists sprintable_test_iso
            PGPASSWORD=sprintable createdb -h localhost -U sprintable sprintable_test_iso
            PGPASSWORD=sprintable psql -h localhost -U sprintable -d sprintable_test_iso \
              -c 'CREATE EXTENSION IF NOT EXISTS vector;'
            ALEMBIC_DATABASE_URL=postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test_iso \
            PARITY_TEST_DATABASE_URL=postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test_iso \
            DATABASE_URL=postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test_iso \
            uv run pytest -q "$f" || failed_files+=("$f")
            echo "::endgroup::"
          done
          if [ "${#failed_files[@]}" -gt 0 ]; then
            echo "FAILED files: ${failed_files[*]}"
            exit 1
          fi
          echo "OK: all ${#files[@]} isolated destructive-schema files passed (shard ${{ matrix.shard }})"

  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    needs: [backend-test-destructive]
    if: always()
    # story #1982(2026-07-17): postgres service + real-PG env 배선. 이 갭은 story #1472
    # (2026-06-21)에서 이미 발견됐고, story 8236bbc3(#1619, 2026-07-03)이 "backend-test job
    # 무변경(회귀0 최대보수)"으로 의도적으로 유보했던 트레이드오프다 — 그 결과 `_REAL_DB_SKIP`
    # 마커 테스트(예: test_1974_gate_assigned_to_me.py의 realdb 3건)가 이 job에서 조용히 skip
    # 되어 CI green이 realPG 왕복 거동을 실제로 보증하지 못했다. non-destructive real-DB
    # 커버리지는 이 job이 직접 돈다(공유 alembic-migrated 스키마 위 — 격리 불요).
    #
    # ⭐story #2293(2026-07-28): destructive_schema 94개는 더는 이 job이 직접 돌지 않는다
    # (AC1 — alembic-fresh-db와 byte-identical 중복이었다·아래 backend-test-destructive로
    # 이관). 이 job은 develop 필수 상태 체크(이름 "Backend pytest")라 **이름을 바꾸지
    # 않았다** — `needs: [backend-test-destructive]` + `if: always()` + 아래 첫 스텝의 명시적
    # exit 1로, 94개 중 하나라도 실패/샤드가 안 돌면 이 필수 체크 자체가 빨개지게 만든다
    # (GitHub의 기본 `needs`-실패-시-skip에만 기대면 "필수 체크가 skipped로 조용히 안
    # 걸리는" 위험이 있다 — 파울로군 지적).
    timeout-minutes: 25

    services:
      postgres:
        # pgvector image: the baseline schema declares `CREATE EXTENSION vector` (embeddings),
        # which the stock postgres:16 image lacks. Cloud SQL (dev/prod) has pgvector available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      PARITY_TEST_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      SECRET_KEY: ci-test-secret-at-least-32-chars-long

    steps:
      - name: Require all destructive-schema shards to have succeeded
        if: needs.backend-test-destructive.result != 'success'
        run: |
          echo "backend-test-destructive result=${{ needs.backend-test-destructive.result }} — destructive-schema 94개의 유일한 실행처가 실패했거나 안 돎"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # non-destructive real-PG 테스트(84개 파일, destructive_schema 마커 제외)는 alembic-migrated
      # 스키마(view·nullable·seed 포함 baseline)에 의존한다 — fresh DB를 먼저 heads까지 올린다
      # (그렇지 않으면 테이블 부재로 realdb 테스트가 실패한다).
      - name: alembic upgrade heads (fresh DB → baseline)
        working-directory: backend
        run: uv run alembic upgrade heads

      - name: Run pytest (non-destructive, real-PG auto-discovered via marker)
        working-directory: backend
        run: uv run pytest -q -m "not destructive_schema"

  ci:
    name: Lint, Type Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      # story #1957(P2-S1) breakpoint SSOT 회귀가드: md:(768) 신규 사용은 useIsMobile()의
      # 1024 기준과 어긋나는 route 내 md·lg 혼재를 재도입한다. 기존 사용은 grandfather
      # allowlist로 통과, 새 파일/allowlist 밖 파일에서만 실패.
      - name: "Verify no new md: breakpoint (story #1957 regression guard)"
        run: pnpm --filter web verify:no-new-md-breakpoint

      # story #2057(유나 규격) 회귀가드: 포커스 링에 알파를 붙이면 대비가 깎인다(40% 알파
      # 실측 최악 1.7:1대 — AA 3.0 미달). focus:/focus-visible: 접두 ring-*/N 100건을 전부
      # 알파 제거로 고쳤고, 재도입되면 이 스텝이 실패한다.
      - name: "Verify no alpha on focus ring (story #2057 regression guard)"
        run: pnpm --filter web verify:no-alpha-focus-ring

      # story #2061 회귀가드: 손수 구현된 `fixed inset-0` 모달(role="dialog"/aria-modal/
      # 포커스트랩 없음)이 새로 들어오면 이 스텝이 실패한다. 공용 <Dialog>/<Sheet> 또는
      # useFocusTrap으로 배선된 것은 통과한다.
      - name: "Verify no hand-rolled modal without accessibility (story #2061 regression guard)"
        run: pnpm --filter web verify:no-handrolled-modal

      # story #1933 회귀가드: request.url을 new URL()의 base로 쓰면 Cloud Run 내부 주소가
      # 새어 나간다(플랫폼 성질). auth/native·internal-dogfood 3곳을 resolveAppUrl(null)로
      # 고쳤고, 재도입되면 이 스텝이 실패한다.
      - name: "Verify no request.url used as URL base (story #1933 regression guard)"
        run: pnpm --filter web verify:no-request-url-as-base

      # story #2062 회귀가드: 패딩도 focus-inset(유나 규격)도 없는 overflow-*-auto|scroll
      # 스크롤 컨테이너가 새로 들어오면 이 스텝이 실패한다(#2057 포커스 링 클리핑 재발 방지).
      - name: "Verify focus-inset coverage on scroll containers (story #2062 regression guard)"
        run: pnpm --filter web verify:focus-inset-coverage

      # story #2367 회귀가드: 같은 파일이 렌더하는 두 문구가(한쪽이 {n}류 보간으로 수와
      # 함께 서는 경우) 부분문자열로 겹치면 실패한다(#2352·#2365 — 「막힘 28↔0」·「승인 대기
      # 30↔없음」과 같은 화면 자기모순 재발 방지). ⛔같은 화면이라도 다른 파일이 원인인
      # 경우(#2352·#2365 원 사고 자체)는 이 v1 스코프 밖 — 스크립트 헤더 주석 참조.
      - name: "Verify no i18n phrase substring collision (story #2367 regression guard)"
        run: pnpm --filter web verify:no-i18n-phrase-collision

      # story #2420 AC3 회귀가드: globals.css의 `--<family>-tint` 배경 위에서 --foreground가
      # AA(4.5)를 넘는지 «정의 시점»에 계산한다(oklch→sRGB 변환은 Yuna의 실 Chromium canvas
      # 캡처값과 대조 검증된 순수함수 — 브라우저 불요, 빠르고 결정적). 새 계열(예: --info-tint)이
      # globals.css에 추가되면 이 스텝이 코드 수정 없이 자동으로 그 계열도 검사한다 — #2419가
      # 겪은 "이름이 늘 때마다 사용처 스윕을 다시 도는" 병을 정의 축에서 원천 차단한다.
      - name: "Verify tint background × foreground contrast (story #2420 regression guard)"
        run: pnpm --filter web verify:tint-foreground-contrast

      # story #2480(유나 규격) 회귀가드: `--muted-foreground`는 bg-muted·background·card
      # 위에서 전부 쓰인다(테이블 헤더·플레이스홀더·칩·보조텍스트 도처). 라이트 bg-muted 위
      # 실측 4.39:1로 AA 미달이 발견돼(#2866 가디언 리뷰 중) 토큰을 L 0.552→0.52로 조정했다.
      # 이 스텝이 재도입(값이 다시 4.39 쪽으로 밀림)을 정의 시점에 잡는다.
      - name: "Verify muted-foreground contrast (story #2480 regression guard)"
        run: pnpm --filter web verify:muted-foreground-contrast

      # story #2484 advisory 넛지(⛔blocker 아님·PO 確定) — FE가 error.code를 안 갈라
      # 서버 raw message/json.detail을 그대로 노출하는 병이 #2441·#2470·create-org로
      # 3번 반복됐다. 이 스텝은 그 병의 단순형(주변에 .code 분기가 없는 경우)만 잡아
      # 로그로 알린다. baseline(raw-error-message-baseline.json) 밖의 새 자리가 있어도
      # 이 스텝 자체는 항상 성공한다(스크립트가 always exit 0) — 리뷰어가 로그를 보고
      # 판단하는 넛지이지 머지 게이트가 아니다.
      - name: "Verify no new raw error.message exposure (story #2484 advisory nudge)"
        run: pnpm --filter web verify:no-raw-error-message

      # story #2420 AC7 회귀가드: AC3(위)는 globals.css 정의만 본다 — 사용처(컴포넌트 파일)는
      # 전혀 안 읽는다. 실제로 사용처 하나(goals-client.tsx:615)를 계열색으로 되돌려도 AC3·
      # type-check·lint·해당 vitest 전부 그대로 초록이었다(실측, 디디). 이 스텝은 같은
      # 문자열/템플릿 리터럴 안에 `bg-<X>-tint|알파`와 `text-<X>`(같은 계열)가 함께 있는 자리를
      # 센다 — 지금 있는 90건(baseline, scripts/tint-color-text-baseline.json)은 실패시키지
      # 않고, 그 밖의 «새» 자리만 잡는다. 기존 90건을 개별 수리하는 것은 이 스텝의 일이 아니다
      # (#2093 lint_query_sentinel_direct_calls.py와 같은 baseline 계약).
      - name: "Verify no new tint-background × family-color-text usage (story #2420 AC7 regression guard)"
        run: pnpm --filter web verify:no-new-tint-color-text

      # story #2590 (A) 정적 프리필터: 자매 가드 verify:no-new-tint-color-text는 «한 리터럴 안»의
      # bg-X+text-X만 본다. 이 가드는 AST로 «조상 요소가 pale-tint 배경, 자식 요소가 계열색 글자»인
      # 교차-요소 조합을 잡는다(#2960 hitl-card·#2940 cluster류). baseline(develop 기준 시드) 밖의
      # 새 자리만 실패. 정적이라 못 재는 자리(조건부 조상·컴포넌트 경계·불투명 재설정)는 (B) axe가
      # 실 픽셀로 최종 판정한다 — docs/contrast-guard.md AC4 참조.
      - name: "Verify no new cross-element tint × family-color-text (story #2590 A regression guard)"
        run: pnpm --filter web verify:cross-element-tint-text


      # story #2371 회귀가드: `scripts/check-i18n-keys.js`(code→messages missing-key 축)를
      # 처음으로 CI에 건다 — 이전엔 CI/husky/package.json 어디에도 안 걸려 있었고 손으로
      # 돌리면 344 issues·exit 1이 나왔는데(2026-07-31 실측) 344건 전부 도구 결함(워드바운더리
      # ㉠·네임스페이스 점 미지원+matchAll 미사용 ㉡·2단 이상 중첩 미지원 ㉢, 여기 더해 훅
      # 변수명 t 하드코딩 ㉣·주석 안 예시코드 오인 ㉤ 둘을 새로 찾아 고쳤다)이라 걸어도 상시
      # 빨간불이었다. 위 결함을 전부 고친 뒤 재측정한 missing 축은 0건(자가 재현) — 이제
      # 걸어도 실사용 회귀만 잡는다. messages→코드 dead-key 축(AC3)은 이 스텝을 실패시키지
      # 않는다(스크립트 자체가 non-zero exit을 missing 축에만 건다) — 후보 목록일 뿐 삭제
      # 판단은 사람이 소비처를 하나씩 봐야 하는 별건(AC6)이라 CI 게이트로 강제하지 않는다.
      - name: "Verify i18n translation keys (story #2371 regression guard)"
        run: pnpm verify:i18n-keys

      # story #2376 회귀가드: 사이드바(app-sidebar.tsx)·⌘K 팔레트(command-palette.tsx)·모바일
      # 더보기(more/page.tsx) 등이 조합(resourceLink/resourceHref)·리터럴(href=/href:) 어느
      # 축으로 걸든, [ws]/[proj]/<resource> 라우트 실존과 어긋나면(양방향) 실패한다 — #2373
      # 승격 당시 flow 진입점은 들어왔는데 라우트가 빠졌고(404), board는 반대로 라우트만
      # 남고 진입점이 0이었던(도달 불가, 더 조용한 쪽) 재발 방지. 첫 스캔이 잡은 기존 채무
      # 2건(mockups 도달 불가·memos 죽은 알림 링크)은 GRANDFATHER_BASELINE으로 얼려 신규만 막는다.
      - name: "Verify no orphan resource routes (story #2376 regression guard)"
        run: pnpm --filter web verify:no-orphan-resource-routes
      # story #2393 회귀가드: route-resolve.ts의 RESERVED_FIRST_SEGMENTS(런타임 미들웨어가
      # 워크스페이스 slug 후보 여부를 직접 판정하는 값)가 실제 app/ 구조와 어긋나면 실패한다.
      # 레거시 리소스명 축(MIGRATED_RESOURCES 등)은 파생이라 어긋날 수 없고, 라이브 top-level
      # 라우트+메타데이터 파일 라우트 축은 edge 런타임 위험(node:fs 미지원) 때문에 의도적으로
      # 손 스냅샷으로 남겨 이 가드가 대신 지킨다 — 첫 실측(2026-08-01)에서 이미 6곳(gates·
      # more·apple-icon.png·manifest.webmanifest·flow·goals) 어긋나 있던 것을 이 스토리가 고쳤다.
      - name: "Verify RESERVED_FIRST_SEGMENTS sync (story #2393 regression guard)"
        run: pnpm --filter web verify:reserved-first-segments-sync

      - name: Test
        # set -o pipefail so vitest's non-zero exit propagates through `| tail` instead
        # of being masked by tail's 0 — without it the unit-test gate was a no-op
        # (story 2d5c8662). GitHub's default bash runner does not enable pipefail.
        run: |
          set -o pipefail
          pnpm vitest run 2>&1 | tail -80

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          LICENSE_CONSENT: agreed

      # story d3dd358b 회귀가드: shared 패키지 stale dist 소비로 zod 스키마 신규 필드가
      # silent strip되는 클래스(2026-06-10 발견, transpilePackages #1373으로 해소 확인)의
      # 재발을 clean-checkout 빌드 산출물(.next/standalone) 검사로 자동 차단.
      - name: Verify build schema integrity (story d3dd358b regression guard)
        run: pnpm --filter web verify:build-schema-integrity

  contrast-guard-e2e:
    name: "Contrast guard (axe runtime · story #2590 B)"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # story #2590 (B): (A) 정적 프리필터(ci 잡)가 원리적으로 못 재는 교차-요소·교차-계열·알파·
    # 상태(hover) 대비를 실제 렌더된 픽셀에서 axe-core color-contrast로 전수한다(최종 authority).
    # 인증 로그인(owner@sprintable.dev)이 필요해 backend-test처럼 pgvector postgres + alembic을
    # 세우고, 그 위에 FastAPI(uvicorn)와 Next(dev)를 띄운 뒤 chromium을 돌린다. docs/contrast-guard.md 참조.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sprintable
          POSTGRES_PASSWORD: sprintable
          POSTGRES_DB: sprintable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://sprintable:sprintable@localhost:5432/sprintable_test
      DATABASE_URL: postgresql+asyncpg://sprintable:sprintable@localhost:5432/sprintable_test
      # FastAPI(security._get_secret)와 Next proxy(getJwtSecretBytes)가 «같은» JWT_SECRET을 봐야
      # 로그인 쿠키(sp_at) 검증이 통과한다 — 다르면 login 200 뒤 /inbox 이동에서 실패한다.
      JWT_SECRET: ci-e2e-contrast-guard-secret-at-least-32-chars
      # CI(비-Cloud-Run·비-pytest)에서 앱이 배포환경으로 오인돼 secret 부재로 fail-closed 되는 것을
      # 막는다(backend/.env.example is_really_local 게이트).
      SPRINTABLE_LOCAL_DEV: '1'
      NEXT_PUBLIC_FASTAPI_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3108
      APP_BASE_URL: http://localhost:3108
      PORT: '3108'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: alembic upgrade heads (baseline schema)
        working-directory: backend
        run: uv run alembic upgrade heads

      # e2e 로그인 계정(owner@sprintable.dev/password123)은 리포 어디에서도 시드되지 않고,
      # register API는 password 정책(대/소/숫자/특수 중 ≥3종)상 이 비밀번호를 거부한다. 그래서
      # CI가 앱 자체 해셔(argon2)로 users 행을 직접 넣는다(login 핸들러는 정책을 안 걸고 해시만 검증).
      - name: Seed e2e owner user
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app.core.database import async_session_factory
          from app.core.security import hash_password
          from app.models.user import User

          async def main() -> None:
              async with async_session_factory() as session:
                  existing = await session.scalar(
                      select(User).where(User.email == "owner@sprintable.dev")
                  )
                  if existing:
                      print("e2e owner already present")
                      return
                  session.add(User(
                      email="owner@sprintable.dev",
                      hashed_password=hash_password("password123"),
                      is_active=True,
                      email_verified=True,
                  ))
                  await session.commit()
                  print("e2e owner created")

          asyncio.run(main())
          PY

      - name: Start FastAPI backend
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v2/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to become healthy"; cat /tmp/backend.log; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # playwright.config webServer가 `pnpm dev`로 Next(:3108)를 띄우고 e2e/global-setup이
      # owner 로그인 → playwright/.auth/owner.json storageState를 만든 뒤 contrast-guard.spec을 돈다.
      - name: Run contrast-guard e2e (axe color-contrast)
        run: pnpm --filter web e2e:contrast

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
