      # tests/ 전역에 이미 253곳 — 대부분 read-route 무관이라 당장 안 고친다. 새로 늘리는
      # 것만 막는다. 카디르 QA 3차 재발: 이 게이트가 없으면 다음 슬라이스(Phase B 등)에서
      # 네 번째로 같은 클래스가 샌다).
