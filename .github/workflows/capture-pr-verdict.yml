name: Capture PR verdict

# story #3963(적어둠 — verdict 원장 배선, PO 확定 2026-09-16 16:08Z) — PR 코멘트 3형(codex QA
# verdict·PO review/리뷰·"읽기 검수 관찰" 비-verdict 배제)을 파싱해 dev BE
# POST /api/v2/internal/verdict/capture-review로 캡처한다. 3959의 「오늘 결과 · 열린 결함」이
# 읽는 그 원장(verdict 테이블) — 이 워크플로가 그 유일한 실 채움 통로다.
#
# 실패 관용(AC2): capture 호출 실패는 이 job을 RED로 만들지 않는다(warning만) — verdict
# 캡처는 부가 신호고, PR 자체의 머지 가능 여부와는 무관해야 한다(story_status_events.py류
# best-effort 격리 원칙과 동일 축).

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  capture:
    name: Parse comment and capture verdict
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend/scripts/parse_pr_verdict_comment.py
          sparse-checkout-cone-mode: false

      - name: Parse verdict from comment
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_TITLE: ${{ github.event.issue.title }}
          PR_BODY: ${{ github.event.issue.body }}
        run: |
          set -e
          result="$(printf '%s' "$COMMENT_BODY" | python3 backend/scripts/parse_pr_verdict_comment.py "$PR_TITLE" "$PR_BODY")"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ -n "$result" ]; then
            echo "파싱됨: $result"
          else
            echo "판정 아님(또는 [SID] 없음) — skip"
          fi

      - name: Capture verdict (story resolved server-side by org_id+story_number)
        if: steps.parse.outputs.result != ''
        env:
          RESULT: ${{ steps.parse.outputs.result }}
          # story #3963 그라운딩 — dev BE 원점은 비밀 아님(sprintable_mcp/server.py에도 노출).
          BE_URL: https://sprintable-backend-dev-787818285179.asia-northeast3.run.app
          ORG_ID: 54bac162-5c0d-49fa-8e49-85977063a091
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # story #3963 PO 확定(2026-09-16) — role별 캡처 주체 member_id(고정 팀 구성원,
          # moonklabs/sprintable org 실측). role="design"은 이 워크플로 스코프 밖(PR 코멘트
          # 3형에 design 없음, verdict_capture.py 기존 role 어휘 그대로 둠).
          QA_MEMBER_ID: 685f3f72-c85c-4a32-898f-3d3320ba39ad
          PO_MEMBER_ID: 05f52181-ea2a-42be-b9a8-9a418b72feb1
        run: |
          set -e
          role="$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["role"])')"
          result_value="$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"])')"
          story_number="$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["story_number"])')"

          if [ "$role" = "qa" ]; then
            member_id="$QA_MEMBER_ID"
          else
            member_id="$PO_MEMBER_ID"
          fi

          echo "role=$role result=$result_value story_number=$story_number member_id=$member_id"

          body="$(ORG_ID="$ORG_ID" STORY_NUMBER="$story_number" ROLE="$role" MEMBER_ID="$member_id" RESULT_VALUE="$result_value" python3 -c 'import json, os; print(json.dumps({"org_id": os.environ["ORG_ID"], "story_number": int(os.environ["STORY_NUMBER"]), "role": os.environ["ROLE"], "member_id": os.environ["MEMBER_ID"], "result": os.environ["RESULT_VALUE"]}))')"

          # story #3963 AC2 — capture 호출 실패는 job을 RED로 만들지 않는다(warning만) +
          # 재시도 1(일시적 dev BE 콜드스타트/네트워크 대비, 5초 간격).
          attempt=1
          http_code="000"
          while [ "$attempt" -le 2 ]; do
            http_code="$(curl -sS -o /tmp/capture-review-response.json -w '%{http_code}' \
              -X POST "${BE_URL}/api/v2/internal/verdict/capture-review" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -d "$body" || echo "000")"
            echo "attempt=$attempt capture-review http_code=$http_code"
            cat /tmp/capture-review-response.json 2>/dev/null || true
            if [ "$http_code" = "200" ]; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

          if [ "$http_code" != "200" ]; then
            echo "::warning::capture-review 호출 실패(2회 시도, 마지막 http_code=$http_code, story_number=$story_number) — job은 GREEN 유지"
          fi
