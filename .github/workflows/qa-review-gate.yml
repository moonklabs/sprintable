name: QA Review Gate

# story #2364: QA 없이 머지되는 것을 막는다 — qa:pass 라벨 게이트.
# 배경: 2026-07-31, PO가 PR 일곱(#2719·#2721·#2722·#2724·#2726·#2727·#2720)을 QA 없이
# 눌렀다. 까심 사후검수: 여섯 APPROVE·하나(#2721) CRITICAL(authz 다섯 → #2363). CI는
# "코드가 도는가"만 잰다 — authz 다섯 건은 테스트가 전부 초록이었다(그 테스트 자신이
# "자기 프로젝트만" 쟀기 때문). "남의 프로젝트로 재는 사람"이 없었던 자리가 QA다.
#
# story #2361(design-review-gate.yml)과 같은 틀. 다른 점 하나(AC2): ⛔경로 필터가 없다 —
# QA는 시각·문구뿐 아니라 «모든 PR»에 걸린다. 이번 판에서는 문서/CI 전용 PR도 예외로
# 빼지 않는다(예외를 열면 그 예외가 자란다 — 필요해지면 그때 수를 세고 정한다).
#
# ⛔⭐⭐AC3 — 트리거를 on.pull_request.paths로 거르지 않는다(design-review-gate.yml AC8과
# 같은 이유): required check에서 미실행이 스킵=통과로 세어지는 위험. 이 워크플로는 애초에
# 경로 필터가 없으니 job은 항상 돌고, qa:pass 존재/신선도 판정만 아래 스텝에서 한다.
#
# ⭐AC4 — 라벨 신선도를 «처음부터» 건다(design-review-gate.yml #2731이 만든 판정을 그대로
# 재사용 — 파일은 안 나누고 로직만 같은 패턴으로 복제했다. 근거: 2026-07-31 하루에 "승인
# 뒤 코드가 바뀐" 실물이 셋 — #2725 라벨 뒤 develop 재당김·#2718 라벨 뒤 파일집합 변경·
# 까심 QA APPROVE가 옛 SHA).
#
# 이 가드가 «못 잡는 것» — 셋(AC7). 선언 안 하면 다음 사람이 "이게 다 막는다"로 읽는다.
#   ①라벨이 «옳게» 붙었는지는 못 본다 — 존재만 본다.
#   ②계정이 하나라 "누가" 붙였는지로도 못 가른다.
#   ③⭐⭐PO가 --admin으로 우회할 수 있는가 — required check도 admin merge는 못 막을 수
#     있다. 실측(2026-07-31, gh api branches/{develop,main}/protection, repo rulesets 0건):
#       develop: enforce_admins=true  → 지금은 admin도 required check을 못 건너뛴다
#       main:    enforce_admins=false → admin은 지금도 required check을 건너뛸 수 있다
#     (스토리 AC의 최초 문구는 "이 리포는 enforce_admins=false"였다 — 브랜치마다 갈리는
#     것이 실측 결과라 블랑켓으로 안 쓴다. develop이 오늘 사고 PR들의 실제 merge base였다.)
#     ⛔이 갭을 없애려면(main도 develop처럼) enforce_admins를 켜야 하는데 그건 이 스토리가
#     안 짓는다 — "없앤다"가 아니라 "안 짓는다"다. 관리자가 스스로를 묶는 설정이라 그 판단은
#     이 가드 밖(선생님/저장소 관리자 자리)이라고 본다.
#
# ⭐왜 required PR review가 아니라 라벨 게이트인가 — develop은 required_pull_request_reviews
# 자체가 «없다»(오늘 사고의 구조적 이유 중 하나: reviews:0으로도 다 머지됐다). 그런데 이
# 조직 계정이 하나뿐이라, required reviews를 그냥 켜면 "자기 PR은 자기가 approve 못 한다"는
# GitHub 규칙에 걸려 «아무것도» 머지가 안 된다(유나 실측). 그래서 승인의 증거를 "review
# 객체"가 아니라 "라벨"로 대신 나른다 — 라벨은 같은 계정이라도 리뷰어 역할(유나=design·
# 까심=QA)이 붙였다는 사실 자체는 남기고, self-approve 제약에 걸리지 않는다.
#
# ⛔사람을 인질로 잡지 않는다 — 이 가드는 CI 자리다. 런타임·요청경로에는 아무것도 붙지
# 않는다. qa:pass/qa:changes 라벨은 이 스토리 착수 시점에 없어서 새로 만들었다
# (design:pass/design:changes와 같은 색·문구 관례로: pass=#0E8A16·changes=#D93F0B).
#
# ⭐AC8(유나신 지적, 뒤늦게 추가) — 라벨 «설명» 자신이 「무엇을 말하지 않는가」를 적는다.
# 오늘 QA 없이 머지된 일곱 중 둘은 유나신 자신이 design:pass를 준 판이었는데, 리뷰 본문엔
# "디자인 축만 통과"라 적어 놓고도 라벨 설명 자체엔 그 경계가 없었다 — 머지 누르는 사람은
# 리뷰 본문이 아니라 라벨만 본다(라벨이 리뷰 본문보다 «멀리» 간다). 그래서 GitHub label
# 자체의 description을 고쳤다: qa:pass = "QA 축(사람이 쓰는 경로)만 확認 — 디자인·성능·
# 라이브 픽셀은 이 라벨이 말하지 않는다." 이 워크플로의 성공 메시지에도 같은 경계를 반복한다.
#
# ⭐AC9(유나신 지적) — design:pass·qa:pass 둘 다 초록이어도 "다 됐다"가 아니다. 둘을 합쳐도
# 안 덮는 것: 라이브 픽셀(실제 렌더 회귀)·성능·접근성. 이 워크플로가 두 게이트 중 나중에
# 도는 자리(머지 직전에 읽히는 자리)라 아래 freshness 스텝의 마지막 성공 로그에 이 문장을
# 박아 둔다 — 안 적으면 "게이트 둘 다 초록"이 또 다른 거짓 안심(오늘 CI 초록이 그랬던 것과
# 같은 모양)을 판다.
#
# ✅등록됨(2026-07-31, 오르테가군) — develop의 Branch protection required status checks에
# 이 job 이름("QA review gate")이 올라가 있다. 양성대조 완료(#2740, AC6): 라벨 없이 RED +
# 실제 merge 시도가 "the base branch policy prohibits the merge"로 거절됨을 확認, 라벨을
# 붙이면 각 체크가 개별로 GREEN 전환됨을 확認.
#
# ⚠️등록 «이전»에 이미 열려 있던 PR은 이 체크를 자동으로 못 받을 수 있다 — GitHub이 그
# PR에 대해선 이 체크를 아예 "기대하지 않는" 상태로 남아 required인데도 «영원한 pending»이
# 된다(실측 2026-07-31: #2737·#2294). 이것도 "안 잰 것"인데 앞서 잡은 스킵=통과 병의
# 반대편(안 재면서 빨강)이다 — base branch만 바뀌고 새 커밋이 없는 재타겟(synchronize
# 미발화)의 경우 story #2912(2899 그라운딩 갈래D) 이전엔 고치는 법이 코드가 아니라 사람 손
# (새 커밋 push로 synchronize 이벤트를 유발하거나, PR을 close 후 재오픈)뿐이었다 — 아래
# edited 추가로 이 케이스는 이제 자동 재트리거된다(#3317 실사고 재발 방지).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main, develop]

concurrency:
  group: qa-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # story #3346 — 아래 신규 스텝이 CI 워크플로 run 상태(queued/in_progress/completed)를
  # `actions/workflows/{id}/runs`로 직접 읽는다. 참고: branch protection의
  # required_status_checks(더 근본적인 SSOT)를 읽는 방법도 검토했으나 GITHUB_TOKEN에는
  # 그 권한 스코프 자체가 없다(actionlint: "administration"은 유효 permission이 아님 —
  # GitHub REST "Get branch protection"은 GITHUB_TOKEN으로 애초에 접근 불가) — 그래서
  # "이 리포의 필수 체크 넷이 전부 ci.yml 한 워크플로에서 나온다"는 실측 사실(아래 스텝
  # 주석 참고)에 기대 "CI 워크플로 자체의 run 상태"로 대체한다.
  actions: read

jobs:
  qa-review-gate:
    name: QA review gate
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # story #2973(미르코 그라운딩, 2026-08-23) — `github.event.pull_request.labels`는
      # 이 워크플로를 트리거한 그 웹훅 «페이로드 스냅샷»이다(라이브 조회가 아니다). QA·
      # Design 두 리뷰어가 근접한 시각에 각자 라벨을 달면, 먼저 도착한 labeled 이벤트의
      # job이 "그 시점 페이로드"(상대 라벨이 아직 안 실린)만 보고 HAS_*_PASS=false로
      # 잘못 실패한다(실측: #3399 08:40:39 실패 run 로그 — "형제 run 미완" 판정이 아니라
      # 이 레이스였다. #3391도 동일 뿌리 — rerun이 같은 스테일 페이로드로 재생돼 "GH가
      # rerun을 거부"로 보이는 증상까지 설명한다). 처방: 판정 자체를 이벤트 페이로드가
      # 아니라 `gh api`로 "지금 이 순간의" 라벨을 라이브 재조회해서 낸다 — 대기-폴링(그래도
      # 타임아웃 전에 실패할 여지가 남는다)이 아니라, 판정 시점의 진짜 상태를 본다.
      - name: Fetch live PR labels (avoid stale webhook-payload race — story #2973)
        id: live_labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LABELS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --paginate --slurp | jq '[.[][] | .name]')"
          echo "live labels: ${LABELS_JSON}"
          echo "has_qa_pass=$(echo "${LABELS_JSON}" | jq 'index("qa:pass") != null')" >> "$GITHUB_OUTPUT"
          echo "has_qa_changes=$(echo "${LABELS_JSON}" | jq 'index("qa:changes") != null')" >> "$GITHUB_OUTPUT"

      # ⭐design-review-gate.yml과 대칭(유나신 지적, 2026-07-31) — qa:changes가 열려 있으면
      # qa:pass 유무와 무관하게 무조건 빨강. 두 changes 라벨이 기계적으로 배타가 되어 changes
      # 라벨도 "하는 일"이 생긴다(전엔 설명뿐이었다).
      - name: Enforce qa:changes blocks merge (unconditional — regardless of qa:pass)
        env:
          HAS_QA_CHANGES: ${{ steps.live_labels.outputs.has_qa_changes }}
        run: |
          set -euo pipefail
          if [ "${HAS_QA_CHANGES}" = "true" ]; then
            echo "::error title=qa:changes open::QA requested changes (qa:changes) and they haven't been marked resolved yet. This blocks merge regardless of whether qa:pass is also present — remove qa:changes (or let QA replace it with qa:pass) after the changes are addressed."
            exit 1
          fi
          echo "qa:changes not present."

      # AC1: qa:pass가 없으면 빨강. labeled/unlabeled 이벤트가 트리거 목록에 있어 라벨을
      # 떼면 이 스텝이 다시 돌아 빨강으로 되돌아간다. ⛔경로 필터 없음 — 모든 PR에 적용(AC2).
      - name: Enforce qa:pass label (no path scoping — applies to every PR)
        env:
          HAS_QA_PASS: ${{ steps.live_labels.outputs.has_qa_pass }}
        run: |
          set -euo pipefail
          if [ "${HAS_QA_PASS}" = "true" ]; then
            echo "qa:pass present — QA axis (the paths a real user takes) reviewed. (AC8: this label speaks only to the QA axis — design, performance, and live-pixel rendering are not what it says.)"
          else
            echo "::error title=qa:pass missing::This PR has no qa:pass label. QA review is required before merge — CI green only proves the code runs, not that the paths a real user takes are correct (2026-07-31: authz gaps passed CI because the tests only checked same-project access; nobody checked cross-project)."
            exit 1
          fi

      # AC4: qa:pass가 «있어도» 최신 커밋보다 먼저 붙었으면 stale이다(design-review-gate.yml
      # #2731과 동일 로직 — 로직만 복제, 라벨 이름만 다르다). fail-closed: timeline 이벤트를
      # 못 찾거나 gh api 자체가 실패해도 이 스텝은 그대로 실패(빨강)한다.
      - name: Enforce qa:pass label freshness (not stale vs latest commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LAST_COMMIT_TS="$(git log -1 --format=%cI "${HEAD_SHA}")"
          LABEL_TS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events" --paginate \
            --jq '[.[] | select(.event=="labeled" and .label.name=="qa:pass") | .created_at] | sort | last // empty')"
          echo "latest commit (${HEAD_SHA}): ${LAST_COMMIT_TS}"
          echo "qa:pass last attached: ${LABEL_TS:-<none found>}"
          if [ -z "${LABEL_TS}" ]; then
            echo "::error title=qa:pass timeline unreadable::qa:pass label is present but no matching 'labeled' timeline event was found for it — freshness can't be verified. Failing closed (treated as stale)."
            exit 1
          fi
          LAST_COMMIT_EPOCH="$(date -d "${LAST_COMMIT_TS}" +%s)"
          LABEL_EPOCH="$(date -d "${LABEL_TS}" +%s)"
          if [ "${LABEL_EPOCH}" -lt "${LAST_COMMIT_EPOCH}" ]; then
            echo "::error title=qa:pass is stale::qa:pass was attached at ${LABEL_TS}, before the latest commit (${LAST_COMMIT_TS}). Code has moved since QA reviewed — re-review and re-attach qa:pass."
            exit 1
          fi
          echo "qa:pass attached at ${LABEL_TS} — at or after the latest commit (${LAST_COMMIT_TS}). Fresh."
          echo "(AC9: design:pass + qa:pass both green is not 'everything is done' — live-pixel rendering, performance, and accessibility are covered by neither gate.)"

      # story #2676 AC1 — 위 freshness 스텝(라벨 "시각")은 PR#3088 실사고를 못 잡았다: 실측
      # 결과 qa:pass 라벨이 2026-08-15T21:54:13Z에 붙었는데, 그 «전»인 21:53:02Z에 이미 새
      # 커밋(773aeeb4)이 푸시돼 있었다 — 시각 순서만 보면 "라벨이 커밋보다 늦다=fresh"로
      # 읽히지만, 그 라벨을 붙이게 한 리뷰 코멘트 자체는 "**Head:** `5491687c8...`"(그 «이전»
      # 커밋)를 명시하고 있었다. 시각은 순서가 맞아도 리뷰 «내용»은 옛 커밋을 본 것 — 레이스
      # (리뷰 완료 시각과 라벨 API 호출 시각 사이의 지연)가 시각 비교로는 원리적으로 못 잡힌다.
      #
      # QA 리뷰어는 매 판정마다 "**Head:** `<sha>`"를 코멘트에 명시하는 규율이 이미 있다(실측:
      # PR#3088·#3089 전 코멘트 확認 — 예외 없음). 그 명시된 head를 파싱해 현재 PR head와
      # «직접» 대조한다 — 시각이 아니라 "무엇을 봤다고 썼는가"를 잰다. 레이스 자체가 안 생긴다.
      #
      # ⛔이 스텝이 못 잡는 것 — QA verdict 코멘트가 "**Head:** \`sha\`" 포맷을 안 지키면(예:
      # 코멘트 형식을 사람이 바꾸면) fail-closed(모르면 통과가 아니라 실패)로 막긴 하지만,
      # «다른 포맷을 다른 포맷으로 오인식»해 틀린 head를 뽑을 가능성까지는 없앨 수 없다.
      #
      # story #2912(2899 그라운딩 갈래C) — design-review-gate.yml이 이 로직을 그대로
      # 복붙해 갖고 있었다(story #2676·#2827 fix가 양쪽에 각각 적용된 이력이 그 증거) —
      # 공유 컴포지트 액션(.github/actions/verdict-head-check)으로 수렴. 정규식은 이
      # 게이트의 기존 엄격 패턴 그대로 전달(디자인 쪽과 다른 이유는 그 액션 자체의 주석
      # 참고 — 통일 대상 아님, 리뷰어별 실제 코멘트 관행 차이를 반영한 의도적 차이).
      - name: Enforce qa:pass verdict comment's stated head matches current PR head
        uses: ./.github/actions/verdict-head-check
        with:
          label-name: qa:pass
          header-regex: '^## QA verdict: approved \(qa:pass\)'
          head-extract-regex: '\*\*Head:\*\*[^0-9a-f]*[0-9a-f]{7,40}'
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # story #2676 AC2 — PR#3088 실사고 ③: 최초 qa:pass 승인이 Backend pytest가 아직
      # in_progress이던 도중(job 95074664724, 21:49~21:59) 21:54에 나갔다 — 리뷰 코멘트가
      # "CI green"이라 썼지만 그 시점 실제로는 «아직 안 나온 결과»였다(까디르 자기 정정).
      # branch protection의 "어느 체크가 required인가"를 읽으려면 더 넓은 권한이 필요해
      # 신뢰성이 낮다 — 대신 이 리포 CI의 실제 명명 관례를 그대로 쓴다: 잡 이름이 "— advisory"로
      # 끝나면 명시로 비차단(관찰 확認, PR#3090 체크 목록 실측)이니 그것만 빼고 나머지 전부를
      # "이 게이트가 신경 쓰는 대상"으로 본다 — 보수적(advisory 아닌 느린 잡 때문에도 막힐 수
      # 있음)이지만 "몰라서 초록"보다 안전.
      #
      # ⛔PO 리뷰 블로커(2026-08-16, PR#3092 첫 판) — 자기 이름("QA review gate")만 빼면
      # "Design review gate"는 여전히 비-advisory로 잡혀, 두 라벨이 다 걸린 PR에서 두 게이트가
      # 동시에 재실행되면(오늘 3086/3088류 실물 — 한 PR에 qa:pass+design:pass 둘 다 필요하면
      # 흔한 정상 상황) 서로가 서로를 "아직 안 끝남"으로 보고 상호 RED로 고착된다(둘 다 완료된
      # 뒤에도 자동 재트리거가 없어 새 pull_request 이벤트 전까지 안 풀린다). 상대 게이트 이름도
      # 같이 뺀다 — 순환 대기를 구조적으로 없앤다(광범위 제외라 "advisory 아닌 다른 게이트류"가
      # 미래에 더 생기면 그때 또 추가해야 하는 갭은 남는다, 지금은 이 리포에 게이트가 이 둘뿐).
      #
      # ⛔story #2827(2026-08-20, 페드루 PO 판정·라이브 실사고 실측) — "sprintable/gate"(story
      # #2813, Gate→GitHub required check)도 같은 범주다: 이 check는 사람이 gate를 승인해야
      # success로 넘어가는데, 그 승인이 "QA/Design 리뷰가 이미 끝났다"를 전제로 하는 **뒤 순서**
      # 액션이다 — QA review gate가 sprintable/gate의 완결을 기다리면 승인이 안 나온 채로는 QA
      # gate가 영원히 안 풀리고, QA gate가 안 풀리면(비-advisory 미완료 판정에 걸려) gate의
      # ci_result가 fail이 돼 승인 자체가 막힌다(결정론적 순환, rerun으로 안 풀림 — dev
      # moonklabs/sprintable#3249 실측으로 확定). 위 QA/Design 상호제외와 동일한 근본 원인(둘 다
      # "review-gate류"가 자기보다 늦게 끝나는 다른 review-gate류를 기다리는 카테고리 착오)이라
      # 같은 처방을 적용 — sprintable/gate도 제외 목록에 추가한다.
      - name: Enforce no incomplete non-advisory checks when qa:pass is claimed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          INCOMPLETE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --paginate \
            --jq '.check_runs[] | select(.name != "QA review gate" and .name != "Design review gate" and .name != "sprintable/gate") | select(.name | endswith("— advisory") | not) | select(.status != "completed") | .name' \
            | sort -u)"
          if [ -n "${INCOMPLETE}" ]; then
            echo "::error title=required-ish checks still incomplete::qa:pass가 붙어 있지만 아직 안 끝난(비-advisory) 체크가 있다 — 「CI green」은 이것들이 전부 completed일 때만 참이다:"
            echo "${INCOMPLETE}"
            exit 1
          fi
          echo "no incomplete non-advisory checks for ${HEAD_SHA}."

      # story #3346(2026-09-02 실사고, PR#3725 head a9c9322eb) — 위 스텝은 "존재하는
      # check-runs 목록"만 본다. force-push 직후 concurrency로 큐 대기(pending) 중이던
      # CI는 잡이 아직 «시작도 안 해» Backend pytest·Lint·Alembic·Support Gateway
      # 체크런이 하나도 없었다 — "미완인 체크런"이 아니라 "체크런 자체가 없는" 경우라
      # 위 스텝의 필터를 그냥 통과해(0건 매치) «미완 0건»으로 오판했다. 체크런은 그
      # 워크플로의 잡이 실제로 시작돼야 생긴다 — «존재 자체가 없다»는 신호는 check-runs
      # API로는 원리적으로 못 잡는다(없는 것과 통과한 것을 구별 못 함).
      #
      # story #3400 — 이 판정을 design-review-gate.yml도 그대로 필요로 해(동일 구조의
      # 취약 스텝을 갖고 있었다) 공유 컴포지트 액션(verdict-head-check와 같은 자리)으로
      # 추출했다. 판정 로직·근거는 .github/actions/ci-run-completion-check/action.yml
      # 참고.
      - name: Enforce the CI workflow run itself is completed+success at head (not just its check-runs)
        uses: ./.github/actions/ci-run-completion-check
        with:
          label-name: qa:pass
          gh-token: ${{ secrets.GITHUB_TOKEN }}
