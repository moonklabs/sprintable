            # 자신의 dual_publish=false·consume=true 조합을 보고 **backplane을 pg로 강제
            # 복귀**시킨다 — PG_LISTEN_ENABLED=false 로 배선해도 `resolve_backplane()`이
            # 자체 판단으로 pg_listen을 도로 켠다는 뜻이라, "듣는 프로세스가 0개"는 사실이
            # 아니었다(라이브 실측 2026-08-28: backend-dev pg_listen connected, 인스턴스 3개
            # 전부). 그 안전판 덕에 backend-dev **자기 자신**(에이전트 SSE, #2123이 확認한 대로
            # 여전히 backend-dev가 서빙)은 무사했지만, dual_publish=false인 한 backend-dev는
            # Redis 채널에 아무것도 발행하지 않는다 — sprintable-realtime-dev(브라우저가 실제로
            # 붙는 REALTIME_URL 대상, consume=true·dispatch=true로 이미 정상 대기 중)는 구독할
            # 채널이 통째로 빈 채였다. 즉 API 쓰기(backend-dev)에서 발생한 라이브 이벤트가
            # 브라우저(realtime-dev)에 **원천적으로 0% 도달** — attention.changed는 물론
            # presence·conversation.working 등 B계열 전부, A계열도 즉시성 상실(다음 재접속
            # DB backfill에만 의존).
            #
            # 라이브 재현(디캄포 은두카쿠 agent 키, 2026-08-28): 직결(backend-dev 직접
            # EventSource)은 attention.changed <1초 즉시 도착·게이트웨이(dev-realtime.
            # sprintable.ai, 재접속 없이 안정 유지된 연결)는 동일 트리거로 영구 0건 — 재접속
            # 주기(BFF 55s cap) 가설은 이걸로 기각(연결이 안 끊겨도 원천 미도달이므로 원인이
            # 아님). #2157의 ②"PG_LISTEN 재활성 0회"는 관측 자체는 맞았다(env var 값은 그대로
            # false) — 다만 "재활성 없음"과 "실제로 안 도는가"는 다른 질문이었다(resolve_
            # backplane의 자체-복구 로직을 못 잡은 관측).
            #
            # ⚠️[SID 3037] wake_agent() pg_notify-only 크로스인스턴스 폴백의 __wake__ 마커 유실
            # 결함과의 상호작용 확認 — 이 결함은 FANOUT_WAKE_REDIS_ENABLED=false일 때만 발동하는
            # dormant 코드고, 이 커밋은 그 플래그를 안 건드린다(dev/prod 둘 다 계속 true) — 재점화
            # 없음. dual_publish 원복 자체가 FANOUT_WAKE_REDIS_ENABLED 경로 선택에 영향을 주지
            # 않는다(별개 스위치).
            #
            # prod(위 main 분기)는 dual_publish=true 유지 상태라 이 결함 자체가 없었다(#2141
            # S-a 이후 계속 true) — 이번 되돌림은 dev만 대상.
            echo "backend_redis_dual_publish_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2123 S0-b(2026-07-23, 오르테가군 판정): wake_agent()의 크로스인스턴스
            # 배달이 #2122 머지 이후에도 무효였던 이유 — 이 발행측 스위치(agent_gateway.py:224
            # 게이팅)가 꺼져 있어 event_broker를 계속 우회했다(직접 pg_notify만, Redis 미발행).
            # wake_agent 호출부는 전부 REST 라우터라 api(backend-dev)에서만 의미 있음 —
            # realtime-dev는 REST를 안 받아 배선 불필요(#2123 doc §판정 종결 근거).
            echo "backend_fanout_wake_redis_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2078(E-ARCH 0단계, 오르테가군 GO 2026-07-21): dev만 켠다 — 게이트(devtools
            # 탭당 EventSource 1개·정상 채널 이벤트 도착·롤백 왕복) 실측 통과가 prod 승격의
            # 전제. 3개 소비 훅(use-sse-notifications·use-chat-sse·use-team-presence)이 이
            # 값 하나로 공유 커넥션 vs 독립 커넥션을 가른다(realtime-provider.tsx).
            echo "sse_multiplex_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2728 후속(2026-08-17, 페드루 PO 지시) — 선생님 기결정 "결제는 dev에서 구현·
            # 검증" 집행 전제조건. NEXT_PUBLIC_EE_ENABLED가 여태 이 파이프라인 어디에도 배선된
            # 적이 없어(cloudbuild.yaml build-arg·Dockerfile ARG 전부 무배선, grep 확認) dev FE
            # billing 표면(settings/page.tsx의 isEEEnabled() 게이트)이 아예 렌더 안 됐다 — dev만
            # 켠다(prod는 위 main 분기에서 명시 false, 무접촉).
            echo "ee_enabled=true" >> "$GITHUB_OUTPUT"
            # story #3260(2026-08-31, 페드루 PO 조건부 승인) — 위젯 셸(approval-request-card
            # 급 결재 UI가 아니라 지원v1 문의 위젯)이 항상 unavailable 상태만 반환하는 동안은
            # dev에서만 켜서 검증한다(prod는 위 main 분기에서 명시 false).
            echo "support_widget_enabled=true" >> "$GITHUB_OUTPUT"
            # story #3263 — dev에서 위젯과 함께 실 표면(지원 채팅)을 가리키도록 켠다.
            echo "support_contact_surface_widget=true" >> "$GITHUB_OUTPUT"
            # story #3260 Phase 2(2026-08-31) — 위젯이 Support Gateway를 브라우저에서 직접
            # 호출하는 데 필요한 CORS allowlist+base URL. origin 목록은 infra/gcs-attachments-
            # cors.json(story #3242, 같은 dev FE origin 집합 — 이 값들이 이미 검증된 dev FE
            # 표면 SSOT)과 동일 값 재사용(새 값 지어내지 않음) — `|`-구분(cloudbuild.yaml
            # deploy-support-gateway 스텝에서 `,`로 변환, MCP_ALLOWED_HOSTS와 동형). Gateway
            # URL은 실측(`gcloud run services describe support-gateway-dev --region=
            # asia-northeast3 --format='value(status.url)'`, 2026-08-31).
            echo "support_gateway_cors_origins=https://dev-app.sprintable.ai|https://sprintable-frontend-dev-57iommnikq-du.a.run.app|https://sprintable-frontend-dev-787818285179.asia-northeast3.run.app|http://localhost:3108" >> "$GITHUB_OUTPUT"
            echo "next_public_support_gateway_url=https://support-gateway-dev-57iommnikq-du.a.run.app" >> "$GITHUB_OUTPUT"
            # story #f2a27d2a(지원v1·1경계, 2026-08-31 페드루 PO — Gateway flip PR) — dev 전용
            # 자원 프로비저닝 완료(SA·전용 DB·Secret Manager 2종, 사부님 보고 済) — dev만 켠다.
            echo "support_gateway_deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "support_gateway_service_account=support-gateway-dev@sprintable-494803.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
            # story #3263 AC4(2026-09-01, 페드루 PO 지시) — 에스컬레이션 게이트/DM
            # requester("Sprintable 지원" 에이전트 멤버)·approver(PO) team_members.id, dev
            # 배선 실 값(PO가 POST /api/v2/team-members로 이미 프로비저닝). 미설정이면
            # backend가 정직하게 배달 skip이라(503) 여태 AC1/AC2가 dev에서도 조용히 no-op
            # 이었다 — 이 커밋으로 실제 배달 경로가 dev에서 처음 켜진다.
            echo "support_escalation_requester_member_id=80e0cdd2-1913-4972-a603-fc0bb0a9bc85" >> "$GITHUB_OUTPUT"
            echo "support_escalation_approver_member_id=05f52181-ea2a-42be-b9a8-9a418b72feb1" >> "$GITHUB_OUTPUT"
            # story #e6500272 후속(2026-08-18, 페드루 PO 지시) — LICENSE_CONSENT(backend
            # `settings.is_ee_enabled` 게이트)도 EE_ENABLED와 동형 미배선이었다. dev 현재값도
            # 'agreed'(수동 env) — 여기서도 값 변경 0, 현행값만 durable화(prod 위 main 분기와
            # 같은 값 — dev/prod가 실제로 다른 다른 플래그들과 달리 이건 원래 같아야 하는 값).
            echo "license_consent=agreed" >> "$GITHUB_OUTPUT"
            # story #2758(2026-08-18, 페드루 PO 지시 — EE_ENABLED·LICENSE_CONSENT와 동형
            # 「등재≠배선」 3번째, 미르코 2754 라이브 실증이 이 마디에서 잡음) — Toss 결제위젯
            # clientKey(publishable 값, secret 아님 — 브라우저 노출 전제)를 Secret Manager
            # TOSS_PAYMENTS_CLIENT_KEY_DEV에서 읽어 dev만 주입(prod는 위 main 분기에서 빈
            # 문자열 명시·무접촉). Secret Manager 접근 권한은 이 워크플로우의 GHA SA(github-
            # actions@sprintable-494803)가 project-level roles/secretmanager.secretAccessor로
            # 이미 보유(신규 IAM 변경 0). Setup Cloud SDK 스텝이 이미 프로젝트를 기본값으로
            # 잡아 둬 --project 불요.
            TOSS_CLIENT_KEY_DEV_VALUE=$(gcloud secrets versions access latest --secret="TOSS_PAYMENTS_CLIENT_KEY_DEV")
            echo "::add-mask::${TOSS_CLIENT_KEY_DEV_VALUE}"
            echo "toss_client_key=${TOSS_CLIENT_KEY_DEV_VALUE}" >> "$GITHUB_OUTPUT"
            # story #2139/#2143 후속(2026-07-23, 오르테가군 판정) — "백플레인 켜기" dev 1단계.
            # PRESENCE_ONLINE_REDIS_ENABLED: DB 폴백 있음(안 깨져 있음 — 켜면 신선도 개선).
            # PRESENCE_REDIS_ENABLED(chat_presence "working"): 프로세스-로컬 dict라 GCE
            # 멀티노드에서 노드마다 다른 실제 결함 — 미르코의 working 판정이 여기 걸림.
            # SSE_LEASE_REDIS_ENABLED: 인스턴스별 카운터라 전역 상한 미성립 실제 결함 —
            # 까심의 노드편차 판정이 여기 걸림. dev만 켠다 — GCE realtime-dev 쪽도 이번 배포와
            # 짝으로 켜야 실제로 노드 간 공유가 성립한다(scripts/deploy_realtime_gce.sh 동시 배포).
            echo "backend_presence_redis_enabled=true" >> "$GITHUB_OUTPUT"
            echo "backend_presence_online_redis_enabled=true" >> "$GITHUB_OUTPUT"
            echo "backend_sse_lease_redis_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2077(2026-07-24) — frontend min/max-instances가 배포 SSOT 어디에도 없었다.
            # 라이브 실측(2026-07-24, `gcloud run services describe sprintable-frontend-dev` —
            # 서빙 리비전 자체 대조·latestReady==latestCreated·traffic 100% 확認, template spec만
            # 본 것 아님): minScale=1·maxScale=3. cloudbuild.yaml dev-safe 기본값과 동일값이라
            # 이 output 없어도 굴러가지만, 대칭 배선을 위해 dev도 명시(backend_timeout 관례와 동형).
            echo "frontend_min_instances=1" >> "$GITHUB_OUTPUT"
            echo "frontend_max_instances=3" >> "$GITHUB_OUTPUT"
            # story #2158 후속(#2077에서 동반 배선) — 재생 버퍼(PR #2468)는 머지됐으나 켤 배선이
            # 없어 까심군이 사용자 경로 재측정을 못 하고 있었다. dev만 켠다(#2158 취지 자체가
            # "손 gcloud로 안 켠다"라 SSOT 경유 필수).
            echo "backend_sse_transient_replay_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2701(2026-08-17) — dev sprintable-mcp의 라이브 실측(gcloud describe)엔
            # MCP_ALLOWED_HOSTS 자체가 없다(prod 분기 참조) — 명시로 빈 값을 두지 않는다.
            # cloudbuild.yaml deploy-mcp가 이 값이 비어 있으면 그 env var 자체를 안 실어(조건
            # 분기), dev 서비스에 새로 빈 문자열 env가 안 생긴다(오늘 실측 그대로 무변경).
            echo "mcp_allowed_hosts=" >> "$GITHUB_OUTPUT"
            # [P1] iOS TestFlight 구글 로그인 후 404 인시던트(#3499 리뷰 delta) — prod 분기와
            # 동일 이유, dev 호스트 값만 다르다.
            echo "apple_team_id=JN798BC4KC" >> "$GITHUB_OUTPUT"
            echo "mobile_app_link_origin=https://dev-app.sprintable.ai" >> "$GITHUB_OUTPUT"
          fi

      # story #3079(2026-08-25, #3070/#3031/#2089 근본원인 공통수정) — realtime path-filter
      # (GCE #2089 · Cloud Run #3031) 둘 다 merge 이후 단 한 번도 실제로 스킵을 실행한 적이
      # 없었다: 실 root cause=Cloud Build가 `gcloud builds submit --source=.`(로컬소스 tarball
      # 업로드)로 도는데 레포에 `.gcloudignore`가 없어 gcloud 기본 규칙(.gitignore 기반 자동
      # 생성+`.git` 항상 제외)이 적용돼 Cloud Build 워크스페이스엔 `.git`이 아예 없었다 —
      # 두 필터의 `git diff`/`git fetch`가 매번 "Not a git repository"(rc=129)로 실패해 각자의
      # fail-safe("판별 불가 → 배포 진행")로 항상 떨어졌다(실 Cloud Build 로그 원문으로 확定).
      #
      # 처방: git diff 판정을 Cloud Build 안이 아니라 **여기(GHA, 실 .git 보유)**에서 계산해
      # skip/deploy 결과만 substitution으로 넘긴다 — Cloud Build 워크스페이스에 `.git`을
      # 살리려는 시도(`.gcloudignore`로 포함 허용 등)보다 안전(tarball 업로드 크기/보안 노출
      # 우려 없음). `check_realtime_relevant_diff.sh`(#2089 SSOT)는 그대로 재사용 — 로직
      # 이중선언 없음.
      #
      # ⛔fetch-depth: `actions/checkout@v4` 기본값(fetch-depth=1, shallow)이라 임의 과거
      # last_sha와의 diff가 불가능 — `git fetch --unshallow`로 전체 이력을 먼저 받는다.
      # ⛔fail-safe 방향(페드루 PO 재판단 요청, 2026-08-25): 필터가 실제로 한 번도 안 돌던
      # 예전엔 "판별 불가 → 배포 진행"이 사실상 무해했다(항상 그 경로였으므로) — 이제 필터가
      # 진짜로 돌면 **잘못된 skip 판정**(실제 관련 변경이 있는데 스킵)이 새로 생기는 위험이다.
      # 그래도 방향은 유지한다 — `check_realtime_relevant_diff.sh` 자신의 원 설계 철학
      # ("정확성을 빈도보다 우선" — 조용히 스킵보다 조용히 배포가 안전)과 동일 원칙이고,
      # 판별 불가 상황(최초 배포·트래픽 스플릿 중·describe 실패)은 여전히 드물고 명시적으로
      # 로그에 남으므로 사람이 알아챌 수 있다. REALTIME_RELEVANT_PATHS 목록의 완전성이
      # 이제부터 진짜로 중요해진다는 점만 리뷰어가 유념할 것.
      #
      # #3031(Cloud Run path-filter "로그 도장")은 이 fix에 흡수됨 — 별도 후속 불요.
      - name: Resolve realtime deploy path-filter (GHA — 실 git 보유, Cloud Build엔 없음)
        id: realtime_gate
        if: steps.env.outputs.target == 'dev'
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -uo pipefail
          AR_REGION="asia-northeast3"
          git fetch --unshallow --quiet 2>/dev/null || git fetch --quiet 2>/dev/null || true

          # story #3098(2026-08-26) — 이 갈래 자체(describe 필드·sed·정규식)는 실측상 정상이다
          # (동일 명령을 사람 계정으로 재현하면 "sprintable-realtime-gateway-dev-91ba3643-9a8753"
          # 같은 실 템플릿명에서 8자 SHA가 그대로 뽑힌다 — 이름 패턴 불일치가 원인이 아니었다).
          # 진짜 원인은 IAM: github-actions@${GCP_PROJECT}.iam.gserviceaccount.com에 부여된
          # 역할이 artifactregistry.writer/cloudbuild.builds.editor/iam.serviceAccountUser/
          # run.admin/secretmanager.secretAccessor/serviceusage.serviceUsageConsumer/
          # storage.admin뿐 — compute.* 역할이 전무하다(project IAM policy 직접 조회로 확認).
          # `compute.instanceGroupManagers.get` 권한이 없으니 이 describe는 매번 권한거부로
          # 조용히 실패(stderr는 /dev/null)하고 빈 문자열만 돌아온다 — "최초 배포/이름 패턴
          # 변경"이 아니라 "애초에 조회 권한이 없음"이 실제 사유. ⚠️IAM 부여는 인프라 lane
          # (PO 전담) — 이 코드는 안 건드림. 필요한 조치: 이 SA에 roles/compute.viewer
          # (또는 최소 compute.instanceGroupManagers.get) 부여, story #3098 참조.
          gce_skip="false"
          current_template="$(gcloud compute instance-groups managed describe sprintable-realtime-gateway-dev \
            --region="${AR_REGION}" --project="${GCP_PROJECT}" \
            --format='value(versions[0].instanceTemplate)' 2>/dev/null | sed 's#.*/##' || echo '')"
          gce_last_sha="$(echo "${current_template}" | grep -oE '[0-9a-f]{8}' | head -1 || echo '')"
          if [ -z "${gce_last_sha}" ]; then
            echo "[gce] 직전 SHA를 인스턴스 템플릿 이름에서 못 읽음(최초 배포이거나 이름 패턴 변경) — 배포 진행"
          elif bash backend/scripts/check_realtime_relevant_diff.sh "${gce_last_sha}" "${GITHUB_SHA}"; then
            echo "[gce] 관련 경로 변경 있음 — 배포 진행"
          else
            echo "[gce] ${gce_last_sha}..${GITHUB_SHA} 사이 realtime-관련 경로 변경 없음 — 스킵"
            gce_skip="true"
          fi

          # story #3098(2026-08-26, PO 실측 run 32919036744) — 이 갈래는 실측 결과 두 겹으로
          # 깨져 있었다(둘 다 이번 delta로 해소):
          # ①`--format='value(status.traffic.filter(percent=100).revisionName)'`가 gcloud
          #   포맷 트랜스폼 파서 자체를 태워 매 호출 ERROR("Transform function expected") →
          #   stderr는 /dev/null로 삼켜지고 serving_revision은 항상 빈 문자열. 실 트래픽
          #   스플릿과 무관하게 100% 확定 실패(직접 재현·gcloud 에러 메시지 확認).
          #   → json + jq로 percent==100 항목을 직접 골라낸다(gcloud 포맷 트랜스폼 문법에
          #   더는 의존하지 않음, GHA ubuntu-latest 기본 이미지에 jq 상시 포함).
          # ②①을 고쳐도 다음 겹이 바로 막는다 — Cloud Run은 `--image=...backend:${COMMIT_SHA}`
          #   로 태그를 받아 배포해도 `describe`가 돌려주는 `spec.containers[0].image`는 항상
          #   digest 고정형(`repo@sha256:...`)이다(Cloud Run 자체 동작 — 태그가 아니라
          #   불변 digest로 리비전을 고정, 실측 확認). 기존 `${last_image##*:}`는 이 digest의
          #   sha256 hex를 git SHA로 착각해 그대로 check_realtime_relevant_diff.sh에 넘겼다
          #   (git이 못 알아들어 fail-safe로만 떨어지고 스킵은 영원히 못 탐 — ①만 고치면
          #   증상이 "빈 값"에서 "매번 배포 진행"으로 바뀔 뿐 근본은 그대로였을 것).
          #   → Artifact Registry에 그 digest를 가리키는 태그를 역질의해(같은 digest에
          #   COMMIT_SHA 태그와 `latest-dev` 플로팅 태그가 동시에 붙어 있음, 실측 확認) 40자
          #   git SHA 패턴만 골라낸다.
          cloudrun_skip="false"
          serving_revision="$(gcloud run services describe sprintable-realtime-dev \
            --region="${AR_REGION}" --project="${GCP_PROJECT}" \
            --format=json 2>/dev/null \
            | jq -r '.status.traffic[]? | select(.percent==100) | .revisionName' 2>/dev/null \
            | head -1 || echo '')"
          if [ -z "${serving_revision}" ]; then
            echo "[cloudrun] 100% 트래픽 서빙 리비전을 못 읽음(최초 배포이거나 트래픽 스플릿 중) — 배포 진행"
          else
            serving_digest="$(gcloud run revisions describe "${serving_revision}" \
              --region="${AR_REGION}" --project="${GCP_PROJECT}" \
              --format='value(spec.containers[0].image)' 2>/dev/null || echo '')"
            if [ -z "${serving_digest}" ] || [ "${serving_digest#*@}" = "${serving_digest}" ]; then
              echo "[cloudrun] 서빙 리비전 이미지 digest를 못 읽음 — 배포 진행"
            else
              cloudrun_last_sha="$(gcloud artifacts docker tags list "${serving_digest%@*}" \
                --filter="version:${serving_digest#*@}" \
                --format='value(tag)' 2>/dev/null \
                | sed 's#.*/##' | grep -E '^[0-9a-f]{40}$' | head -1 || echo '')"
              if [ -z "${cloudrun_last_sha}" ]; then
                echo "[cloudrun] 서빙 digest를 가리키는 커밋 SHA 태그를 못 찾음 — 배포 진행"
              elif bash backend/scripts/check_realtime_relevant_diff.sh "${cloudrun_last_sha}" "${GITHUB_SHA}"; then
                echo "[cloudrun] 관련 경로 변경 있음 — 배포 진행"
              else
                echo "[cloudrun] ${cloudrun_last_sha}..${GITHUB_SHA} 사이 realtime-관련 경로 변경 없음 — 스킵"
                cloudrun_skip="true"
              fi
            fi
          fi

          echo "gce_skip=${gce_skip}" >> "$GITHUB_OUTPUT"
          echo "cloudrun_skip=${cloudrun_skip}" >> "$GITHUB_OUTPUT"

      # story #2827 P0 핫픽스 2차(2026-08-03, 페드루 dispatch-test 실측) — 1차 핫픽스가 조립
      # 로직을 "Set deploy environment" 스텝(위, 이미 표현식 1개+대량 주석으로 16000자대) 안에
      # 넣었더니 그 스텝이 "Exceeded max expression length 21000"으로 새로 걸렸다(주석 삭제로도
      # 해결 안 됨 — 이 스텝 run 블록 자체가 GH 표현식을 하나라도 품으면 전체가 하나로 템플릿
      # 컴파일되는 듯). ⇒ 대량 텍스트 스텝 안에 조립 로직을 더하는 대신, 이 별도의 작고 짧은
      # 스텝에서 env: 매핑(각 항목이 독립된 짧은 표현식 — run 블록 문자열에 섞여 들어가지
      # 않는다)으로 25개 값을 받아 순수 bash(GH 표현식 0개)로만 조립한다.
      - name: Assemble Cloud Build substitutions
        id: subst
        env:
          V_DEPLOY_ENV: ${{ steps.env.outputs.target }}
          V_FASTAPI_URL: ${{ steps.env.outputs.fastapi_url }}
          # story #3079 — 위 gate 스텝이 prod에선 안 도므로(if: target==dev) 빈 문자열일 수
          # 있다 — SUBST 조립부에서 빈 값을 "false"(=배포 진행, 기존 fail-safe 방향과 동일)로
          # 명시 치환한다.
          V_REALTIME_GCE_SKIP: ${{ steps.realtime_gate.outputs.gce_skip }}
          V_REALTIME_CLOUDRUN_SKIP: ${{ steps.realtime_gate.outputs.cloudrun_skip }}
          V_BACKEND_MIN_INSTANCES: ${{ steps.env.outputs.backend_min_instances }}
          V_BACKEND_MAX_INSTANCES: ${{ steps.env.outputs.backend_max_instances }}
          V_DB_POOL_SIZE: ${{ steps.env.outputs.db_pool_size }}
          V_DB_MAX_OVERFLOW: ${{ steps.env.outputs.db_max_overflow }}
          V_BACKEND_DB_PGBOUNCER: ${{ steps.env.outputs.backend_db_pgbouncer }}
          V_BACKEND_TIMEOUT: ${{ steps.env.outputs.backend_timeout }}
          V_GA4_MEASUREMENT_ID: ${{ steps.env.outputs.ga4_measurement_id }}
          V_REALTIME_MIN_INSTANCES: ${{ steps.env.outputs.realtime_min_instances }}
          V_REALTIME_MAX_INSTANCES: ${{ steps.env.outputs.realtime_max_instances }}
          V_REALTIME_TIMEOUT: ${{ steps.env.outputs.realtime_timeout }}
          V_REALTIME_URL: ${{ steps.env.outputs.realtime_url }}
          V_BACKEND_PG_LISTEN_ENABLED: ${{ steps.env.outputs.backend_pg_listen_enabled }}
          V_BACKEND_REDIS_CONSUME_ENABLED: ${{ steps.env.outputs.backend_redis_consume_enabled }}
          V_BACKEND_REDIS_DISPATCH_ENABLED: ${{ steps.env.outputs.backend_redis_dispatch_enabled }}
          V_REDIS_URL: ${{ steps.env.outputs.redis_url }}
          V_BACKEND_REDIS_DUAL_PUBLISH_ENABLED: ${{ steps.env.outputs.backend_redis_dual_publish_enabled }}
          V_BACKEND_FANOUT_WAKE_REDIS_ENABLED: ${{ steps.env.outputs.backend_fanout_wake_redis_enabled }}
          V_SSE_MULTIPLEX_ENABLED: ${{ steps.env.outputs.sse_multiplex_enabled }}
          V_EE_ENABLED: ${{ steps.env.outputs.ee_enabled }}
          V_SUPPORT_WIDGET_ENABLED: ${{ steps.env.outputs.support_widget_enabled }}
          V_SUPPORT_CONTACT_SURFACE_WIDGET: ${{ steps.env.outputs.support_contact_surface_widget }}
          V_SUPPORT_ESCALATION_REQUESTER_MEMBER_ID: ${{ steps.env.outputs.support_escalation_requester_member_id }}
          V_SUPPORT_ESCALATION_APPROVER_MEMBER_ID: ${{ steps.env.outputs.support_escalation_approver_member_id }}
          V_SUPPORT_GATEWAY_CORS_ORIGINS: ${{ steps.env.outputs.support_gateway_cors_origins }}
          V_NEXT_PUBLIC_SUPPORT_GATEWAY_URL: ${{ steps.env.outputs.next_public_support_gateway_url }}
          V_SUPPORT_GATEWAY_DEPLOY_ENABLED: ${{ steps.env.outputs.support_gateway_deploy_enabled }}
          V_SUPPORT_GATEWAY_SERVICE_ACCOUNT: ${{ steps.env.outputs.support_gateway_service_account }}
          V_LICENSE_CONSENT: ${{ steps.env.outputs.license_consent }}
          V_TOSS_CLIENT_KEY: ${{ steps.env.outputs.toss_client_key }}
          V_NEXT_PUBLIC_APP_URL: ${{ steps.env.outputs.next_public_app_url }}
          V_BACKEND_PRESENCE_REDIS_ENABLED: ${{ steps.env.outputs.backend_presence_redis_enabled }}
          V_BACKEND_PRESENCE_ONLINE_REDIS_ENABLED: ${{ steps.env.outputs.backend_presence_online_redis_enabled }}
          V_BACKEND_SSE_LEASE_REDIS_ENABLED: ${{ steps.env.outputs.backend_sse_lease_redis_enabled }}
          V_FRONTEND_MIN_INSTANCES: ${{ steps.env.outputs.frontend_min_instances }}
          V_FRONTEND_MAX_INSTANCES: ${{ steps.env.outputs.frontend_max_instances }}
          V_BACKEND_SSE_TRANSIENT_REPLAY_ENABLED: ${{ steps.env.outputs.backend_sse_transient_replay_enabled }}
          V_MCP_ALLOWED_HOSTS: ${{ steps.env.outputs.mcp_allowed_hosts }}
          # [P1] iOS TestFlight 구글 로그인 후 404 인시던트(#3499 리뷰 delta) — AASA 라우트가
          # 읽는 env 2종. REALTIME_URL과 동일 패턴(env별 값·deploy-frontend --update-env-vars).
          V_APPLE_TEAM_ID: ${{ steps.env.outputs.apple_team_id }}
          V_MOBILE_APP_LINK_ORIGIN: ${{ steps.env.outputs.mobile_app_link_origin }}
          # story aec3ec09([P1 후속] OAuth 핸드오프 활성화) — backend firebase_oauth_handoff_enabled.
          V_FIREBASE_OAUTH_HANDOFF_ENABLED: ${{ steps.env.outputs.firebase_oauth_handoff_enabled }}
        run: |
          # story #3079 — prod push는 위 gate 스텝이 안 돌아(if: target==dev) 빈 문자열이다.
          # 빈 값을 "false"(=배포 진행, 기존 fail-safe 방향과 동일)로 명시 치환 — cloudbuild.yaml
          # 쪽은 정확히 "true" 문자열만 스킵으로 취급하므로 다른 값은 전부 안전측(배포)이다.
          V_REALTIME_GCE_SKIP="${V_REALTIME_GCE_SKIP:-false}"
          V_REALTIME_CLOUDRUN_SKIP="${V_REALTIME_CLOUDRUN_SKIP:-false}"
          SUBST="_DEPLOY_ENV=\"${V_DEPLOY_ENV}\",_FASTAPI_URL=\"${V_FASTAPI_URL}\",_BACKEND_MIN_INSTANCES=\"${V_BACKEND_MIN_INSTANCES}\",_BACKEND_MAX_INSTANCES=\"${V_BACKEND_MAX_INSTANCES}\",_DB_POOL_SIZE=\"${V_DB_POOL_SIZE}\",_DB_MAX_OVERFLOW=\"${V_DB_MAX_OVERFLOW}\",_BACKEND_DB_PGBOUNCER=\"${V_BACKEND_DB_PGBOUNCER}\",_BACKEND_TIMEOUT=\"${V_BACKEND_TIMEOUT}\",_GA4_MEASUREMENT_ID=\"${V_GA4_MEASUREMENT_ID}\",_REALTIME_MIN_INSTANCES=\"${V_REALTIME_MIN_INSTANCES}\",_REALTIME_MAX_INSTANCES=\"${V_REALTIME_MAX_INSTANCES}\",_REALTIME_TIMEOUT=\"${V_REALTIME_TIMEOUT}\",_REALTIME_URL=\"${V_REALTIME_URL}\",_BACKEND_PG_LISTEN_ENABLED=\"${V_BACKEND_PG_LISTEN_ENABLED}\",_BACKEND_REDIS_CONSUME_ENABLED=\"${V_BACKEND_REDIS_CONSUME_ENABLED}\",_BACKEND_REDIS_DISPATCH_ENABLED=\"${V_BACKEND_REDIS_DISPATCH_ENABLED}\",_REDIS_URL=\"${V_REDIS_URL}\",_BACKEND_REDIS_DUAL_PUBLISH_ENABLED=\"${V_BACKEND_REDIS_DUAL_PUBLISH_ENABLED}\",_BACKEND_FANOUT_WAKE_REDIS_ENABLED=\"${V_BACKEND_FANOUT_WAKE_REDIS_ENABLED}\",_SSE_MULTIPLEX_ENABLED=\"${V_SSE_MULTIPLEX_ENABLED}\",_BACKEND_PRESENCE_REDIS_ENABLED=\"${V_BACKEND_PRESENCE_REDIS_ENABLED}\",_BACKEND_PRESENCE_ONLINE_REDIS_ENABLED=\"${V_BACKEND_PRESENCE_ONLINE_REDIS_ENABLED}\",_BACKEND_SSE_LEASE_REDIS_ENABLED=\"${V_BACKEND_SSE_LEASE_REDIS_ENABLED}\",_FRONTEND_MIN_INSTANCES=\"${V_FRONTEND_MIN_INSTANCES}\",_FRONTEND_MAX_INSTANCES=\"${V_FRONTEND_MAX_INSTANCES}\",_BACKEND_SSE_TRANSIENT_REPLAY_ENABLED=\"${V_BACKEND_SSE_TRANSIENT_REPLAY_ENABLED}\",_MCP_ALLOWED_HOSTS=\"${V_MCP_ALLOWED_HOSTS}\",_EE_ENABLED=\"${V_EE_ENABLED}\",_SUPPORT_WIDGET_ENABLED=\"${V_SUPPORT_WIDGET_ENABLED}\",_SUPPORT_CONTACT_SURFACE_WIDGET=\"${V_SUPPORT_CONTACT_SURFACE_WIDGET}\",_SUPPORT_ESCALATION_REQUESTER_MEMBER_ID=\"${V_SUPPORT_ESCALATION_REQUESTER_MEMBER_ID}\",_SUPPORT_ESCALATION_APPROVER_MEMBER_ID=\"${V_SUPPORT_ESCALATION_APPROVER_MEMBER_ID}\",_SUPPORT_GATEWAY_DEPLOY_ENABLED=\"${V_SUPPORT_GATEWAY_DEPLOY_ENABLED}\",_SUPPORT_GATEWAY_SERVICE_ACCOUNT=\"${V_SUPPORT_GATEWAY_SERVICE_ACCOUNT}\",_SUPPORT_GATEWAY_CORS_ORIGINS=\"${V_SUPPORT_GATEWAY_CORS_ORIGINS}\",_NEXT_PUBLIC_SUPPORT_GATEWAY_URL=\"${V_NEXT_PUBLIC_SUPPORT_GATEWAY_URL}\",_LICENSE_CONSENT=\"${V_LICENSE_CONSENT}\",_TOSS_CLIENT_KEY=\"${V_TOSS_CLIENT_KEY}\",_NEXT_PUBLIC_APP_URL=\"${V_NEXT_PUBLIC_APP_URL}\",_REALTIME_GCE_SKIP=\"${V_REALTIME_GCE_SKIP}\",_REALTIME_CLOUDRUN_SKIP=\"${V_REALTIME_CLOUDRUN_SKIP}\",_APPLE_TEAM_ID=\"${V_APPLE_TEAM_ID}\",_MOBILE_APP_LINK_ORIGIN=\"${V_MOBILE_APP_LINK_ORIGIN}\",_FIREBASE_OAUTH_HANDOFF_ENABLED=\"${V_FIREBASE_OAUTH_HANDOFF_ENABLED}\""
          echo "substitutions=${SUBST}" >> "$GITHUB_OUTPUT"

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --substitutions=COMMIT_SHA="${{ github.sha }}",${{ steps.subst.outputs.substitutions }} \
            --suppress-logs \
            .
