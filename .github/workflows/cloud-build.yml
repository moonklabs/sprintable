name: Cloud Build (GCP)

# 2026-08-03 #2829(P0): substitutions 값은 별도 "Assemble Cloud Build substitutions" 스텝에서
# 조립한다 — 단일 run 블록에 GH 표현식을 다수 담으면 GitHub 파서 상한(startup_failure)에 걸린다.
# Submit 스텝에 인라인 나열 금지. 주석에도 리터럴 표현식 토큰 쓰지 말 것.

on:
  # story #3297(2026-09-01, 선생님 지시 — 배포 케이던스가 워크플로우 병목) — develop을 push
  # 트리거에서 뺀다. 실측: develop 머지 31건 = Cloud Build 31회(머지마다 dev 전체 배포).
  # dev 배포는 이제 workflow_dispatch로 PO가 「머지 묶음 완주+CI green+정정 0」일 때 1회
  # (운용 규칙, 코드 밖). main(prod 승격 경로)은 무변 — push 트리거 그대로 유지.
  # env 도출은 "Set deploy environment" 스텝이 github.ref_name만 보고 분기한다(아래
  # inputs.env는 참조되지 않음 — dispatch 시에도 대상 ref가 dev/prod를 가른다는 뜻이라,
  # develop ref로 dispatch하면 이 로직이 그대로 target=dev를 도출한다. 별도 배선 불요).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: 'Deploy environment'
        required: false
        default: ''

concurrency:
  group: cloud-build-${{ github.ref }}
  # 근본원인(2026-07-06, story 6ac3e62f): true였을 때 GHA 워크플로우 실행만 취소되고 이미
  # 원격 GCP에 제출된 Cloud Build는 계속 진행돼, 연속 push 시 먼저 취소된 실행의 원격 빌드가
  # 나중 커밋의 배포를 늦게 덮어써 리비전 역전이 발생했다(GCP 이력상 동시빌드 실재 확認,
  # 07:21↔07:23 겹침). false로 직렬 큐잉해 커밋 순서=배포 순서를 보장한다.
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Workload Identity Federation

jobs:
  cloud-build:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set deploy environment
        id: env
        # #2829 후속(P0): github.ref_name을 env: 매핑으로 빼 이 run 블록의 GH 표현식을 0개로 만든다.
        # run 블록이 GH 표현식을 하나라도 품으면 GitHub이 블록 전체를 하나로 템플릿 컴파일하는데,
        # 이 스텝은 prod 승격 주석까지 포함해 큰 텍스트(main에서 24k+자)라 그 컴파일 단위가 파서
        # 상한을 넘어 startup_failure가 난다. 표현식 0개면 컴파일 안 돼 크기와 무관해진다.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == "main" ]]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "fastapi_url=https://sprintable-backend-prod-787818285179.asia-northeast3.run.app" >> "$GITHUB_OUTPUT"
            # story #2749(2026-08-18, 페드루 PO 지시 — auth.py verify-email/reset-password가
            # 읽는 NEXT_PUBLIC_APP_URL 무배선 정정) — prod는 코드 하드코딩 기본값과 동일값이라
            # 동작 변경 0, SSOT durable화만.
            echo "next_public_app_url=https://app.sprintable.ai" >> "$GITHUB_OUTPUT"
            # ⚠️ minScale 1→3 (prod 콜드스타트 durable 봉합, 오르테가군 PO 2026-07-22): dev #2074 응급대응
            # (a0738e81)이 dev 만 3으로 올리고 prod 는 1로 남았다 — 오늘 아침 prod 콜드스타트가 재발(선생님
            # 격노)해 PO 가 `gcloud run services update` 로 prod minScale=3 을 라이브 적용(승인된 조치).
            # 그 손 값이 다음 prod 배포에 덮여 원복되지 않도록 SSOT 에 못박는다("손 값은 배포가 덮는다" 교훈).
            # conn-safe: min 3 × per-instance 5 = 15 ≤ 200(maxScale 5·rollout 70 예산 불변·SSOT db-connection-budget.md).
            # 근본(커넥션 풀링/아키텍처 재검토)은 #2074 별도 — 이건 응급 봉합의 prod 반영분.
            echo "backend_min_instances=3" >> "$GITHUB_OUTPUT"
            # ⚠️ maxScale 18 (#2448 앱티어 right-size, 2026-08-04) — §6 규모 검증 부하테스트(warm18)와
            # 라이브(rev 00274 수동복원)에서 실증된 값. 과거 maxScale 5 는 앱→primary «직결» 커넥션 예산
            # (5×(pool+overflow)+raw ≤ max_conn 200)에서 나온 값이었으나, 그 전제는 #2445 Phase1 prod
            # PgBouncer cutover(아래 backend_db_pgbouncer=true)로 폐기됐다 — 지금은 앱→primary 가 «전부
            # PgBouncer 경유»(client_addr=PgBouncer VM·직결 raw 0)라 primary max_conn 200 은 PgBouncer
            # 서버풀(default_pool_size 80×2=160 ≤ 200)이 maxScale «무관»하게 보호한다. maxScale 의 예산은
            # 이제 PgBouncer max_client_conn(3000)에 걸린다: client conn 18×70≈1260 ≤ 3000(#2448 실측·
            # rollout 2×=2520 도 ≤ 3000). SSOT 미등재라 배포마다 5로 «명시» 덮여(§6 1차 테스트가 maxScale
            # 5 로 돈 원인) 검증값이 회귀했다 — 여기 못박아 durable화("손 값은 배포가 덮는다").
            echo "backend_max_instances=18" >> "$GITHUB_OUTPUT"
            # story #2442(P0, 2026-08-03) — prod DB 커넥션 풀 고갈 인시던트(08:44Z, QueuePool
            # 타임아웃·/api/v2/health 전면 실패). PgBouncer가 prod에 없거나 무력해(db_pgbouncer=
            # False 코드+배포 양쪽 기본값 — 위 "PgBouncer 풀러 불가" 참고) tiny 앱 풀(3+1=4)이
            # Cloud SQL에 직결돼 즉시 고갈. PO가 gcloud로 20/10(rev 00257-wdz)까지 올려 즉시 회복
            # 확認(health 8/8 200) — 그 손 값을 SSOT로 durable화("손 값은 배포가 덮는다" 교훈).
            # ⚠️ 이 pool/overflow(20/10)의 커넥션 예산은 위 maxScale 주석대로 이제 primary «직결»이 아니라
            # PgBouncer max_client_conn(3000) 기준이다(backend_db_pgbouncer=true). primary max_conn 200 은
            # PgBouncer 서버풀(≤160)이 maxScale 무관 보호 — 과거 5×30≤200 직결 산식은 cutover 로 폐기됐다.
            echo "db_pool_size=20" >> "$GITHUB_OUTPUT"
            echo "db_max_overflow=10" >> "$GITHUB_OUTPUT"
            # story #2445 Phase1(2026-08-04, 페드루) — prod PgBouncer cutover. dev 라이브 검증 + 부하테스트로
            # 사이징 결함 둘(앱풀 2→25/10 · PgBouncer 서버풀 20/200→60/500)을 cutover 前에 교정, DB/PgBouncer
            # 층 검증(60커넥션에 Cloud SQL CPU 9-21% idle). prod 중앙 PgBouncer HA(Regional MIG≥2 + Internal LB
            # VIP 10.178.0.111:6432) 구축·「돌려서」 검증(SELECT 1 왕복·LB HEALTHY×2). 이 true는 아래
            # cloudbuild.yaml deploy-backend의 prod --update-secrets(DATABASE_URL→VIP경유·DATABASE_URL_DIRECT→
            # 직결)와 «같은 배포»에서 동반된다(짝이 깨지면 반쪽 상태 — dev 주석 참고).
            echo "backend_db_pgbouncer=true" >> "$GITHUB_OUTPUT"
            # story #2005: PO 라이브 gcloud 실측(2026-07-17) — backend-prod 현재 유효 Cloud Run
            # 요청 타임아웃=300s. 지금까지 `cloudbuild.yaml`에 `--timeout` 플래그가 없어 이
            # 값은 인프라 기본값이었을 뿐 어디에도 명시돼 있지 않았다 — 이제 이 워크플로우가
            # 명시 소스가 된다(cloudbuild.yaml의 `_BACKEND_TIMEOUT` dev-safe 기본값 3600을
            # prod에서 이 output으로 override, `backend_max_instances`와 동일 배선 패턴).
            echo "backend_timeout=300" >> "$GITHUB_OUTPUT"
            echo "ga4_measurement_id=G-RYHFE7XM3X" >> "$GITHUB_OUTPUT"
            # ⭐story #2123 최종(2026-07-24) — 위 주석이 예고한 "realtime 배선을 마치는 승격 시점"이
            # 왔다. #2123 cutover(consume/dispatch/fanout_wake=true, 이전 커밋)가 배포돼 prod 배차
            # 통로가 Redis로 확定된 것을 라이브 3축으로 실측했다:
            #   ①resolve_backplane 3인스턴스 전부 "redis 우선으로 진행" ②event_broker redis-only
            #   delivery 다수 ③prod agent stream 끝단에 실제 프레임 도착. 오류 3건(전부 안내 로그)뿐.
            # ⇒ PG LISTEN은 이제 중복 경로다. 끄면 인스턴스당 pg_pubsub raw 커넥션 1개가 회수되고
            #   SSE hot-path에서 DB가 빠진다(= 에픽 "PG를 브로커서 해방"의 완결 지점).
            # ⛔되돌리기: 이 값을 true로 되돌리는 것만으로는 부족하다 — Redis dispatch가 켜져 있는 한
            #   resolve_backplane이 계속 redis를 고른다. 롤백은 consume/dispatch를 false로 되돌리는 것.
            # ⭐부수효과: cutover 배포에서 인스턴스마다 1회씩 찍히던 안내 ERROR("REALTIME_BACKPLANE
            # 미설정인데 PG_LISTEN + Redis dispatch 동시 활성")가 이 값으로 **자연 소멸**한다 —
            # resolve_backplane의 그 경고는 "둘 다 켜짐" 조건에서만 나오고, 이제 redis 하나만
            # 켜져 있어 조건 자체가 성립하지 않는다(별도 REALTIME_BACKPLANE 배선 불요).
            echo "backend_pg_listen_enabled=false" >> "$GITHUB_OUTPUT"
            # ⛔story #2078(E-ARCH S2 정리) 정정(#2123, 2026-07-23): "api는 SSE 미서빙"이라
            # false로 뒀었으나 틀린 전제였다(에이전트 SSE는 backend-dev가 직접 서빙 —
            # agent_onboarding_config.py 설계, 라이브 실측 확認). 다만 **prod는 아직 Redis
            # 요소 자체가 없다**(redis_url 빈 값, 아래) — consume/dispatch를 true로 켜도
            # event_broker가 no-op(fail-safe skip)이라 값 자체는 false로 둬도 무해하지만,
            # story #2123 S-b/S-c(2026-07-24, 오르테가 판정 — dev 게이트 통과 확認 後 prod cutover):
            # backend-dev가 consume+dispatch=true로 완전전환·검증 완료. prod Redis 요소(sprintable-
            # redis-prod·REDIS_URL secretKeyRef·GCE realtime 소비자)가 오늘 백플레인 작업으로 전부 서
            # 있고, 백플레인 착지 검증에서 prod redis-only delivery 707건 실동작 확認됨 — Redis를 prod
            # 주 배차 통로로 승격.
            # ⛔중복배달 안전: resolve_backplane(event_broker.py:329)이 PG/Redis 중 하나만 dispatch —
            # redis dispatch=true면 redis 우선(PG는 fallback 발행만·미배차). EVENT_BROKER_OUTBOX_ENABLED
            # =false(코드기본)라 #2138(outbox+dispatch dup) 미발동. PG_LISTEN은 이 커밋에서 유지(Redis
            # 실배차 prod 실측 確認 後 별 커밋에서 false). ⚠️startup에 resolve_backplane이 "REALTIME_
            # BACKPLANE 미설정" 안내 로그 1회 — 동작은 redis 확정(안전)이라 무해, 명시는 후속 정리.
            echo "backend_redis_consume_enabled=true" >> "$GITHUB_OUTPUT"
            echo "backend_redis_dispatch_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2141 S-a(E-ARCH, 2026-07-23 오르테가군 확定 순서) — prod Redis 인스턴스
            # READY(sprintable-redis-prod, AUTH 켬)이고, backend-prod Cloud Run에 REDIS_URL
            # secretKeyRef=REDIS_URL_PROD 바인딩이 실제로 붙어 있는 것 확認됐다(오르테가
            # --update-secrets 실행, 리비전 00231-lxm→00232-mmm, env 32→33·시크릿 13→14,
            # ping 200 — 2026-07-23). ⇒ 이 커밋이 dual_publish=true를 실배포하는 첫 안전한
            # 시점이다(바인딩 전에 켜면 REDIS_URL 없이 발행을 시도해 깨졌을 자리).
            # redis_url output은 여기 안 둔다 — prod는 cloudbuild.yaml deploy-backend가
            # ${_DEPLOY_ENV}==prod일 때 REDIS_URL을 ENV_VARS에 아예 안 실으므로(#2421) plain
            # substitution 경로 자체가 없다(시크릿 바인딩만 유효 경로).
            # ⛔S-a는 dual_publish 하나만 켠다 — consume/dispatch는 각각 별 커밋(S-b/S-c,
            # #2141 §3)이며, PG_LISTEN_ENABLED는 이 단계에서 손대지 않는다(prod의 유일한
            # 실시간 배차 경로라 Redis 도달 확認 前에 끄면 실시간이 전면 정지한다).
            echo "redis_url=" >> "$GITHUB_OUTPUT"
            echo "backend_redis_dual_publish_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2123 S0-b(2026-07-23, 오르테가군 판정): wake_agent 크로스인스턴스 배달의
            # 발행측 스위치.
            # ⛔#2141 S-a 반영 후 정정 — 이 주석이 여태 "prod는 아직 dual_publish/redis_url
            # 자체가 없다"를 근거로 들었으나, 위 dual_publish가 이제 true다(그 전제는 낡았다).
            # 그래도 결론(false 유지)은 그대로 맞다 — 이유가 바뀐 것뿐: consume/dispatch가
            # 아직 false라 event_broker가 Redis로 publish는 해도(dual_publish) 그걸 구독해서
            # 실 전달(dispatch)하는 쪽이 꺼져 있다. dispatch 없이 이 스위치만 켜봐야 무의미하고,
            # story #2123 S-b/S-c(2026-07-24): consume/dispatch를 위에서 켰으므로 wake_agent 발행측도
            # Redis로 승격(대칭). dev 완전전환·검증됨.
            echo "backend_fanout_wake_redis_enabled=true" >> "$GITHUB_OUTPUT"
            # story #2078(E-ARCH 0단계, 오르테가군 판정 2026-07-21): dev 실측 GREEN 확認 전
            # prod에 얹지 않는다 — develop→main 48커밋 일괄승격에 검증 안 된 롤백 플래그를
            # 섞으면 문제 발생 시 원인 격리가 안 된다. dev 실측 후 별도 판단.
            echo "sse_multiplex_enabled=false" >> "$GITHUB_OUTPUT"
            # story #2728 후속(2026-08-17, 페드루 PO 지시) — NEXT_PUBLIC_EE_ENABLED가 이 파이프라인
            # 어디에도 배선된 적이 없어(cloudbuild.yaml·Dockerfile 전부 무배선) dev FE billing 표면이
            # 아예 안 떴다. prod는 이 커밋으로 무접촉(값을 새로 켜는 게 아니라 기존 동작 그대로
            # 명시 false로 durable화만 — Toss 심사 前 결제 표면은 여전히 이 값과 무관하게
            # platform_settings.billing_checkout_enabled 서버측 게이트가 막는다, #2728 별건 PR).
            echo "ee_enabled=false" >> "$GITHUB_OUTPUT"
            # story #3260(2026-08-31, 페드루 PO 조건부 승인 — "UI는 있는데 서버가 없음"
            # 결함 클래스 재발 방지) — Support Gateway(#f2a27d2a) 착지·AC2/AC3(Gateway
            # 경유·본체 SSE와 분리) 실측 통과 前까지 prod는 명시 false(무접촉).
            echo "support_widget_enabled=false" >> "$GITHUB_OUTPUT"
            # story #3263(지원v1·5에스컬레이션, 페드루 PO 확定 2026-08-31) — 메일 카피가
            # 위젯 승격보다 먼저 위젯을 가리키면 새 fiction이 재발한다. 위 support_widget_
            # enabled와 같은 커밋·같은 분기에서 함께 false → 위젯 prod 승격 때 함께 true로.
            echo "support_contact_surface_widget=false" >> "$GITHUB_OUTPUT"
            # story #3260 Phase 2(2026-08-31) — Support Gateway prod 미배포(아래
            # support_gateway_deploy_enabled=false) 상태라 CORS·widget URL 둘 다 무접촉.
            echo "support_gateway_cors_origins=" >> "$GITHUB_OUTPUT"
            echo "next_public_support_gateway_url=" >> "$GITHUB_OUTPUT"
            # story #f2a27d2a(지원v1·1경계, 2026-08-31 페드루 PO — Gateway flip PR) — prod
            # 자원(전용 SA·전용 DB·시크릿) 미프로비저닝 상태라 명시 false(무접촉). dev만
            # 프로비저닝 완료(support-gateway-dev@sprintable-494803.iam.gserviceaccount.com·
            # sprintable-dev 인스턴스 내 전용 database support_gateway+전용 user support_gw).
            echo "support_gateway_deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "support_gateway_service_account=" >> "$GITHUB_OUTPUT"
            # story #3263 AC4(2026-09-01, 페드루 PO 지시) — 에스컬레이션 게이트/DM
            # requester/approver team_members.id. prod는 support_gateway_deploy_enabled와
            # 동형 무접촉(빈 문자열 — 이 스토리 스코프가 dev 검증까지).
