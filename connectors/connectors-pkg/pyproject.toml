[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# E-CONNECT-PKG S1(2026-08-03): 배포 수단 PyPI(기존 sprintable_mcp 파이프라인 재사용 —
# .github/workflows/publish-mcp.yml, sprintable 0.1.2 실물). 이름 확定(페드루, 2026-08-03) —
# 기존 PyPI 패키지 "sprintable"과 짝이 맞고 다른 후보가 더 나을 이유가 없어 "sprintable-connectors"로.
name = "sprintable-connectors"
version = "0.0.1"
description = "Sprintable Gateway agent connectors (codex/gemini/grok/pi/cursor) — no repo clone required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sprintable" }]
keywords = ["sprintable", "agent", "gateway", "sse", "byoa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
sprintable-connector = "sprintable_connectors.__main__:main"

[project.urls]
Homepage = "https://sprintable.ai"

[tool.hatch.build.targets.wheel]
packages = ["sprintable_connectors"]
