# story 4796 — one VM per environment: database, migrate (one-shot), backend, frontend, front door.
#
# Everything that differs per deploy comes from the process environment of `docker compose` (set by bin/deployer.py):
#   BACKEND_IMAGE / FRONTEND_IMAGE  full image references (by digest or sha tag)
#   API_HOST / REALTIME_HOST / APP_HOST / ACME_EMAIL   the public names (from env/<environment>.yaml)
#   DB_USER / DB_NAME / DATA_DIR    database user, name, and the host folder on the data disk
#   CADDYDIR                         the folder holding the live Caddyfile (mounted as a folder so the deployer can replace the file atomically)
# Secrets and the service variables are passed BY NAME through the override file render_env.py writes (-f pass-through.yml);
# their values exist only in the environment of the compose command. No .env file, no value in this repository.
#
# Only caddy publishes ports to the world (80, 443). The database, backend and frontend are reachable on the compose network only. One more server listens, on the VM's PRIVATE address only: the support
# gateway's own database (`gateway-db` below, RUNBOOK §13) — behind a firewall rule that admits the gateway's Cloud Run revisions and nobody else.

name: sprintable

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # pgvector is required: the migrations run CREATE EXTENSION vector. pg15 = what Cloud SQL runs today (cloudsql.txt), so the dump restores as it is.
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD:   # by name — the value comes from the deployer's environment
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=1000
    volumes:
      - ${DATA_DIR:?}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # the support gateway's database (story 4796): a SECOND, small Postgres of its own — own data folder, own users, own docker network — because the gateway runs on Cloud Run and reaches it over the VPC.
  # This is the only server of the VM that listens on a private address; nothing of the backend (its database, role or password) is in it, and the backend's containers cannot reach it.
  #  · its superuser (POSTGRES_USER) has no password and no way in over any network address — only the unix socket inside the container (docker exec): the access rules are the mounted hba file
  #    (rendered by the deployer from support_gateway.allow_from; the default file lets nobody in), and gateway-db-init.sh replaces the data folder's own hba file before the server first listens;
  #  · the application's role (GATEWAY_APP_USER) is an ordinary role that owns the gateway's database and nothing else; the init script creates it on the first start of an EMPTY data folder only
  #    (changing the secret later does not change the database, as with the main one);
  #  · bound on the VM's private address (GATEWAY_DB_BIND, read by the deployer from the metadata server) — the fallback is the loopback address, never «all»;
  #  · on its own bridge `br-gwdb`, from which the metadata server is unreachable (bin/gateway-db-firewall.sh; the deployer checks it from inside before a release is swapped in);
  #  · the server never logs the values a statement ran with (customer text) — only the statement.
  # Started for a release whose declaration has the `support_gateway` block (the deployer adds `--profile gateway-db`).
  gateway-db:
    image: pgvector/pgvector:pg15
    profiles: ["gateway-db"]
    # «no», on purpose: after a boot or a restart of docker nothing but sprintable-gateway-db-firewall.service starts this container, and only once the rule that keeps the metadata server out of its reach is in place
    restart: "no"
    logging: *logging
    networks:
      - gateway-db
    environment:
      POSTGRES_DB: ${GATEWAY_DB_NAME:-support_gateway}
      POSTGRES_USER: ${GATEWAY_DB_ADMIN:-gw_admin}
      POSTGRES_HOST_AUTH_METHOD: trust   # first start only, so that no superuser password has to exist; the init script swaps the data folder's hba file for the strict one at once
      GATEWAY_APP_USER: ${GATEWAY_DB_USER:-support_gw}
      GATEWAY_APP_PASSWORD: ${GATEWAY_DB_PASSWORD:-}   # from the deployer's environment; read by the init script of the first start
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30   # worst case 16 while a Cloud Run revision is replaced (RUNBOOK §13), 27 usable after the 3 reserved for the superuser
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    ports:
      - "${GATEWAY_DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ${DATA_DIR:?}/gateway-postgres:/var/lib/postgresql/data
      - ${GATEWAY_DB_HBA:-./gateway-db-pg_hba.conf}:/etc/postgresql/pg_hba.conf:ro
      - ./gateway-db-init.sh:/docker-entrypoint-initdb.d/10-gateway-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # one-shot: `docker compose run --rm migrate` — run by the deployer BEFORE the new backend replaces the running one.
  migrate:
    image: ${BACKEND_IMAGE:?}
    profiles: ["migrate"]
    restart: "no"
    logging: *logging
    command: ["/app/scripts/migrate.sh"]
    environment:
      - ALEMBIC_DATABASE_URL   # by name
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:?}
    restart: unless-stopped
    logging: *logging
    # the service variables are listed by name in pass-through.yml. SPRINTABLE_LOCAL_DEV and K_SERVICE are never set here (render_env.py refuses them).
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:?}
    restart: unless-stopped
    logging: *logging
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      API_HOST: ${API_HOST:?}
      REALTIME_HOST: ${REALTIME_HOST:?}
      APP_HOST: ${APP_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYDIR:?}:/etc/caddy:ro
      - ${DATA_DIR:?}/caddy:/data

networks:
  gateway-db:
    driver_opts:
      com.docker.network.bridge.name: br-gwdb   # a fixed name, so that the firewall rule of bin/gateway-db-firewall.sh can name it
