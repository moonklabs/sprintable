# story 4796 — the support gateway's database server: the DEFAULT access rules, which let nobody in over the network. The deployer renders the real file (runtime/gateway-db-pg_hba.conf) from
# env/<environment>.yaml (support_gateway.allow_from); this one is what compose falls back to where nothing was rendered, so a missing file can never mean a wider door.
local   all   all                 trust
host    all   all   0.0.0.0/0     reject
host    all   all   ::/0          reject
